<div
  id="waveContainer"
  style="
    display: none;
    position: fixed;
    inset: 0;
    z-index: 5;
    overflow: hidden;
    pointer-events: none;
  "
></div>

<div
  id="oceanContainer"
  style="
    display: none;
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  "
>
  <div id="ocean" class="ocean"></div>
</div>

<video
  id="bgVideo"
  muted
  autoplay
  loop
  playsinline
  style="
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  "
></video>

<div
  id="bgImage"
  style="
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    pointer-events: none;
  "
></div>
<canvas
  id="bgCanvas"
  style="
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    pointer-events: none;
  "
></canvas><div
  id="overlay"
  style="
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  "
></div><div
