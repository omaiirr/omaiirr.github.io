<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>
    {% if page.layout == "home" %} {{ site.title }} {% else %} {{ site.title }}
    &middot; {{ page.title }} {% endif %}
  </title>

  <link
    rel="stylesheet"
    href="{{ '/assets/css/bootstrap.min.css' | relative_url }}"
  />
  <link
    rel="stylesheet"
    href="{{ '/assets/css/open-color.min.css' | relative_url }}"
  />
  <link rel="stylesheet" href="{{ '/assets/css/syntax.css' | relative_url }}" />
  <link
    rel="stylesheet"
    href="{{ '/assets/css/styles.min.css' | relative_url }}"
  />
  {% if page.title == "Pomora" %}
  <link rel="stylesheet" href="{{ '/assets/css/timer.css' | relative_url }}" />
  <link
    rel="stylesheet"
    href="{{ '/assets/css/theme-bg-elements.css' | relative_url }}"
  />
  <link
    rel="stylesheet"
    href="{{ '/assets/css/theme-editor.css' | relative_url }}"
  />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  {% endif %}

  <link
    rel="alternate"
    type="application/atom+xml"
    title="{{ site.title }}"
    href="{{ 'atom.xml' | relative_url }}"
  />

  <link
    rel="icon"
    type="image/svg+xml"
    href="{{ '/assets/logo.svg' | relative_url }}"
  />

  {% seo title=false %}
</head>
