<div class="patch-notes-popup" id="patchNotesPopup">
  <div class="patch-notes-card">
    <div class="patch-notes-header">
      <div>
        <p class="patch-notes-eyebrow">Release Notes</p>
        <h2 class="patch-notes-title">What&rsquo;s new</h2>
        <p class="patch-notes-subtitle" id="patchNotesSubtitle"></p>
      </div>
      <button
        class="patch-notes-close"
        id="patchNotesCloseBtn"
        aria-label="Close"
      >
        {% include svg/uo-line-close.svg %}
      </button>
    </div>

    <div class="patch-notes-body" id="patchNotesList">
      <!-- Notes render dynamically -->
    </div>
  </div>
</div>

<div class="update-notice-popup" id="updateNoticePopup">
  <div class="update-notice-card">
    <div class="update-notice-header">
      <div>
        <p class="patch-notes-eyebrow">Update Available</p>
        <h2 class="patch-notes-title" id="updateNoticeTitle">
          New release is live
        </h2>
        <div class="update-notice-meta">
          <span class="patch-notes-version" id="updateNoticeVersion"></span>
          <span class="update-notice-date" id="updateNoticeDate"></span>
        </div>
      </div>
      <button
        class="patch-notes-close"
        id="dismissUpdateNoticeBtn"
        aria-label="Close"
      >
        {% include svg/uo-line-close.svg %}
      </button>
    </div>
    <p class="update-notice-text" id="updateNoticeSummary"></p>
    <div class="update-notice-chips" id="updateNoticeChips"></div>
    <div class="update-notice-actions">
      <button
        type="button"
        id="dismissUpdateNoticeLaterBtn"
        class="update-notice-later-btn"
      >
        Later
      </button>
      <button
        type="button"
        id="viewPatchNotesFromUpdateBtn"
        class="patch-notes-primary-btn"
      >
        View release notes
      </button>
    </div>
  </div>
</div>
