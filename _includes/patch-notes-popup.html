<div class="patch-notes-popup" id="patchNotesPopup">
  <div class="patch-notes-card">
    <div class="patch-notes-header">
      <div>
        <p class="patch-notes-eyebrow">Patch Notes</p>
        <h2 class="patch-notes-title">Recent Updates</h2>
      </div>
      <button class="patch-notes-close" id="patchNotesCloseBtn">×</button>
    </div>

    <div class="patch-notes-body" id="patchNotesList">
      <!-- Notes render dynamically -->
    </div>
  </div>
</div>

<div class="update-notice-popup" id="updateNoticePopup">
  <div class="update-notice-card">
    <div class="update-notice-header">
      <div>
        <p class="patch-notes-eyebrow">Update Available</p>
        <h2 class="patch-notes-title">New patch is live</h2>
      </div>
      <button class="patch-notes-close" id="dismissUpdateNoticeBtn">×</button>
    </div>
    <p class="update-notice-text">
      There has been an update since your last visit. Check out the patch notes
      for full details.
    </p>
    <div class="update-notice-actions">
      <button id="viewPatchNotesFromUpdateBtn" class="fs-btn">
        View patch notes
      </button>
    </div>
  </div>
</div>
