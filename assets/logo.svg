<svg width="1400" height="416" viewBox="0 0 1400 416" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Third (dashed) ticket. The previous outline was a 6.2k of hand-authored
     dash segments: at the header size (32px tall, so 1 rendered px = 13 viewBox
     units) its 4-unit ribbon collapsed to ~0.3px, and its left border sat at
     x=931 — under the middle ticket, which ends at 937 — so the seam was hidden
     and cut across the tab joint. Now the outline is one real dashed rounded
     rect: left edge at the seam (x=937), a gap where the middle ticket tab
     crosses it, and a 9-unit ribbon with a 30/22 dash so the dashes survive
     downscaling. vector-effect="non-scaling-stroke" is deliberately NOT used:
     it would pin the ribbon to 9 DEVICE px (≈4x too heavy at 32px); a scaled
     stroke keeps it proportional at every size. -->
