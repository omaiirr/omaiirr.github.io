<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Preview — ocean</title>
<style>
  body { background:#101018; color:#e8e8ee; font-family:system-ui; margin:0; padding:16px; display:flex; flex-direction:column; gap:10px; align-items:center; }
  canvas { width:min(960px, 94vw); aspect-ratio:16/10; background:#000; border-radius:10px; }
  #opts { display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:center; font-size:13px; color:#bbb; }
  input[type=range], input[type=color] { vertical-align:middle; }
  button { background:#2a2a35; color:#e8e8ee; border:1px solid #4a4a5a; border-radius:6px; padding:4px 12px; font-size:13px; cursor:pointer; }
  button:hover { background:#3a3a48; }
  #info { font-size:12px; color:#888; }
</style>
</head>
<body>
<div id="opts"></div>
<button id="reroll" type="button">↻ Re-roll layout</button>
<canvas id="c" width="1280" height="800"></canvas>
<div id="info"></div>
<script>
// core.js — ThemeScenes core (registry + shared helpers + runtime).
// Generated by scripts/split-scenes.js from the pre-split assets/js/theme-scenes.js
// (2026-09-04). Helpers/runtime bodies are verbatim; additions: register(),
// __helpers export, empty SCENES registry (populated by per-scene modules).
// NOTE: named core.js, not _core.js — Jekyll drops underscore-prefixed files
// from static dirs, so the underscore prefix would 404 on the live site.
const ThemeScenes = (() => {
  const SCENES = {};

  function register(id, def) { SCENES[id] = def; }

  let _snowSpriteCache = null;
  function _makeSnowSprites() {
    const levels = [];
    for (let lv = 0; lv < 4; lv++) {
      const frames = [];
      const sz = 32;
      for (let fi = 0; fi < 16; fi++) {
        const c = document.createElement('canvas');
        c.width = c.height = sz;
        const x = c.getContext('2d');
        const cx = sz / 2, cy = sz / 2;
        const rot = (fi / 16) * Math.PI * 2;
        const arms = lv + 3;
        const armLen = sz * 0.35;
        const coreR = sz * (0.06 + lv * 0.02);
        x.save();
        x.translate(cx, cy);
        x.rotate(rot);
        // core glow
        const glow = x.createRadialGradient(0, 0, 0, 0, 0, coreR * 3);
        glow.addColorStop(0, 'rgba(232,237,245,0.5)');
        glow.addColorStop(1, 'rgba(232,237,245,0)');
        x.fillStyle = glow;
        x.beginPath(); x.arc(0, 0, coreR * 3, 0, Math.PI * 2); x.fill();
        // crystal arms
        x.strokeStyle = 'rgba(232,237,245,0.9)';
        x.lineWidth = 1 + lv * 0.3;
        x.lineCap = 'round';
        for (let a = 0; a < arms; a++) {
          const angle = (a / arms) * Math.PI * 2;
          x.beginPath();
          x.moveTo(0, 0);
          x.lineTo(Math.cos(angle) * armLen, Math.sin(angle) * armLen);
          x.stroke();
          // side branches on larger flakes
          if (lv >= 1) {
            const bLen = armLen * 0.4;
            const bDist = armLen * 0.6;
            const bx = Math.cos(angle) * bDist;
            const by = Math.sin(angle) * bDist;
            for (let s = -1; s <= 1; s += 2) {
              const ba = angle + s * Math.PI / 4;
              x.beginPath();
              x.moveTo(bx, by);
              x.lineTo(bx + Math.cos(ba) * bLen, by + Math.sin(ba) * bLen);
              x.stroke();
            }
          }
        }
        // center dot
        x.fillStyle = 'rgba(255,255,255,0.9)';
        x.beginPath(); x.arc(0, 0, coreR, 0, Math.PI * 2); x.fill();
        x.restore();
        frames.push(c);
      }
      levels.push(frames);
    }
    return levels;
  }

  function _mixHex(hex1, hex2, t) {
    const [r1, g1, b1] = _hexToRgb(hex1);
    const [r2, g2, b2] = _hexToRgb(hex2);
    return `rgb(${Math.round(r1 + (r2 - r1) * t)},${Math.round(g1 + (g2 - g1) * t)},${Math.round(b1 + (b2 - b1) * t)})`;
  }

  function _hexToRgb(hex) {
    if (!hex || typeof hex !== "string") return [167, 139, 250];
    const clean = hex.replace("#", "");
    if (clean.length < 6) return [167, 139, 250];
    return [parseInt(clean.slice(0, 2), 16), parseInt(clean.slice(2, 4), 16), parseInt(clean.slice(4, 6), 16)];
  }

  function resetComet(c, w, h, speed) {
    c.vx = (Math.random() - 0.5) * 200;
    c.vy = (Math.random() - 0.5) * 200;
    c.speed = (Math.random() * 0.5 + 0.5) * speed;
    c.trail = [];
    c.maxTrail = Math.floor(Math.random() * 20 + 15);
    c.alpha = Math.random() * 0.4 + 0.3;
  }

  let activeId = null;
  let rafId = null;
  let canvasEl = null;
  let state = {};
  let lastTime = 0;
  let currentOptions = {};
  let resizeHandler = null;

  function _syncCanvasSize(canvas) {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.floor(rect.width));
    const h = Math.max(1, Math.floor(rect.height));
    const pw = Math.floor(w * dpr), ph = Math.floor(h * dpr);
    const resized = canvas.width !== pw || canvas.height !== ph;
    if (resized) {
      canvas.width = pw; canvas.height = ph;
      const ctx = canvas.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    return { w, h, ctx: canvas.getContext("2d"), resized };
  }

  function stop() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (resizeHandler) { window.removeEventListener("resize", resizeHandler); resizeHandler = null; }
    activeId = null; state = {}; lastTime = 0; currentOptions = {};
    if (canvasEl) {
      canvasEl.style.display = "none";
      canvasEl.style.zIndex = "1";
      canvasEl.style.backgroundColor = "";
      const ctx = canvasEl.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
    }
    canvasEl = null;
  }

  function start(sceneId, options, canvas) {
    stop();
    const scene = SCENES[sceneId];
    if (!scene || !canvas) return false;
    const opts = { ...scene.defaults, ...options };
    activeId = sceneId; currentOptions = opts; canvasEl = canvas;
    canvas.style.display = "block"; state = {};
    let dims = _syncCanvasSize(canvas);
    scene.init(state, dims.w, dims.h, opts);
    resizeHandler = () => { dims = _syncCanvasSize(canvas); scene.init(state, dims.w, dims.h, currentOptions); };
    window.addEventListener("resize", resizeHandler);
    lastTime = performance.now();
    function frame(now) {
      if (!activeId || canvasEl !== canvas) return;
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now; dims = _syncCanvasSize(canvas);
      if (dims.resized) scene.init(state, dims.w, dims.h, currentOptions);
      scene.draw(dims.ctx, dims.w, dims.h, state, currentOptions, dt);
      rafId = requestAnimationFrame(frame);
    }
    rafId = requestAnimationFrame(frame);
    return true;
  }

  function updateOptions(options) {
    if (!activeId || !canvasEl) return;
    const scene = SCENES[activeId];
    currentOptions = { ...scene.defaults, ...options };
    const dims = _syncCanvasSize(canvasEl);
    scene.init(state, dims.w, dims.h, currentOptions);
  }

  function list() {
    return Object.entries(SCENES).map(([id, s]) => ({ id, label: s.label, defaults: s.defaults, options: s.options }));
  }

  function get(id) { return SCENES[id] || null; }
  function isActiveCanvas(canvas) { return canvasEl === canvas; }


  const __helpers = { _hexToRgb, _mixHex, _makeSnowSprites, resetComet };

  return { start, stop, updateOptions, setOptions: updateOptions, list, get, isActiveCanvas, register, SCENES, __helpers };
})();

// ocean/scene.js — ocean waves scene module.
// GROUND-UP REBUILD (2026-09-04): the pre-split ocean code was purged as
// corrupt/broken; this is a fresh implementation written against the reference
// contract. Scene id, label, option keys, defaults, and preset bg colors are
// kept stable so saved themes keep resolving (see
// scene-lab/prior-art/purged-scenes-2026-09-04/ocean.js).
//
// Look: a moonlit open sea at night — a moon over a dark horizon, a shimmering
// reflection path on the water, and receding translucent wave bands whose
// crests roll toward the viewer with perspective (tiny & compressed at the
// horizon, larger and closer-set near the bottom). `speed` drives the waves,
// `intensity` scales wave energy + foam, and `color` tints the water.

(() => {
  const { _hexToRgb } = ThemeScenes.__helpers;

  // rgb helpers operating on [r,g,b] triples
  function _mix(t, a, b) {
    return [
      Math.round(a[0] + (b[0] - a[0]) * t),
      Math.round(a[1] + (b[1] - a[1]) * t),
      Math.round(a[2] + (b[2] - a[2]) * t),
    ];
  }
  function _rgba(c, a) {
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  }

  // Wave-layer descriptors (perspective: near layers sit lower on screen,
  // roll taller, and space their crests wider apart).
  function _buildLayers(h, w) {
    const L = 9;
    const yH = 0.4; // horizon at 40% of the canvas height
    const layers = [];
    for (let i = 0; i < L; i++) {
      const u = i / (L - 1); // 0 = horizon … 1 = bottom of the frame
      const rowY = yH + Math.pow(u, 1.45) * (0.94 - yH); // compressed at horizon
      const amp = h * (0.004 + Math.pow(u, 2) * 0.05); // taller as they near
      const waveLen = w * (0.34 + 1.25 * Math.pow(u, 1.15)); // crest spacing
      const k = (Math.PI * 2) / waveLen;
      const travel = 12 + 52 * Math.pow(u, 1.6); // crest speed px/s
      layers.push({ u, rowY, amp, k, travel, ph: i * 1.9 });
    }
    return layers;
  }

  // Crest screen y at x for one layer (px), given phase clock t.
  function _crestY(x, h, L, t, i01) {
    const s = Math.sin(L.k * x - t * L.travel * L.k + L.ph);
    const s2 = Math.sin(L.k * 0.53 * x + t * L.travel * 0.42 * L.k + L.ph * 2.3);
    const surge = 0.85 + 0.15 * Math.sin(t * 0.18 + L.u * 4);
    const amp = L.amp * (0.55 + 0.65 * i01) * surge;
    return L.rowY * h + (s * 0.7 + s2 * 0.3) * amp;
  }

  ThemeScenes.register("ocean", {
    label: "Ocean Waves",
    defaults: { speed: 1, intensity: 70, color: "#0ea5e9" },
    presetBgColors: ["#020617", "#000000", "#0a1a2e", "#0f172a", "#0a1a1a", "#0d1117"],
    options: [
      { key: "speed", label: "Speed", type: "range", min: 0.3, max: 3, step: 0.1 },
      { key: "intensity", label: "Intensity", type: "range", min: 20, max: 100, step: 5 },
      { key: "color", label: "Wave Color", type: "color" },
    ],
    init(state, w, h, opts) {
      state.t = 0;
      const [cr, cg, cb] = _hexToRgb(opts.color || "#0ea5e9");
      state.waveRGB = [cr, cg, cb];
      // deep water is the wave color pulled toward a dark navy
      state.deepRGB = [Math.round(cr * 0.16), Math.round(cg * 0.2), Math.round(cb * 0.42)];
      state.litRGB = [255, 244, 224]; // moon-warm light on crests
      state.skyRGB = [186, 208, 240]; // cool sky light on far water
      state.layers = _buildLayers(h, w);

      // ── Moon reflection path: sparkles clustered under the moon ───────
      state.shimmers = [];
      const shimmerN = 46;
      for (let i = 0; i < shimmerN; i++) {
        // gaussian-ish horizontal spread so the path is bright at the center
        const g = (Math.random() + Math.random() + Math.random()) / 1.5 - 1;
        state.shimmers.push({
          xOff: g * 0.5, // × column half-width
          yFrac: Math.random(), // 0 at the horizon … 1 at the bottom
          len: 4 + Math.random() * 14,
          phase: Math.random() * Math.PI * 2,
          twSp: 2 + Math.random() * 6,
        });
      }

      // ── Faint stars in the upper sky ──────────────────────────────────
      state.stars = [];
      for (let i = 0; i < 34; i++) {
        state.stars.push({
          x: Math.random(),
          y: Math.pow(Math.random(), 1.5) * 0.3,
          s: 0.4 + Math.random() * 0.9,
          a: 0.1 + Math.random() * 0.24,
          ph: Math.random() * Math.PI * 2,
        });
      }
    },
    draw(ctx, w, h, state, opts, dt) {
      const speed = opts.speed ?? 1;
      const i01 = (opts.intensity ?? 70) / 100;
      const bgColor = opts.bgColor || null;
      state.t += dt;
      const t = state.t * speed;
      const [cr, cg, cb] = state.waveRGB;

      ctx.clearRect(0, 0, w, h);

      // ── Sky (to the horizon) ──────────────────────────────────────────
      const horizon = h * 0.4;
      if (bgColor) {
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, w, h);
      } else {
        const sky = ctx.createLinearGradient(0, 0, 0, horizon * 1.25);
        sky.addColorStop(0, "#02030a");
        sky.addColorStop(0.55, "#050a18");
        sky.addColorStop(0.9, "#0a1526");
        sky.addColorStop(1, "#122033");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, horizon * 1.25);
      }

      // stars
      ctx.fillStyle = "#cdd8ff";
      for (const st of state.stars) {
        ctx.globalAlpha = st.a * (0.72 + 0.28 * Math.sin(st.ph + t * 0.6));
        ctx.fillRect(st.x * w, st.y * h, st.s, st.s);
      }
      ctx.globalAlpha = 1;

      // ── Moon ──────────────────────────────────────────────────────────
      const mx = w * 0.5, my = h * 0.13, mr = Math.min(w, h) * 0.052;
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const corona = ctx.createRadialGradient(mx, my, 0, mx, my, mr * 6);
      corona.addColorStop(0, "rgba(190,208,255,0.2)");
      corona.addColorStop(0.35, "rgba(150,178,240,0.07)");
      corona.addColorStop(1, "rgba(150,178,240,0)");
      ctx.fillStyle = corona;
      ctx.beginPath(); ctx.arc(mx, my, mr * 6, 0, Math.PI * 2); ctx.fill();
      // the glow spills down over the water in a soft column
      const path = ctx.createLinearGradient(0, horizon, 0, h * 0.9);
      path.addColorStop(0, "rgba(214,228,255,0.13)");
      path.addColorStop(1, "rgba(214,228,255,0)");
      ctx.fillStyle = path;
      ctx.fillRect(mx - w * 0.16, horizon, w * 0.32, h * 0.5);
      ctx.restore();
      const disc = ctx.createRadialGradient(mx - mr * 0.25, my - mr * 0.25, mr * 0.15, mx, my, mr);
      disc.addColorStop(0, "#fffdf4");
      disc.addColorStop(0.8, "#e9edf8");
      disc.addColorStop(1, "#b9c6de");
      ctx.fillStyle = disc;
      ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();

      // ── Deep water base ───────────────────────────────────────────────
      const water = ctx.createLinearGradient(0, horizon, 0, h);
      water.addColorStop(0, _rgba(state.deepRGB, 0.9));
      water.addColorStop(1, "rgba(2,5,12,0.96)");
      ctx.fillStyle = water;
      ctx.fillRect(0, horizon, w, h - horizon);

      // ── Wave bands, far → near ────────────────────────────────────────
      const L = state.layers;
      const step = Math.max(4, Math.floor(w / 180));
      for (let i = 0; i < L.length; i++) {
        const lay = L[i];
        const u = lay.u;
        const rowYpx = lay.rowY * h;
        // crest lit by sky near the horizon, warmer moonlight lower down
        const crestMix = Math.min(1, 0.1 + u * 0.38 + i01 * 0.14);
        const crestRGB = _mix(crestMix, u > 0.55 ? state.litRGB : state.skyRGB, state.deepRGB);
        const a = (0.15 + u * 0.22) * (0.8 + 0.3 * i01);
        // fill the crest polyline down to the bottom of the frame
        ctx.beginPath();
        for (let x = 0; x <= w; x += step) {
          const cy = _crestY(x, h, lay, t, i01);
          if (x === 0) ctx.moveTo(x, cy);
          else ctx.lineTo(x, cy);
        }
        ctx.lineTo(w, h + 2);
        ctx.lineTo(0, h + 2);
        ctx.closePath();
        const g = ctx.createLinearGradient(0, rowYpx - lay.amp * 1.4, 0, h);
        g.addColorStop(0, _rgba(crestRGB, a));
        g.addColorStop(0.16, _rgba(crestRGB, a * 0.5));
        g.addColorStop(0.5, _rgba(state.deepRGB, a * 0.32));
        g.addColorStop(1, "rgba(1,3,8,0)");
        ctx.fillStyle = g;
        ctx.fill();

        // foam along the crest line — faint at the horizon, clear nearby
        if (u > 0.25 && i01 > 0.25) {
          const foamA = Math.max(0, u - 0.2) * i01 * 0.85;
          ctx.strokeStyle = `rgba(235,246,255,${foamA * 0.45})`;
          ctx.lineWidth = 0.8 + u * 2.2;
          ctx.beginPath();
          for (let x = 0; x <= w; x += step) {
            const cy = _crestY(x, h, lay, t, i01) + 1;
            if (x === 0) ctx.moveTo(x, cy);
            else ctx.lineTo(x, cy);
          }
          ctx.stroke();
          // broken bright dashes that roll with the wave travel
          ctx.strokeStyle = `rgba(255,255,255,${foamA})`;
          ctx.setLineDash([2 + u * 9, 11 - u * 4]);
          ctx.lineDashOffset = -t * lay.travel * 1.4;
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.lineDashOffset = 0;
        }
      }

      // ── Moon shimmer path on the water ────────────────────────────────
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const colX = w * 0.5;
      const colTop = h * (0.42 + 0.02 * i01);
      const colBottom = h * 0.88;
      const halfW = w * 0.1;
      for (const s of state.shimmers) {
        const y = colTop + s.yFrac * (colBottom - colTop);
        // the column widens as it comes toward the viewer
        const colW = halfW * (0.25 + s.yFrac * 1.4);
        const x = colX + s.xOff * colW;
        if (x < 0 || x > w) continue;
        // flicker: dashed shimmer rather than a solid streak
        const tw = Math.pow(0.5 + 0.5 * Math.sin(s.phase + t * s.twSp), 2.4);
        const a = tw * (0.35 + 0.65 * (1 - Math.abs(s.xOff))) * (0.4 + i01 * 0.6);
        if (a < 0.03) continue;
        ctx.strokeStyle = `rgba(255,250,232,${a})`;
        ctx.lineWidth = 1 + s.yFrac * 1.6;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(x - s.len, y);
        ctx.lineTo(x + s.len, y);
        ctx.stroke();
      }
      ctx.lineCap = "butt";
      ctx.restore();

      // ── Horizon haze: a wide feather so sky meets sea softly ──────────
      const haze = ctx.createLinearGradient(0, horizon * 0.9, 0, horizon * 1.18);
      haze.addColorStop(0, "rgba(150,180,220,0)");
      haze.addColorStop(0.5, `rgba(${Math.min(255, cr + 60)},${Math.min(255, cg + 70)},${Math.min(255, cb + 60)},${0.12 + i01 * 0.08})`);
      haze.addColorStop(1, "rgba(150,180,220,0)");
      ctx.fillStyle = haze;
      ctx.fillRect(0, horizon * 0.9, w, horizon * 0.28);

      // ── Vignette ──────────────────────────────────────────────────────
      const vg = ctx.createRadialGradient(w / 2, h * 0.46, Math.min(w, h) * 0.4, w / 2, h * 0.52, Math.max(w, h) * 0.8);
      vg.addColorStop(0, "rgba(0,0,0,0)");
      vg.addColorStop(1, "rgba(1,2,6,0.42)");
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, w, h);
    },
  });
})();

const canvas = document.getElementById('c');
const scene = ThemeScenes.get('ocean');
const optsRow = document.getElementById('opts');
const info = document.getElementById('info');
const opts = { ...scene.defaults };
const labels = {};
optsRow.innerHTML = '';
scene.options.forEach(opt => {
  const lab = document.createElement('label');
  lab.textContent = opt.label + ': ';
  if (opt.type === 'range') {
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = opt.min; inp.max = opt.max; inp.step = opt.step;
    inp.value = opts[opt.key];
    inp.oninput = () => {
      opts[opt.key] = parseFloat(inp.value);
      lab.textContent = opt.label + ': ' + inp.value + ' ';
      lab.appendChild(inp); // textContent above cleared it — put it back
      ThemeScenes.updateOptions(opts);
    };
    lab.appendChild(inp);
  } else if (opt.type === 'color') {
    const inp = document.createElement('input');
    inp.type = 'color'; inp.value = opts[opt.key];
    inp.oninput = () => { opts[opt.key] = inp.value; ThemeScenes.updateOptions(opts); };
    lab.appendChild(inp);
  } else if (opt.type === 'select') {
    const sel = document.createElement('select');
    opt.choices.forEach(([v, l]) => {
      const o = document.createElement('option'); o.value = v; o.textContent = l;
      if (String(opts[opt.key]) === String(v)) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = () => { opts[opt.key] = sel.value; ThemeScenes.updateOptions(opts); };
    lab.appendChild(sel);
  }
  labels[opt.key] = lab;
  optsRow.appendChild(lab);
});
ThemeScenes.start('ocean', opts, canvas);
document.getElementById('reroll').onclick = () => ThemeScenes.updateOptions(opts);
info.textContent = 'ocean — ' + scene.label + ' (1280x800)';
</script>
</body>
</html>
