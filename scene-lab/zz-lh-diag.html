<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>zz lh diag</title></head>
<body>
<script src="../assets/js/scenes/core.js"></script>
<script src="../assets/js/scenes/lighthouse/scene.js"></script>
<script>
const DEF = ThemeScenes.get("lighthouse");
const W = 480, H = 300;
function probeAt(az) {
  const c = document.createElement("canvas");
  c.width = W; c.height = H;
  const x = c.getContext("2d", { willReadFrequently: true });
  const st = {};
  const o = { ...DEF.defaults };
  DEF.init(st, W, H, o);
  st.az = az; st.flashE = 0;
  DEF.draw(x, W, H, st, o, 0.016);
  const d = x.getImageData(0, 0, W, H).data;
  const px = (X, Y) => {
    const i = (Y * W + X) * 4;
    return [d[i], d[i + 1], d[i + 2]];
  };
  return { px, st };
}
window.__DIAG = () => {
  const out = {};
  // vertical strip straight down from the lamp (x = lampX ≈ 79)
  const down = probeAt(Math.PI / 2);
  out.downStrip = [];
  for (let y = 100; y < 296; y += 12) out.downStrip.push([y, down.px(79, y).map(v => Math.round(v))]);
  // horizontal strip to the right at lamp height (az 0 wedge)
  const right = probeAt(0.02);
  out.rightStrip = [];
  for (let x = 100; x < 470; x += 30) out.rightStrip.push([x, right.px(x, 92).map(v => Math.round(v))]);
  // is the beam sprite non-empty?
  const st2 = {};
  DEF.init(st2, W, H, { ...DEF.defaults });
  out.beamSprite = st2.beam ? { w: st2.beam.canvas.width, h: st2.beam.canvas.height } : null;
  if (st2.beam) {
    const bx = st2.beam.canvas.getContext("2d");
    const bd = bx.getImageData(0, 0, st2.beam.canvas.width, st2.beam.canvas.height).data;
    let maxA = 0, sumR = 0;
    for (let i = 3; i < bd.length; i += 4) { maxA = Math.max(maxA, bd[i]); sumR += bd[i - 3]; }
    out.beamSprite.maxAlpha = maxA;
    out.beamSprite.meanR = Math.round(sumR / (bd.length / 4));
  }
  return out;
};
</script>
</body></html>
