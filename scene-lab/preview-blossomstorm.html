        ctx.fillRect(mx - h * 0.2, my - h * 0.2, h * 0.4, h * 0.4);
        const mr = h * 0.047;
        const dg = ctx.createRadialGradient(mx - mr * 0.3, my - mr * 0.35, mr * 0.1, mx, my, mr);
        dg.addColorStop(0, "rgba(250, 248, 255, 0.98)");
        dg.addColorStop(0.7, "rgba(236, 231, 248, 0.95)");
        dg.addColorStop(1, "rgba(204, 197, 233, 0.9)");
        ctx.fillStyle = dg;
        ctx.beginPath(); ctx.arc(mx, my, mr, 0, TAU); ctx.fill();
        ctx.fillStyle = "rgba(158, 148, 196, 0.18)";
        ctx.beginPath(); ctx.arc(mx - mr * 0.35, my - mr * 0.18, mr * 0.22, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(mx + mr * 0.3, my + mr * 0.28, mr * 0.15, 0, TAU); ctx.fill();
        ctx.beginPath(); ctx.arc(mx + mr * 0.02, my - mr * 0.42, mr * 0.11, 0, TAU); ctx.fill();
        // blossom tree, left — drawn before the hill so its base roots behind
        // the ridge; sways on the same gust clock as the petals below
        _drawTree(ctx, w, h, state, color);
        // rolling hill
        ctx.fillStyle = "#17122c";
        ctx.beginPath(); ctx.moveTo(-6, h + 6);
        for (const p of state.hill) ctx.lineTo(p.x, p.y);
        ctx.lineTo(w + 6, h + 6); ctx.closePath(); ctx.fill();
        // moonlit crest on hill
        ctx.strokeStyle = "rgba(148, 130, 206, 0.15)";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        for (let i = 0; i < state.hill.length; i++) {
          const p = state.hill[i];
          if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();
        // falling petals
        const petalLight = _mixHex(color, "#ffffff", 0.38);
        const petalDeep = _mixHex(color, "#171028", 0.3);
        const gust = 0.7 + 0.3 * Math.sin(state.t * 1.3) * Math.sin(state.t * 0.3);
        for (const p of state.petals) {
          p.rot += p.rotSp * dt * speed;
          p.x += (44 + p.depth * 62) * S * gust * dt * speed;
          p.y += (p.vy + Math.sin(state.t * 2.6 + p.ph) * 7 * S) * dt * speed;
          if (p.x > w + 22) { p.x = -22; p.y = Math.random() * h; }
          if (p.y > h + 18) { p.y = -18; p.x = Math.random() * w; }
          ctx.save();
          ctx.translate(p.x, p.y); ctx.rotate(p.rot);
          ctx.globalAlpha = 0.5 + p.depth * 0.42;
          ctx.fillStyle = p.depth > 0.72 ? petalLight : p.depth > 0.42 ? color : petalDeep;
          ctx.beginPath(); ctx.ellipse(0, 0, p.r * sc, p.r * 0.58 * sc, 0, 0, TAU); ctx.fill();
          ctx.restore();
        }
        ctx.globalAlpha = 1;
      },
    });
})();

const canvas = document.getElementById('c');
const scene = ThemeScenes.get('blossomstorm');
const optsRow = document.getElementById('opts');
const info = document.getElementById('info');
const opts = { ...scene.defaults };
const labels = {};
optsRow.innerHTML = '';
scene.options.forEach(opt => {
  const lab = document.createElement('label');
  lab.textContent = opt.label + ': ';
  if (opt.type === 'range') {
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = opt.min; inp.max = opt.max; inp.step = opt.step;
    inp.value = opts[opt.key];
    inp.oninput = () => {
      opts[opt.key] = parseFloat(inp.value);
      lab.textContent = opt.label + ': ' + inp.value + ' ';
      lab.appendChild(inp); // textContent above cleared it — put it back
      ThemeScenes.updateOptions(opts);
    };
    lab.appendChild(inp);
  } else if (opt.type === 'color') {
    const inp = document.createElement('input');
    inp.type = 'color'; inp.value = opts[opt.key];
    inp.oninput = () => { opts[opt.key] = inp.value; ThemeScenes.updateOptions(opts); };
    lab.appendChild(inp);
  } else if (opt.type === 'select') {
    const sel = document.createElement('select');
    opt.choices.forEach(([v, l]) => {
      const o = document.createElement('option'); o.value = v; o.textContent = l;
      if (String(opts[opt.key]) === String(v)) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = () => { opts[opt.key] = sel.value; ThemeScenes.updateOptions(opts); };
    lab.appendChild(sel);
  }
  labels[opt.key] = lab;
  optsRow.appendChild(lab);
});
ThemeScenes.start('blossomstorm', opts, canvas);
document.getElementById('reroll').onclick = () => ThemeScenes.updateOptions(opts);
info.textContent = 'blossomstorm — ' + scene.label + ' (1280x800)';
</script>
</body>
</html>
