<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Preview — cloudsea</title>
<style>
  body { background:#101018; color:#e8e8ee; font-family:system-ui; margin:0; padding:16px; display:flex; flex-direction:column; gap:10px; align-items:center; }
  canvas { width:min(960px, 94vw); aspect-ratio:16/10; background:#000; border-radius:10px; }
  #opts { display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:center; font-size:13px; color:#bbb; }
  input[type=range], input[type=color] { vertical-align:middle; }
  button { background:#2a2a35; color:#e8e8ee; border:1px solid #4a4a5a; border-radius:6px; padding:4px 12px; font-size:13px; cursor:pointer; }
  button:hover { background:#3a3a48; }
  #info { font-size:12px; color:#888; }
</style>
</head>
<body>
<div id="opts"></div>
<button id="reroll" type="button">↻ Re-roll layout</button>
<canvas id="c" width="1280" height="800"></canvas>
<div id="info"></div>
<script>
// core.js — ThemeScenes core (registry + shared helpers + runtime).
// Generated by scripts/split-scenes.js from the pre-split assets/js/theme-scenes.js
// (2026-09-04). Helpers/runtime bodies are verbatim; additions: register(),
// __helpers export, empty SCENES registry (populated by per-scene modules).
// NOTE: named core.js, not _core.js — Jekyll drops underscore-prefixed files
// from static dirs, so the underscore prefix would 404 on the live site.
const ThemeScenes = (() => {
  const SCENES = {};

  function register(id, def) { SCENES[id] = def; }

  let _snowSpriteCache = null;
  function _makeSnowSprites() {
    const levels = [];
    for (let lv = 0; lv < 4; lv++) {
      const frames = [];
      const sz = 32;
      for (let fi = 0; fi < 16; fi++) {
        const c = document.createElement('canvas');
        c.width = c.height = sz;
        const x = c.getContext('2d');
        const cx = sz / 2, cy = sz / 2;
        const rot = (fi / 16) * Math.PI * 2;
        const arms = lv + 3;
        const armLen = sz * 0.35;
        const coreR = sz * (0.06 + lv * 0.02);
        x.save();
        x.translate(cx, cy);
        x.rotate(rot);
        // core glow
        const glow = x.createRadialGradient(0, 0, 0, 0, 0, coreR * 3);
        glow.addColorStop(0, 'rgba(232,237,245,0.5)');
        glow.addColorStop(1, 'rgba(232,237,245,0)');
        x.fillStyle = glow;
        x.beginPath(); x.arc(0, 0, coreR * 3, 0, Math.PI * 2); x.fill();
        // crystal arms
        x.strokeStyle = 'rgba(232,237,245,0.9)';
        x.lineWidth = 1 + lv * 0.3;
        x.lineCap = 'round';
        for (let a = 0; a < arms; a++) {
          const angle = (a / arms) * Math.PI * 2;
          x.beginPath();
          x.moveTo(0, 0);
          x.lineTo(Math.cos(angle) * armLen, Math.sin(angle) * armLen);
          x.stroke();
          // side branches on larger flakes
          if (lv >= 1) {
            const bLen = armLen * 0.4;
            const bDist = armLen * 0.6;
            const bx = Math.cos(angle) * bDist;
            const by = Math.sin(angle) * bDist;
            for (let s = -1; s <= 1; s += 2) {
              const ba = angle + s * Math.PI / 4;
              x.beginPath();
              x.moveTo(bx, by);
              x.lineTo(bx + Math.cos(ba) * bLen, by + Math.sin(ba) * bLen);
              x.stroke();
            }
          }
        }
        // center dot
        x.fillStyle = 'rgba(255,255,255,0.9)';
        x.beginPath(); x.arc(0, 0, coreR, 0, Math.PI * 2); x.fill();
        x.restore();
        frames.push(c);
      }
      levels.push(frames);
    }
    return levels;
  }

  function _mixHex(hex1, hex2, t) {
    const [r1, g1, b1] = _hexToRgb(hex1);
    const [r2, g2, b2] = _hexToRgb(hex2);
    return `rgb(${Math.round(r1 + (r2 - r1) * t)},${Math.round(g1 + (g2 - g1) * t)},${Math.round(b1 + (b2 - b1) * t)})`;
  }

  function _hexToRgb(hex) {
    if (!hex || typeof hex !== "string") return [167, 139, 250];
    const clean = hex.replace("#", "");
    if (clean.length < 6) return [167, 139, 250];
    return [parseInt(clean.slice(0, 2), 16), parseInt(clean.slice(2, 4), 16), parseInt(clean.slice(4, 6), 16)];
  }

  function resetComet(c, w, h, speed) {
    c.vx = (Math.random() - 0.5) * 200;
    c.vy = (Math.random() - 0.5) * 200;
    c.speed = (Math.random() * 0.5 + 0.5) * speed;
    c.trail = [];
    c.maxTrail = Math.floor(Math.random() * 20 + 15);
    c.alpha = Math.random() * 0.4 + 0.3;
  }

  let activeId = null;
  let rafId = null;
  let canvasEl = null;
  let state = {};
  let lastTime = 0;
  let currentOptions = {};
  let resizeHandler = null;

  function _syncCanvasSize(canvas) {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.floor(rect.width));
    const h = Math.max(1, Math.floor(rect.height));
    const pw = Math.floor(w * dpr), ph = Math.floor(h * dpr);
    const resized = canvas.width !== pw || canvas.height !== ph;
    if (resized) {
      canvas.width = pw; canvas.height = ph;
      const ctx = canvas.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    return { w, h, ctx: canvas.getContext("2d"), resized };
  }

  function stop() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (resizeHandler) { window.removeEventListener("resize", resizeHandler); resizeHandler = null; }
    const scene = SCENES[activeId];
    if (scene && typeof scene.destroy === "function") scene.destroy(state);
    activeId = null; state = {}; lastTime = 0; currentOptions = {};
    if (canvasEl) {
      canvasEl.style.display = "none";
      canvasEl.style.zIndex = "1";
      canvasEl.style.backgroundColor = "";
      const ctx = canvasEl.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
    }
    canvasEl = null;
  }

  function start(sceneId, options, canvas) {
    stop();
    const scene = SCENES[sceneId];
    if (!scene || !canvas) return false;
    const opts = { ...scene.defaults, ...options };
    activeId = sceneId; currentOptions = opts; canvasEl = canvas;
    canvas.style.display = "block"; state = {};
    let dims = _syncCanvasSize(canvas);
    scene.init(state, dims.w, dims.h, opts);
    resizeHandler = () => {
      dims = _syncCanvasSize(canvas);
      if (typeof scene.destroy === "function") scene.destroy(state);
      scene.init(state, dims.w, dims.h, currentOptions);
    };
    window.addEventListener("resize", resizeHandler);
    lastTime = performance.now();
    function frame(now) {
      if (!activeId || canvasEl !== canvas) return;
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now; dims = _syncCanvasSize(canvas);
      if (dims.resized) {
        if (typeof scene.destroy === "function") scene.destroy(state);
        scene.init(state, dims.w, dims.h, currentOptions);
      }
      scene.draw(dims.ctx, dims.w, dims.h, state, currentOptions, dt);
      rafId = requestAnimationFrame(frame);
    }
    rafId = requestAnimationFrame(frame);
    return true;
  }

  function updateOptions(options) {
    if (!activeId || !canvasEl) return;
    const scene = SCENES[activeId];
    currentOptions = { ...scene.defaults, ...options };
    const dims = _syncCanvasSize(canvasEl);
    if (typeof scene.destroy === "function") scene.destroy(state);
    scene.init(state, dims.w, dims.h, currentOptions);
  }

  function list() {
    return Object.entries(SCENES).map(([id, s]) => ({ id, label: s.label, defaults: s.defaults, options: s.options }));
  }

  function get(id) { return SCENES[id] || null; }
  function isActiveCanvas(canvas) { return canvasEl === canvas; }


  const __helpers = { _hexToRgb, _mixHex, _makeSnowSprites, resetComet };

  return { start, stop, updateOptions, setOptions: updateOptions, list, get, isActiveCanvas, register, SCENES, __helpers };
})();

(() => {
  const vertexSource = `#version 300 es
  void main() {
    vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));
    gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
  }`;

  const fragmentSource = `#version 300 es
  precision highp float;
  uniform vec2 resolution;
  uniform float time;
  uniform float density;
  uniform float scale;
  uniform vec3 tint;
  uniform vec3 background;
  out vec4 outputColor;

  float hash(vec2 p) {
    p = fract(p * vec2(127.1, 311.7));
    p += dot(p, p + 34.5);
    return fract(p.x * p.y);
  }

  float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
               mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
  }

  float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    mat2 m = mat2(0.8, -0.6, 0.6, 0.8);
    for (int i = 0; i < 3; i++) {
      v += a * noise(p);
      p = m * p * 2.02 + vec2(11.3, 7.7);
      a *= 0.5;
    }
    return v;
  }

  float cloudField(vec3 p) {
    vec2 q = (p.xz + vec2(time * 0.055, time * 0.018)) / scale;
    float billow = fbm(q * 0.85 + vec2(p.y * 0.42, -p.y * 0.28));
    float crest = 0.2 + billow * 1.8 + noise(q * 4.0 + p.y) * 0.12;
    float coverage = mix(0.08, 0.37, (density - 3.0) / 17.0);
    return smoothstep(-0.12, 0.55, crest - p.y + coverage * 0.4)
      * smoothstep(-0.2, 0.25, p.y);
  }

  void main() {
    vec2 uv = gl_FragCoord.xy / resolution;
    vec2 p = (gl_FragCoord.xy - resolution * 0.5) / resolution.y;
    vec3 lightColor = mix(tint, vec3(1.0, 0.91, 0.8), 0.45);
    float horizonY = 0.66;
    float glow = exp(-abs(uv.y - horizonY) * 7.0);
    vec3 col = mix(background * 0.7, background + tint * 0.32, glow);
    col += lightColor * exp(-length(p - vec2(0.5, 0.18)) * 4.0) * 0.25;
    float peaks = 0.11 * exp(-abs(p.x + 0.48) * 15.0)
      + 0.065 * exp(-abs(p.x - 0.23) * 22.0);
    float ridge = horizonY - 0.022 + peaks + 0.04 * fbm(vec2(p.x * 14.0, 5.0));
    float rock = 1.0 - smoothstep(ridge - 0.003, ridge + 0.003, uv.y);
    col = mix(col, background * 0.5 + tint * 0.06, rock);
    vec3 ro = vec3(0.0, 3.0, -4.0);
    vec3 rd = normalize(vec3(p.x, (uv.y - horizonY) * 1.25, 1.2));
    if (rd.y < -0.005) {
      float start = max(0.0, (1.95 - ro.y) / rd.y);
      float end = min(65.0, (0.15 - ro.y) / rd.y);
      float stride = max(0.0, end - start) / 72.0;
      float transmittance = 1.0;
      vec3 sum = vec3(0.0);
      float jitter = 0.5;
      for (int i = 0; i < 72; i++) {
        float distance = start + (float(i) + jitter) * stride;
        vec3 pos = ro + rd * distance;
        float d = cloudField(pos);
        if (d > 0.01) {
          float occlusion = cloudField(pos + vec3(0.4, 0.3, -0.2));
          float lit = clamp((d - occlusion) * 2.0 + 0.42, 0.08, 1.0);
          vec3 shade = mix(tint * 0.23 + background * 0.2, lightColor, lit);
          shade = mix(shade, background + tint * 0.38, 1.0 - exp(-distance * 0.018));
          float alpha = 1.0 - exp(-d * stride * 2.3);
          sum += transmittance * alpha * shade;
          transmittance *= 1.0 - alpha;
          if (transmittance < 0.025) break;
        }
      }
      col = col * transmittance + sum;
    }
    col *= 1.0 - 0.15 * smoothstep(0.3, 1.2, length(p));
    outputColor = vec4(pow(max(col, vec3(0.0)), vec3(0.85)), 1.0);
  }`;

  function rgb(hex, fallback) {
    const value = /^#[\da-f]{6}$/i.test(hex || "") ? hex : fallback;
    return [1, 3, 5].map((i) => parseInt(value.slice(i, i + 2), 16) / 255);
  }

  function release(state) {
    const gl = state.gl;
    if (state.surface && state.onLost)
      state.surface.removeEventListener("webglcontextlost", state.onLost);
    if (gl) {
      if (state.program) gl.deleteProgram(state.program);
      for (const shader of state.shaders || []) gl.deleteShader(shader);
      const lose = gl.getExtension("WEBGL_lose_context");
      if (lose && !gl.isContextLost()) lose.loseContext();
    }
    if (state.surface) state.surface.width = state.surface.height = 1;
    state.gl = null;
    state.program = null;
    state.shaders = null;
    state.surface = null;
    state.uniforms = null;
    state.onLost = null;
  }

  function fallback(ctx, w, h, state, opts) {
    const color = rgb(opts.color, "#94a3b8").map((v) => Math.round(v * 255));
    const bg = opts.bgColor || "#0f172a";
    const drift = state.t * 12;
    const S = h / 1080;
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);
    const glow = ctx.createRadialGradient(
      w * 0.72,
      h * 0.32,
      0,
      w * 0.72,
      h * 0.32,
      h * 0.5,
    );
    glow.addColorStop(0, `rgba(${color},0.14)`);
    glow.addColorStop(1, `rgba(${color},0)`);
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = "rgba(8,12,24,0.5)";
    ctx.beginPath();
    ctx.moveTo(0, h);
    for (let x = 0; x <= w; x += 24)
      ctx.lineTo(x, h * 0.34 - Math.sin(x * 0.008) * h * 0.05);
    ctx.lineTo(w, h);
    ctx.fill();
    const count = Math.round(opts.density ?? 8);
    for (let i = 0; i < count; i++) {
      const seed = i * 7.13;
      const rx =
        (90 + (Math.sin(seed) * 0.5 + 0.5) * 120) * (opts.scale ?? 1) * S;
      const x =
        ((((seed * 137 +
          drift * (0.8 + (Math.sin(seed * 3) * 0.5 + 0.5) * 0.6)) %
          (w + rx * 4)) +
          w +
          rx * 4) %
          (w + rx * 4)) -
        rx * 2;
      const y = h * (0.44 + (Math.sin(seed * 5) * 0.5 + 0.5) * 0.36);
      const ry = rx * 0.32;
      const g = ctx.createRadialGradient(x, y - ry * 0.3, 0, x, y, rx);
      g.addColorStop(0, `rgba(${color},0.5)`);
      g.addColorStop(0.5, `rgba(${color},0.2)`);
      g.addColorStop(1, `rgba(${color},0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ThemeScenes.register("cloudsea", {
    label: "Cloud Sea",
    defaults: { density: 8, speed: 0.5, scale: 1, color: "#94a3b8" },
    presetBgColors: [
      "#0f172a",
      "#020617",
      "#000000",
      "#1a1a2e",
      "#0a1a2e",
      "#0d1117",
    ],
    presetCombos: [
      { color: "#94a3b8", bg: "#0f172a" },
      { color: "#fbbf24", bg: "#1a1208" },
      { color: "#f472b6", bg: "#1a0a2e" },
      { color: "#7dd3fc", bg: "#0a1a2e" },
      { color: "#e2e8f0", bg: "#020617" },
      { color: "#34d399", bg: "#0a1a0a" },
    ],
    options: [
      {
        key: "density",
        label: "Clouds",
        type: "range",
        min: 3,
        max: 20,
        step: 1,
      },
      {
        key: "speed",
        label: "Drift",
        type: "range",
        min: 0.1,
        max: 2,
        step: 0.1,
      },
      {
        key: "scale",
        label: "Cloud Size",
        type: "range",
        min: 0.5,
        max: 2,
        step: 0.1,
      },
      { key: "color", label: "Cloud Color", type: "color" },
    ],
    init(state) {
      release(state);
      state.t = state.t || 0;
      state.dt = 0;
      try {
        state.surface = document.createElement("canvas");
        const gl = state.surface.getContext("webgl2", {
          alpha: false,
          antialias: false,
          depth: false,
          stencil: false,
          preserveDrawingBuffer: false,
        });
        state.gl = gl;
        if (!gl) {
          release(state);
          return;
        }
        state.onLost = (event) => {
          event.preventDefault();
          state.lost = true;
        };
        state.surface.addEventListener("webglcontextlost", state.onLost);
        state.lost = false;
        state.shaders = [];
        state.program = gl.createProgram();
        if (!state.program) throw new Error("Cloudsea program unavailable");
        for (const [type, source] of [
          [gl.VERTEX_SHADER, vertexSource],
          [gl.FRAGMENT_SHADER, fragmentSource],
        ]) {
          const shader = gl.createShader(type);
          if (!shader) throw new Error("Cloudsea shader unavailable");
          state.shaders.push(shader);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
            throw new Error(gl.getShaderInfoLog(shader));
          gl.attachShader(state.program, shader);
        }
        gl.linkProgram(state.program);
        if (!gl.getProgramParameter(state.program, gl.LINK_STATUS))
          throw new Error(gl.getProgramInfoLog(state.program));
        for (const shader of state.shaders) {
          gl.detachShader(state.program, shader);
          gl.deleteShader(shader);
        }
        state.shaders = [];
        state.uniforms = Object.fromEntries(
          ["resolution", "time", "density", "scale", "tint", "background"].map(
            (key) => [key, gl.getUniformLocation(state.program, key)],
          ),
        );
      } catch {
        release(state);
      }
    },
    draw(ctx, w, h, state, opts, dt) {
      if (w <= 0 || h <= 0) return;
      const dtc = Math.min(0.05, Math.max(0, dt || 0));
      state.t += dtc * (opts.speed ?? 0.5);
      ctx.save();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      const gl = state.gl;
      if (!gl || state.lost || gl.isContextLost()) {
        fallback(ctx, w, h, state, opts);
        ctx.restore();
        return;
      }
      const transform = ctx.getTransform();
      const width = Math.max(
        1,
        Math.round(w * Math.hypot(transform.a, transform.b)),
      );
      const height = Math.max(
        1,
        Math.round(h * Math.hypot(transform.c, transform.d)),
      );
      if (state.surface.width !== width || state.surface.height !== height) {
        const max = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
        if (width > max[0] || height > max[1]) {
          fallback(ctx, w, h, state, opts);
          ctx.restore();
          return;
        }
        state.surface.width = width;
        state.surface.height = height;
      }
      gl.viewport(0, 0, width, height);
      gl.useProgram(state.program);
      const u = state.uniforms;
      gl.uniform2f(u.resolution, width, height);
      gl.uniform1f(u.time, state.t);
      gl.uniform1f(u.density, opts.density ?? 8);
      gl.uniform1f(u.scale, opts.scale ?? 1);
      gl.uniform3fv(u.tint, rgb(opts.color, "#94a3b8"));
      gl.uniform3fv(u.background, rgb(opts.bgColor, "#0f172a"));
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      ctx.drawImage(state.surface, 0, 0, w, h);
      ctx.restore();
    },
    destroy(state) {
      release(state);
    },
  });
})();

const canvas = document.getElementById('c');
const scene = ThemeScenes.get('cloudsea');
const optsRow = document.getElementById('opts');
const info = document.getElementById('info');
const opts = { ...scene.defaults };
const labels = {};
optsRow.innerHTML = '';
scene.options.forEach(opt => {
  const lab = document.createElement('label');
  lab.textContent = opt.label + ': ';
  if (opt.type === 'range') {
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = opt.min; inp.max = opt.max; inp.step = opt.step;
    inp.value = opts[opt.key];
    inp.oninput = () => {
      opts[opt.key] = parseFloat(inp.value);
      lab.textContent = opt.label + ': ' + inp.value + ' ';
      lab.appendChild(inp); // textContent above cleared it — put it back
      ThemeScenes.updateOptions(opts);
    };
    lab.appendChild(inp);
  } else if (opt.type === 'color') {
    const inp = document.createElement('input');
    inp.type = 'color'; inp.value = opts[opt.key];
    inp.oninput = () => { opts[opt.key] = inp.value; ThemeScenes.updateOptions(opts); };
    lab.appendChild(inp);
  } else if (opt.type === 'select') {
    const sel = document.createElement('select');
    opt.choices.forEach(([v, l]) => {
      const o = document.createElement('option'); o.value = v; o.textContent = l;
      if (String(opts[opt.key]) === String(v)) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = () => { opts[opt.key] = sel.value; ThemeScenes.updateOptions(opts); };
    lab.appendChild(sel);
  }
  labels[opt.key] = lab;
  optsRow.appendChild(lab);
});
ThemeScenes.start('cloudsea', opts, canvas);
document.getElementById('reroll').onclick = () => ThemeScenes.updateOptions(opts);
info.textContent = 'cloudsea — ' + scene.label + ' (1280x800)';
</script>
</body>
</html>
