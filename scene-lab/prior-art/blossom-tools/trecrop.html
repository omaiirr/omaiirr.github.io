<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ref1 tree crop</title>
<style>
  body { background:#000; margin:0; }
  canvas { display:block; width:100vw; height:auto; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
  const img = new Image();
  img.onload = () => {
    const W = img.naturalWidth, H = img.naturalHeight;
    const c = document.getElementById('cv');
    // crop the tree zone: x 0-55%, y 28-88%, upscale 2x
    const sx = 0, sy = H * 0.28, sw = W * 0.55, sh = H * 0.60;
    c.width = sw * 2; c.height = sh * 2;
    const x = c.getContext('2d');
    x.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
    window.__treeCrop = c;
  };
  img.src = 'imgref/ref1.png';
</script>
</body>
</html>
