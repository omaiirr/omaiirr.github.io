<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ref1 trunk detail</title>
<style>
  body { background:#000; margin:0; }
  canvas { display:block; width:100vw; height:auto; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
  const img = new Image();
  img.onload = () => {
    const W = img.naturalWidth, H = img.naturalHeight;
    const c = document.getElementById('cv');
    // trunk region: x 5-35%, y 40-90%, upscale 3x
    const sx = W * 0.05, sy = H * 0.40, sw = W * 0.30, sh = H * 0.50;
    c.width = sw * 3; c.height = sh * 3;
    const x = c.getContext('2d');
    x.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
    window.__trunkCrop = c;
  };
  img.src = 'imgref/ref1.png';
</script>
</body>
</html>
