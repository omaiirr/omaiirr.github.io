<!doctype html><html><head><meta charset="utf-8"><title>trace check</title></head>
<body style="margin:0;background:#111">
<canvas id="cv" width="1908" height="1140" style="width:954px;height:570px"></canvas>
<script src="tree_trace.js"></script>
<script>
const canvas = document.getElementById('cv');
const ctx = canvas.getContext('2d');
const img = new Image();
img.onload = () => {
  ctx.drawImage(img, 0, 0);
  // dim the reference slightly, then draw the traced polylines on top in bright green
  ctx.fillStyle = 'rgba(0,0,40,0.35)';
  ctx.fillRect(0, 0, 1908, 1140);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (const br of TRACE.branches) {
    ctx.strokeStyle = '#00ff88';
    ctx.lineWidth = 2;
    ctx.beginPath();
    br.forEach((p, i) => {
      const x = p[0] * 1908, y = p[1] * 1140;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }
  document.title = 'trace check: ' + TRACE.branches.length + ' branches';
};
img.src = 'imgref/ref1.png';
</script>
</body></html>
