<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Preview — jellyfish</title>
<style>
  body { background:#101018; color:#e8e8ee; font-family:system-ui; margin:0; padding:16px; display:flex; flex-direction:column; gap:10px; align-items:center; }
  canvas { width:min(960px, 94vw); aspect-ratio:16/10; background:#000; border-radius:10px; }
  #opts { display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:center; font-size:13px; color:#bbb; }
  input[type=range], input[type=color] { vertical-align:middle; }
  button { background:#2a2a35; color:#e8e8ee; border:1px solid #4a4a5a; border-radius:6px; padding:4px 12px; font-size:13px; cursor:pointer; }
  button:hover { background:#3a3a48; }
  #info { font-size:12px; color:#888; }
</style>
</head>
<body>
<div id="opts"></div>
<button id="reroll" type="button">↻ Re-roll layout</button>
<canvas id="c" width="1280" height="800"></canvas>
<div id="info"></div>
<script>
// core.js — ThemeScenes core (registry + shared helpers + runtime).
// Generated by scripts/split-scenes.js from the pre-split assets/js/theme-scenes.js
// (2026-09-04). Helpers/runtime bodies are verbatim; additions: register(),
// __helpers export, empty SCENES registry (populated by per-scene modules).
// NOTE: named core.js, not _core.js — Jekyll drops underscore-prefixed files
// from static dirs, so the underscore prefix would 404 on the live site.
const ThemeScenes = (() => {
  const SCENES = {};

  function register(id, def) { SCENES[id] = def; }

  let _snowSpriteCache = null;
  function _makeSnowSprites() {
    const levels = [];
    for (let lv = 0; lv < 4; lv++) {
      const frames = [];
      const sz = 32;
      for (let fi = 0; fi < 16; fi++) {
        const c = document.createElement('canvas');
        c.width = c.height = sz;
        const x = c.getContext('2d');
        const cx = sz / 2, cy = sz / 2;
        const rot = (fi / 16) * Math.PI * 2;
        const arms = lv + 3;
        const armLen = sz * 0.35;
        const coreR = sz * (0.06 + lv * 0.02);
        x.save();
        x.translate(cx, cy);
        x.rotate(rot);
        // core glow
        const glow = x.createRadialGradient(0, 0, 0, 0, 0, coreR * 3);
        glow.addColorStop(0, 'rgba(232,237,245,0.5)');
        glow.addColorStop(1, 'rgba(232,237,245,0)');
        x.fillStyle = glow;
        x.beginPath(); x.arc(0, 0, coreR * 3, 0, Math.PI * 2); x.fill();
        // crystal arms
        x.strokeStyle = 'rgba(232,237,245,0.9)';
        x.lineWidth = 1 + lv * 0.3;
        x.lineCap = 'round';
        for (let a = 0; a < arms; a++) {
          const angle = (a / arms) * Math.PI * 2;
          x.beginPath();
          x.moveTo(0, 0);
          x.lineTo(Math.cos(angle) * armLen, Math.sin(angle) * armLen);
          x.stroke();
          // side branches on larger flakes
          if (lv >= 1) {
            const bLen = armLen * 0.4;
            const bDist = armLen * 0.6;
            const bx = Math.cos(angle) * bDist;
            const by = Math.sin(angle) * bDist;
            for (let s = -1; s <= 1; s += 2) {
              const ba = angle + s * Math.PI / 4;
              x.beginPath();
              x.moveTo(bx, by);
              x.lineTo(bx + Math.cos(ba) * bLen, by + Math.sin(ba) * bLen);
              x.stroke();
            }
          }
        }
        // center dot
        x.fillStyle = 'rgba(255,255,255,0.9)';
        x.beginPath(); x.arc(0, 0, coreR, 0, Math.PI * 2); x.fill();
        x.restore();
        frames.push(c);
      }
      levels.push(frames);
    }
    return levels;
  }

  function _mixHex(hex1, hex2, t) {
    const [r1, g1, b1] = _hexToRgb(hex1);
    const [r2, g2, b2] = _hexToRgb(hex2);
    return `rgb(${Math.round(r1 + (r2 - r1) * t)},${Math.round(g1 + (g2 - g1) * t)},${Math.round(b1 + (b2 - b1) * t)})`;
  }

  function _hexToRgb(hex) {
    if (!hex || typeof hex !== "string") return [167, 139, 250];
    const clean = hex.replace("#", "");
    if (clean.length < 6) return [167, 139, 250];
    return [parseInt(clean.slice(0, 2), 16), parseInt(clean.slice(2, 4), 16), parseInt(clean.slice(4, 6), 16)];
  }

  function resetComet(c, w, h, speed) {
    c.vx = (Math.random() - 0.5) * 200;
    c.vy = (Math.random() - 0.5) * 200;
    c.speed = (Math.random() * 0.5 + 0.5) * speed;
    c.trail = [];
    c.maxTrail = Math.floor(Math.random() * 20 + 15);
    c.alpha = Math.random() * 0.4 + 0.3;
  }

  let activeId = null;
  let rafId = null;
  let canvasEl = null;
  let state = {};
  let lastTime = 0;
  let currentOptions = {};
  let resizeHandler = null;

  function _syncCanvasSize(canvas) {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.floor(rect.width));
    const h = Math.max(1, Math.floor(rect.height));
    const pw = Math.floor(w * dpr), ph = Math.floor(h * dpr);
    const resized = canvas.width !== pw || canvas.height !== ph;
    if (resized) {
      canvas.width = pw; canvas.height = ph;
      const ctx = canvas.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    return { w, h, ctx: canvas.getContext("2d"), resized };
  }

  function stop() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (resizeHandler) { window.removeEventListener("resize", resizeHandler); resizeHandler = null; }
    activeId = null; state = {}; lastTime = 0; currentOptions = {};
    if (canvasEl) {
      canvasEl.style.display = "none";
      canvasEl.style.zIndex = "1";
      canvasEl.style.backgroundColor = "";
      const ctx = canvasEl.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
    }
    canvasEl = null;
  }

  function start(sceneId, options, canvas) {
    stop();
    const scene = SCENES[sceneId];
    if (!scene || !canvas) return false;
    const opts = { ...scene.defaults, ...options };
    activeId = sceneId; currentOptions = opts; canvasEl = canvas;
    canvas.style.display = "block"; state = {};
    let dims = _syncCanvasSize(canvas);
    scene.init(state, dims.w, dims.h, opts);
    resizeHandler = () => { dims = _syncCanvasSize(canvas); scene.init(state, dims.w, dims.h, currentOptions); };
    window.addEventListener("resize", resizeHandler);
    lastTime = performance.now();
    function frame(now) {
      if (!activeId || canvasEl !== canvas) return;
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now; dims = _syncCanvasSize(canvas);
      if (dims.resized) scene.init(state, dims.w, dims.h, currentOptions);
      scene.draw(dims.ctx, dims.w, dims.h, state, currentOptions, dt);
      rafId = requestAnimationFrame(frame);
    }
    rafId = requestAnimationFrame(frame);
    return true;
  }

  function updateOptions(options) {
    if (!activeId || !canvasEl) return;
    const scene = SCENES[activeId];
    currentOptions = { ...scene.defaults, ...options };
    const dims = _syncCanvasSize(canvasEl);
    scene.init(state, dims.w, dims.h, currentOptions);
  }

  function list() {
    return Object.entries(SCENES).map(([id, s]) => ({ id, label: s.label, defaults: s.defaults, options: s.options }));
  }

  function get(id) { return SCENES[id] || null; }
  function isActiveCanvas(canvas) { return canvasEl === canvas; }


  const __helpers = { _hexToRgb, _mixHex, _makeSnowSprites, resetComet };

  return { start, stop, updateOptions, setOptions: updateOptions, list, get, isActiveCanvas, register, SCENES, __helpers };
})();

// jellyfish/scene.js — jellyfish scene module.
// GROUND-UP REBUILD (2026-09-05): the pre-split jellyfish code was purged as
// corrupt/broken; this is a fresh implementation written against the reference
// contract (see scene-lab/prior-art/purged-scenes-2026-09-04/jellyfish.js).
// Scene id, label, option keys, defaults, and preset bg colors stay stable so
// saved themes keep resolving.
//
// Look: deep water at night. Soft light rays slant down from the surface while
// glowing jellyfish drift upward — pulsing bells, inner glow, and wavy
// tentacles in two depth bands — over a dark seabed with rising particles.
// `density` is jellyfish count, `speed` paces the drift and pulse, `color`
// tints their glow.

(() => {
  const { _hexToRgb } = ThemeScenes.__helpers;

  function _rgba(c, a) {
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  }

  ThemeScenes.register("jellyfish", {
    label: "Jellyfish",
    defaults: { density: 8, speed: 1, color: "#67e8f9" },
    presetBgColors: ["#020617", "#000000", "#0a0a2e", "#0f172a", "#1a0a2e", "#0d1117"],
    // Suggested glow color + background pairings, shown in the theme editor
    // as ONE split-swatch row under Background Color (each tile: color half
    // on the left, background half on the right). Halves click independently
    // so a background from one pair can mix with a color from another. The
    // first pair mirrors the scene defaults. Keys map to scene options; "bg"
    // is the background color (not a scene option).
    presetCombos: [
      { color: "#67e8f9", bg: "#020617" }, // cyan glow on abyssal night (defaults)
      { color: "#e879f9", bg: "#1a0a2e" }, // orchid on dark plum
      { color: "#fb7185", bg: "#2a0e1a" }, // rose on deep wine
      { color: "#7dd3fc", bg: "#0a1628" }, // sky blue on deep navy
      { color: "#5eead4", bg: "#04221b" }, // sea glass on dark lagoon
      { color: "#fcd34d", bg: "#1a1508" }, // golden on warm abyss
    ],
    options: [
      { key: "density", label: "Jellyfish", type: "range", min: 3, max: 25, step: 1 },
      { key: "speed", label: "Speed", type: "range", min: 0.3, max: 3, step: 0.1 },
      { key: "color", label: "Color", type: "color" },
    ],
    init(state, w, h, opts) {
      state.t = 0;
      state.S = h / 1080;
      const S = state.S;
      const rgb = _hexToRgb(opts.color || "#67e8f9");
      state.groundY = h * 0.88;

      // ── Jellies: far band (small, dim) → near band (big, bright) ─────
      const bands = [
        { n: 0.5, size: 0.6, spd: 0.8, alpha: 0.5 },
        { n: 0.5, size: 1.0, spd: 1.1, alpha: 0.95 },
      ];
      state.jellies = [];
      const count = opts.density ?? 8;
      for (const band of bands) {
        const n = Math.max(1, Math.round(count * band.n));
        for (let i = 0; i < n; i++) {
          state.jellies.push({
            x: Math.random() * w,
            y: Math.random() * h,
            s: (10 + Math.random() * 8) * S * band.size,
            vy: -(6 + Math.random() * 10) * band.spd,
            pulseSp: 1.4 + Math.random() * 1.4,
            pulse: Math.random() * Math.PI * 2,
            waveSp: 2 + Math.random() * 2,
            ph: Math.random() * Math.PI * 2,
            tent: 4 + Math.floor(Math.random() * 3),
            rgb,
            alpha: band.alpha * (0.7 + Math.random() * 0.4),
          });
        }
      }

      // ── Light rays slanting down from the surface ────────────────────
      state.rays = [];
      for (let i = 0; i < 4; i++) {
        state.rays.push({
          x: Math.random(),
          w: w * (0.05 + Math.random() * 0.07),
          ph: Math.random() * Math.PI * 2,
          a: 0.05 + Math.random() * 0.04,
        });
      }

      // ── Rising particles ─────────────────────────────────────────────
      state.particles = [];
      for (let i = 0; i < 42; i++) {
        state.particles.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: (0.6 + Math.random() * 1.4) * S,
          sp: (4 + Math.random() * 10) * S,
          a: 0.08 + Math.random() * 0.2,
          ph: Math.random() * Math.PI * 2,
        });
      }

      // ── Seabed silhouette ────────────────────────────────────────────
      state.seabed = [];
      for (let i = 0; i < 8; i++) {
        state.seabed.push({
          x: (i / 7) * w + (Math.random() - 0.5) * w * 0.06,
          r: h * (0.03 + Math.random() * 0.04),
        });
      }
    },

    draw(ctx, w, h, state, opts, dt) {
      const speed = opts.speed ?? 1;
      const bgColor = opts.bgColor || null;
      state.t += dt;
      const t = state.t * speed;
      const dtm = dt * speed;
      const S = state.S;
      const groundY = state.groundY;

      ctx.clearRect(0, 0, w, h);

      // ── Water: deep gradient ─────────────────────────────────────────
      if (bgColor) {
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, w, h);
      } else {
        const water = ctx.createLinearGradient(0, 0, 0, h);
        water.addColorStop(0, "#041322");
        water.addColorStop(0.6, "#071a2e");
        water.addColorStop(1, "#081226");
        ctx.fillStyle = water;
        ctx.fillRect(0, 0, w, h);
      }

      // ── Light rays ───────────────────────────────────────────────────
      for (const r of state.rays) {
        const rx = r.x * w + Math.sin(t * 0.15 + r.ph) * w * 0.025;
        const ray = ctx.createLinearGradient(rx, 0, rx + r.w, h * 0.55);
        ray.addColorStop(0, _rgba(state.jellies[0]?.rgb || [103, 232, 249], r.a * (0.75 + 0.25 * Math.sin(t * 0.8 + r.ph * 3))));
        ray.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = ray;
        ctx.save();
        ctx.translate(rx, 0);
        ctx.transform(1, 0, -0.35, 1, 0, 0);
        ctx.fillRect(-r.w, 0, r.w * 2, h * 0.55);
        ctx.restore();
      }

      // ── Particles drifting up ────────────────────────────────────────
      for (const p of state.particles) {
        p.y -= p.sp * dtm;
        p.x += Math.sin(t * 0.5 + p.ph) * 3 * S * dtm;
        if (p.y < -4) {
          p.y = h + 4;
          p.x = Math.random() * w;
        }
        ctx.fillStyle = `rgba(190,205,255,${(p.a * (0.7 + 0.3 * Math.sin(t + p.ph))).toFixed(3)})`;
        ctx.fillRect(p.x, p.y, p.r, p.r);
      }

      // ── Jellyfish, far → near ────────────────────────────────────────
      for (const l of state.jellies) {
        l.y += l.vy * dtm;
        l.x += Math.sin(t * 0.3 + l.ph) * 8 * S * dtm;
        if (l.y < -l.s * 3) {
          l.y = h + l.s * 2;
          l.x = Math.random() * w;
        }
        // asymmetric swim stroke: the bell contracts fast, relaxes slowly
        const p = Math.sin(t * l.pulseSp + l.pulse);
        const ph = p >= 0 ? Math.pow(p, 0.55) : -Math.pow(-p, 1.7);
        const bw = l.s * (0.9 + 0.16 * ph);
        const bh = l.s * 0.78 * (1.15 - 0.25 * ph);
        // lurch upward on each contraction, glide between pulses
        if (ph > 0.35) l.y -= (ph - 0.35) * l.s * 1.4 * dtm;

        // inner glow
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        const glow = ctx.createRadialGradient(l.x, l.y - bh * 0.25, 0, l.x, l.y - bh * 0.25, l.s * 1.7);
        glow.addColorStop(0, _rgba(l.rgb, 0.3 * l.alpha * (0.75 + 0.25 * ph)));
        glow.addColorStop(0.55, _rgba(l.rgb, 0.1 * l.alpha));
        glow.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = glow;
        ctx.fillRect(l.x - l.s * 1.7, l.y - bh - l.s, l.s * 3.4, l.s * 3.4);

        // bell
        ctx.fillStyle = _rgba(l.rgb, 0.32 * l.alpha);
        ctx.beginPath();
        ctx.ellipse(l.x, l.y, bw, bh, 0, Math.PI, 0);
        ctx.fill();
        // bright rim along the bell
        ctx.strokeStyle = _rgba([255, 255, 255], 0.4 * l.alpha);
        ctx.lineWidth = Math.max(0.8, l.s * 0.07);
        ctx.beginPath();
        ctx.ellipse(l.x, l.y, bw * 0.96, bh * 0.92, 0, Math.PI * 0.92, Math.PI * 0.08);
        ctx.stroke();
        // gonads: four faint petal rings inside the bell
        ctx.strokeStyle = _rgba(l.rgb, 0.28 * l.alpha);
        ctx.lineWidth = Math.max(0.6, l.s * 0.05);
        for (let gx = -1; gx <= 1; gx += 2) {
          for (let gy = -1; gy <= 1; gy += 2) {
            ctx.beginPath();
            ctx.ellipse(l.x + gx * bw * 0.16, l.y - bh * 0.42 + gy * bh * 0.14, bw * 0.09, bh * 0.12, 0, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
        ctx.restore();

        // tentacles: wavy strands hanging below the bell
        ctx.strokeStyle = _rgba(l.rgb, 0.38 * l.alpha);
        ctx.lineWidth = Math.max(0.7, l.s * 0.07);
        for (let ti = 0; ti < l.tent; ti++) {
          const tx0 = l.x + (l.tent === 1 ? 0 : (ti / (l.tent - 1) - 0.5) * bw * 1.5);
          const len = l.s * (1.7 + 0.6 * Math.sin(ti * 2.1 + l.ph));
          ctx.beginPath();
          ctx.moveTo(tx0, l.y + bh * 0.22);
          const segs = 5;
          for (let sgi = 1; sgi <= segs; sgi++) {
            const yy = l.y + bh * 0.22 + (len / segs) * sgi;
            const wave = Math.sin(t * l.waveSp + l.ph + sgi * 0.9 + ti * 1.7) * l.s * 0.24 * (sgi / segs);
            ctx.lineTo(tx0 + wave, yy);
          }
          ctx.stroke();
        }
      }

      // ── Seabed: dark bumps with a soft glow line ─────────────────────
      const warm = state.jellies[0]?.rgb || [103, 232, 249];
      const glowLine = ctx.createLinearGradient(0, groundY - h * 0.06, 0, groundY);
      glowLine.addColorStop(0, _rgba(warm, 0.08));
      glowLine.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = glowLine;
      ctx.fillRect(0, groundY - h * 0.06, w, h * 0.06);
      ctx.fillStyle = "rgba(5,8,16,0.95)";
      for (const b of state.seabed) {
        ctx.beginPath();
        ctx.arc(b.x, groundY + b.r * 0.5, b.r, Math.PI, 0);
        ctx.fill();
      }
      ctx.fillRect(0, groundY, w, h - groundY);

      // ── Vignette ──────────────────────────────────────────────────────
      const vig = ctx.createRadialGradient(w / 2, h * 0.42, Math.min(w, h) * 0.45, w / 2, h * 0.5, Math.max(w, h) * 0.9);
      vig.addColorStop(0, "rgba(0,0,0,0)");
      vig.addColorStop(1, "rgba(0,0,0,0.4)");
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, w, h);
    },
  });
})();
const canvas = document.getElementById('c');
const scene = ThemeScenes.get('jellyfish');
const optsRow = document.getElementById('opts');
const info = document.getElementById('info');
const opts = { ...scene.defaults };
const labels = {};
optsRow.innerHTML = '';
scene.options.forEach(opt => {
  const lab = document.createElement('label');
  lab.textContent = opt.label + ': ';
  if (opt.type === 'range') {
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = opt.min; inp.max = opt.max; inp.step = opt.step;
    inp.value = opts[opt.key];
    inp.oninput = () => {
      opts[opt.key] = parseFloat(inp.value);
      lab.textContent = opt.label + ': ' + inp.value + ' ';
      lab.appendChild(inp); // textContent above cleared it — put it back
      ThemeScenes.updateOptions(opts);
    };
    lab.appendChild(inp);
  } else if (opt.type === 'color') {
    const inp = document.createElement('input');
    inp.type = 'color'; inp.value = opts[opt.key];
    inp.oninput = () => { opts[opt.key] = inp.value; ThemeScenes.updateOptions(opts); };
    lab.appendChild(inp);
  } else if (opt.type === 'select') {
    const sel = document.createElement('select');
    opt.choices.forEach(([v, l]) => {
      const o = document.createElement('option'); o.value = v; o.textContent = l;
      if (String(opts[opt.key]) === String(v)) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = () => { opts[opt.key] = sel.value; ThemeScenes.updateOptions(opts); };
    lab.appendChild(sel);
  }
  labels[opt.key] = lab;
  optsRow.appendChild(lab);
});
ThemeScenes.start('jellyfish', opts, canvas);
document.getElementById('reroll').onclick = () => ThemeScenes.updateOptions(opts);
info.textContent = 'jellyfish — ' + scene.label + ' (1280x800)';
</script>
</body>
</html>
