<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Preview — dandelion</title>
<style>
  body { background:#101018; color:#e8e8ee; font-family:system-ui; margin:0; padding:16px; display:flex; flex-direction:column; gap:10px; align-items:center; }
  canvas { width:min(960px, 94vw); aspect-ratio:16/10; background:#000; border-radius:10px; }
  #opts { display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:center; font-size:13px; color:#bbb; }
  input[type=range], input[type=color] { vertical-align:middle; }
  button { background:#2a2a35; color:#e8e8ee; border:1px solid #4a4a5a; border-radius:6px; padding:4px 12px; font-size:13px; cursor:pointer; }
  button:hover { background:#3a3a48; }
  #info { font-size:12px; color:#888; }
</style>
</head>
<body>
<div id="opts"></div>
<button id="reroll" type="button">↻ Re-roll layout</button>
<canvas id="c" width="1280" height="800"></canvas>
<div id="info"></div>
<script>
// core.js — ThemeScenes core (registry + shared helpers + runtime).
// Generated by scripts/split-scenes.js from the pre-split assets/js/theme-scenes.js
// (2026-09-04). Helpers/runtime bodies are verbatim; additions: register(),
// __helpers export, empty SCENES registry (populated by per-scene modules).
// NOTE: named core.js, not _core.js — Jekyll drops underscore-prefixed files
// from static dirs, so the underscore prefix would 404 on the live site.
const ThemeScenes = (() => {
  const SCENES = {};

  function register(id, def) { SCENES[id] = def; }

  let _snowSpriteCache = null;
  function _makeSnowSprites() {
    const levels = [];
    for (let lv = 0; lv < 4; lv++) {
      const frames = [];
      const sz = 32;
      for (let fi = 0; fi < 16; fi++) {
        const c = document.createElement('canvas');
        c.width = c.height = sz;
        const x = c.getContext('2d');
        const cx = sz / 2, cy = sz / 2;
        const rot = (fi / 16) * Math.PI * 2;
        const arms = lv + 3;
        const armLen = sz * 0.35;
        const coreR = sz * (0.06 + lv * 0.02);
        x.save();
        x.translate(cx, cy);
        x.rotate(rot);
        // core glow
        const glow = x.createRadialGradient(0, 0, 0, 0, 0, coreR * 3);
        glow.addColorStop(0, 'rgba(232,237,245,0.5)');
        glow.addColorStop(1, 'rgba(232,237,245,0)');
        x.fillStyle = glow;
        x.beginPath(); x.arc(0, 0, coreR * 3, 0, Math.PI * 2); x.fill();
        // crystal arms
        x.strokeStyle = 'rgba(232,237,245,0.9)';
        x.lineWidth = 1 + lv * 0.3;
        x.lineCap = 'round';
        for (let a = 0; a < arms; a++) {
          const angle = (a / arms) * Math.PI * 2;
          x.beginPath();
          x.moveTo(0, 0);
          x.lineTo(Math.cos(angle) * armLen, Math.sin(angle) * armLen);
          x.stroke();
          // side branches on larger flakes
          if (lv >= 1) {
            const bLen = armLen * 0.4;
            const bDist = armLen * 0.6;
            const bx = Math.cos(angle) * bDist;
            const by = Math.sin(angle) * bDist;
            for (let s = -1; s <= 1; s += 2) {
              const ba = angle + s * Math.PI / 4;
              x.beginPath();
              x.moveTo(bx, by);
              x.lineTo(bx + Math.cos(ba) * bLen, by + Math.sin(ba) * bLen);
              x.stroke();
            }
          }
        }
        // center dot
        x.fillStyle = 'rgba(255,255,255,0.9)';
        x.beginPath(); x.arc(0, 0, coreR, 0, Math.PI * 2); x.fill();
        x.restore();
        frames.push(c);
      }
      levels.push(frames);
    }
    return levels;
  }

  function _mixHex(hex1, hex2, t) {
    const [r1, g1, b1] = _hexToRgb(hex1);
    const [r2, g2, b2] = _hexToRgb(hex2);
    return `rgb(${Math.round(r1 + (r2 - r1) * t)},${Math.round(g1 + (g2 - g1) * t)},${Math.round(b1 + (b2 - b1) * t)})`;
  }

  function _hexToRgb(hex) {
    if (!hex || typeof hex !== "string") return [167, 139, 250];
    const clean = hex.replace("#", "");
    if (clean.length < 6) return [167, 139, 250];
    return [parseInt(clean.slice(0, 2), 16), parseInt(clean.slice(2, 4), 16), parseInt(clean.slice(4, 6), 16)];
  }

  function resetComet(c, w, h, speed) {
    c.vx = (Math.random() - 0.5) * 200;
    c.vy = (Math.random() - 0.5) * 200;
    c.speed = (Math.random() * 0.5 + 0.5) * speed;
    c.trail = [];
    c.maxTrail = Math.floor(Math.random() * 20 + 15);
    c.alpha = Math.random() * 0.4 + 0.3;
  }

  let activeId = null;
  let rafId = null;
  let canvasEl = null;
  let state = {};
  let lastTime = 0;
  let currentOptions = {};
  let resizeHandler = null;

  function _syncCanvasSize(canvas) {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.floor(rect.width));
    const h = Math.max(1, Math.floor(rect.height));
    const pw = Math.floor(w * dpr), ph = Math.floor(h * dpr);
    const resized = canvas.width !== pw || canvas.height !== ph;
    if (resized) {
      canvas.width = pw; canvas.height = ph;
      const ctx = canvas.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    return { w, h, ctx: canvas.getContext("2d"), resized };
  }

  function stop() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (resizeHandler) { window.removeEventListener("resize", resizeHandler); resizeHandler = null; }
    const scene = SCENES[activeId];
    if (scene && typeof scene.destroy === "function") scene.destroy(state);
    activeId = null; state = {}; lastTime = 0; currentOptions = {};
    if (canvasEl) {
      canvasEl.style.display = "none";
      canvasEl.style.zIndex = "1";
      canvasEl.style.backgroundColor = "";
      const ctx = canvasEl.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
    }
    canvasEl = null;
  }

  function start(sceneId, options, canvas) {
    stop();
    const scene = SCENES[sceneId];
    if (!scene || !canvas) return false;
    const opts = { ...scene.defaults, ...options };
    activeId = sceneId; currentOptions = opts; canvasEl = canvas;
    canvas.style.display = "block"; state = {};
    let dims = _syncCanvasSize(canvas);
    scene.init(state, dims.w, dims.h, opts);
    resizeHandler = () => {
      dims = _syncCanvasSize(canvas);
      if (typeof scene.destroy === "function") scene.destroy(state);
      scene.init(state, dims.w, dims.h, currentOptions);
    };
    window.addEventListener("resize", resizeHandler);
    lastTime = performance.now();
    function frame(now) {
      if (!activeId || canvasEl !== canvas) return;
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now; dims = _syncCanvasSize(canvas);
      if (dims.resized) {
        if (typeof scene.destroy === "function") scene.destroy(state);
        scene.init(state, dims.w, dims.h, currentOptions);
      }
      scene.draw(dims.ctx, dims.w, dims.h, state, currentOptions, dt);
      rafId = requestAnimationFrame(frame);
    }
    rafId = requestAnimationFrame(frame);
    return true;
  }

  function updateOptions(options) {
    if (!activeId || !canvasEl) return;
    const scene = SCENES[activeId];
    currentOptions = { ...scene.defaults, ...options };
    const dims = _syncCanvasSize(canvasEl);
    if (typeof scene.destroy === "function") scene.destroy(state);
    scene.init(state, dims.w, dims.h, currentOptions);
  }

  function list() {
    return Object.entries(SCENES).map(([id, s]) => ({ id, label: s.label, defaults: s.defaults, options: s.options }));
  }

  function get(id) { return SCENES[id] || null; }
  function isActiveCanvas(canvas) { return canvasEl === canvas; }


  const __helpers = { _hexToRgb, _mixHex, _makeSnowSprites, resetComet };

  return { start, stop, updateOptions, setOptions: updateOptions, list, get, isActiveCanvas, register, SCENES, __helpers };
})();

// dandelion/scene.js — dandelion seeds scene module.
// GROUND-UP REWORK (2026-09-21): GPU-first rebuild to the campaign standard.
// Scene id, label, option keys, defaults, presetBgColors, and presetCombos
// stay stable so saved themes keep resolving.
//
// Look: dandelion seeds drifting through a quiet night sky. A WebGL2 offscreen
// surface paints a deep-night sky (moon glow, drifting haze, twinkling stars,
// vignette — all derived from the user's background/tint so a chosen bg never
// clashes) and then an instanced field of seeds. Each seed is a procedural
// feathery starburst — core glow, six main rays, secondary fluff, tip dots,
// a hanging stem, and a soft halo — tumbling slowly as it rides an integrated
// gust that speeds and eases the whole field. Depth does the cinematic work:
// far seeds are smaller, dimmer, softer with wider halos; near seeds are sharp
// and bright, with gentle parallax between layers.
//
// Degrades gracefully: if WebGL2 is unavailable or the context is lost, an
// animated Canvas-2D fallback renders a two-layer depth version of the same
// seed field. Teardown is idempotent via destroy(state) (hosts call it on
// stop/reinit/resize). Per-frame CPU cost is O(1): all seed motion is driven
// by shader uniforms from per-instance attributes uploaded once at init.

(() => {
  const { _hexToRgb } = ThemeScenes.__helpers;

  function _rgba(c, a) {
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  }

  // ── Shaders ─────────────────────────────────────────────────────────────
  const quadVertSource = `#version 300 es
  layout(location = 0) in vec2 aPos;
  void main() { gl_Position = vec4(aPos, 0.0, 1.0); }`;

  // Sky pass: night gradient from the user's background, moon glow and haze
  // tinted by the seed color, twinkling stars, soft vignette.
  const skyFragSource = `#version 300 es
  precision highp float;
  uniform vec2 resolution;
  uniform float time;
  uniform vec3 uBg;
  uniform vec3 uTint;
  out vec4 outColor;

  float hash(vec2 p) {
    p = fract(p * vec2(127.1, 311.7));
    p += dot(p, p + 34.5);
    return fract(p.x * p.y);
  }
  float noise(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
               mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
  }
  float fbm(vec2 p) {
    float v = 0.0;
    float a = 0.5;
    mat2 m = mat2(0.8, -0.6, 0.6, 0.8);
    for (int i = 0; i < 3; i++) {
      v += a * noise(p);
      p = m * p * 2.02 + vec2(11.3, 7.7);
      a *= 0.5;
    }
    return v;
  }

  void main() {
    vec2 uv = gl_FragCoord.xy / resolution;
    vec2 p = (gl_FragCoord.xy - resolution * 0.5) / resolution.y;
    // vertical lift: darker overhead, slightly lighter toward the ground glow
    vec3 col = mix(uBg * 0.45, uBg * 1.2, smoothstep(0.0, 1.0, uv.y));
    // moon glow, tinted toward the seed color so the scene stays cohesive
    vec3 moonCol = mix(uTint, vec3(1.0), 0.55);
    float md = length((p - vec2(0.30, 0.26)) * vec2(1.0, 1.25));
    col += moonCol * exp(-md * 3.2) * 0.30;
    col += moonCol * exp(-md * 12.0) * 0.30;
    // slow drifting haze
    col += uTint * fbm(p * 2.2 + vec2(time * 0.012, -time * 0.005)) * 0.045;
    // twinkling stars (round points jittered inside their cells)
    vec2 g = (p + vec2(time * 0.004, 0.0)) * 42.0;
    vec2 cell = floor(g);
    vec2 f = fract(g);
    float h1 = hash(cell);
    vec2 sp = vec2(hash(cell + 7.1), hash(cell + 3.7)) * 0.6 + 0.2;
    float star = smoothstep(0.992, 1.0, h1)
      * exp(-dot(f - sp, f - sp) * 60.0)
      * (0.4 + 0.6 * hash(cell + 11.3))
      * (0.55 + 0.45 * sin(time * 1.7 + h1 * 91.0));
    col += vec3(0.9, 0.93, 1.0) * star * 0.5 * (0.35 + 0.65 * uv.y);
    // vignette
    col *= 1.0 - 0.16 * smoothstep(0.45, 1.25, length(p));
    outColor = vec4(max(col, vec3(0.0)), 1.0);
  }`;

  // Seed instances: vertex shader integrates the gust drift analytically so
  // position is a pure function of uTime (no CPU per-seed work per frame).
  const seedVertSource = `#version 300 es
  layout(location = 0) in vec2 aCorner;  // billboard corner, [-0.5 .. 0.5]
  layout(location = 1) in vec4 aA;       // baseX, baseY, size, depth
  layout(location = 2) in vec4 aB;       // phase, spinRate, wobbleAmp, alphaBase
  uniform vec2 uSize;                    // css-space width/height
  uniform float uTime;                   // wind-paced seconds
  out vec2 vCorner;                      // rotated corner in seed-size units
  out float vDepth;
  out float vAlpha;

  void main() {
    float depth = aA.w;
    // analytic integral of the gust 0.6 + 0.4*sin(0.4t): seeds surge and ease
    float drift = 0.6 * uTime + (1.0 - cos(0.4 * uTime));
    float rate = (10.0 + 25.0 * fract(aB.x * 7.31)) * (0.4 + 0.75 * depth);
    float span = uSize.x + 120.0;
    float x = mod(aA.x + drift * rate, span) - 60.0;
    float rise = (5.0 + 15.0 * fract(aB.y * 3.71 + 0.37)) * (0.6 + 0.5 * depth);
    float yspan = uSize.y + 120.0;
    float y = mod(aA.y - rise * uTime, yspan) - 60.0;
    float wfreq = 0.5 + 1.5 * fract(aB.w * 13.7);
    y += sin(uTime * wfreq + aB.x) * aB.z;
    float rot = aB.x + aB.y * uTime;
    float c = cos(rot);
    float s = sin(rot);
    vec2 rotated = vec2(aCorner.x * c - aCorner.y * s, aCorner.x * s + aCorner.y * c);
    float ext = aA.z * 3.2;             // billboard half-extent covers halo + stem
    x += rotated.x * ext;
    y += rotated.y * ext;
    vCorner = rotated / max(aA.z, 0.001);
    vDepth = depth;
    vAlpha = aB.w * (0.3 + 0.7 * depth);
    gl_Position = vec4(x / uSize.x * 2.0 - 1.0, 1.0 - y / uSize.y * 2.0, 0.0, 1.0);
  }`;

  // Seed fragment: procedural feathery starburst — core, 6 rays, secondary
  // fluff, tip dots, stem, halo — depth controls sharpness/brightness/halo.
  const seedFragSource = `#version 300 es
  precision highp float;
  in vec2 vCorner;
  in float vDepth;
  in float vAlpha;
  uniform vec3 uColor;
  out vec4 outColor;
  const float PI = 3.14159265;
  const float SEG = 0.523598775;  // PI / 3

  void main() {
    float r = length(vCorner);
    if (r > 3.25) discard;
    float ang = atan(vCorner.y, vCorner.x);
    // feathery core + main rays
    float core = exp(-r * r * 2.6);
    float rayA = abs(fract(ang / SEG + 0.5) - 0.5) * SEG;
    float rays = exp(-rayA * rayA * (60.0 + r * r * 30.0))
      * exp(-r * 0.9) * smoothstep(3.1, 0.6, r);
    // faint secondary fluff between the main rays
    float ang2 = ang + SEG * 0.5;
    float rayA2 = abs(fract(ang2 / SEG + 0.5) - 0.5) * SEG;
    float sec = exp(-rayA2 * rayA2 * 140.0) * exp(-r * r * 3.5) * 0.4;
    // bright tip dots where the rays end
    float dots = 0.0;
    for (int k = 0; k < 6; k++) {
      vec2 tip = vec2(cos(float(k) * SEG), sin(float(k) * SEG));
      vec2 d = vCorner - tip;
      dots += exp(-dot(d, d) * 26.0);
    }
    dots = min(dots, 1.0) * smoothstep(3.1, 1.6, r);
    // stem hanging from the puff, rotating with the seed
    float stemD = length(vec2(vCorner.x, vCorner.y - clamp(vCorner.y, 0.0, 3.0)));
    float stem = exp(-stemD * stemD * 110.0)
      * (1.0 - smoothstep(2.95, 3.2, vCorner.y)) * step(0.0, vCorner.y) * 0.7;

    float bright = 0.55 + 0.45 * vDepth;         // far seeds dimmer
    float i = (core * 0.85
      + rays * 0.9 * mix(0.55, 1.0, vDepth)      // far seeds softer
      + sec + dots * 0.85 + stem) * bright;
    float halo = exp(-r * r * 0.30) * mix(0.20, 0.08, vDepth) * bright;
    float a = clamp(i + halo, 0.0, 1.0) * vAlpha;
    outColor = vec4(uColor * (i + halo), a);
  }`;

  // ── GL helpers ──────────────────────────────────────────────────────────
  function rgb255(hex, fallback) {
    const value = /^#[\da-f]{6}$/i.test(hex || "") ? hex : fallback;
    return [1, 3, 5].map((i) => parseInt(value.slice(i, i + 2), 16));
  }

  function release(state) {
    const gl = state.gl;
    if (state.surface && state.onLost)
      state.surface.removeEventListener("webglcontextlost", state.onLost);
    if (gl) {
      for (const vao of state.vaos || []) gl.deleteVertexArray(vao);
      for (const buf of state.buffers || []) gl.deleteBuffer(buf);
      for (const prog of state.programs || []) gl.deleteProgram(prog);
      for (const shader of state.shaders || []) gl.deleteShader(shader);
      const lose = gl.getExtension("WEBGL_lose_context");
      if (lose && !gl.isContextLost()) lose.loseContext();
    }
    if (state.surface) state.surface.width = state.surface.height = 1;
    state.gl = null;
    state.programs = null;
    state.skyProgram = null;
    state.seedProgram = null;
    state.shaders = null;
    state.buffers = null;
    state.vaos = null;
    state.skyU = null;
    state.seedU = null;
    state.surface = null;
    state.onLost = null;
  }

  function makeProgram(gl, state, vertSrc, fragSrc) {
    const program = gl.createProgram();
    if (!program) throw new Error("dandelion: program unavailable");
    for (const [type, source] of [
      [gl.VERTEX_SHADER, vertSrc],
      [gl.FRAGMENT_SHADER, fragSrc],
    ]) {
      const shader = gl.createShader(type);
      if (!shader) throw new Error("dandelion: shader unavailable");
      state.shaders.push(shader);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
        throw new Error(gl.getShaderInfoLog(shader));
      gl.attachShader(program, shader);
    }
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS))
      throw new Error(gl.getProgramInfoLog(program));
    for (const shader of state.shaders.splice(0)) {
      gl.detachShader(program, shader);
      gl.deleteShader(shader);
    }
    return program;
  }

  // ── Canvas-2D fallback (always animated; two depth layers) ──────────────
  function fallback(ctx, w, h, state, opts) {
    const color = opts.color || "#e2e8f0";
    const bgColor = opts.bgColor || null;
    const rgb = _hexToRgb(color);
    const speed = opts.speed ?? 1;
    const dtm = (state.dtc || 0) * speed;
    const t = state.t;

    ctx.clearRect(0, 0, w, h);
    if (bgColor) {
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, w, h);
    } else {
      const sky = ctx.createLinearGradient(0, 0, 0, h);
      sky.addColorStop(0, "#01030f");
      sky.addColorStop(1, "#0a1226");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);
    }

    // same integrated gust the GPU path uses, evaluated per frame
    const gust = 0.6 + 0.4 * Math.sin(t * 0.4);
    for (const s of state.seeds) {
      s.rot += s.rotSp * dtm;
      s.wobble += s.wobbleSp * dtm;
      s.x += s.vx * gust * dtm;
      s.y += (s.vy + Math.sin(s.wobble) * s.wobbleAmp) * dtm;
      if (s.x > w + 60) {
        s.x = -60;
        s.y = Math.random() * (h + 120);
      }
      if (s.y < -60) {
        s.y = h + 60;
        s.x = Math.random() * (w + 120);
      }

      // depth: far seeds smaller, dimmer, softer with a wider halo
      const depth = s.depth ?? 0.5;
      const size = s.size * (0.75 + 0.35 * depth);
      const alpha = s.alpha * (0.35 + 0.65 * depth);
      const haloK = 1.4 - depth * 0.7;

      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      ctx.globalAlpha = alpha;

      // soft halo: the gradient is transformed at fill time, so build its
      // coordinates in the same translated/rotated space we fill in
      const haloR = size * 2.6 * haloK;
      const halo = ctx.createRadialGradient(0, 0, 0, 0, 0, haloR);
      halo.addColorStop(0, _rgba(rgb, 0.1 * alpha * haloK));
      halo.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(0, 0, haloR, 0, Math.PI * 2);
      ctx.fill();

      // stem
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(0.4, 0.5 * state.S);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, size * 3);
      ctx.stroke();

      // feathery starburst: rays + tip dots
      const rays = 6;
      for (let r2 = 0; r2 < rays; r2++) {
        const a = (r2 / rays) * Math.PI * 2;
        ctx.strokeStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * size, Math.sin(a) * size);
        ctx.stroke();
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(Math.cos(a) * size, Math.sin(a) * size, Math.max(0.5, 0.6 * state.S), 0, Math.PI * 2);
        ctx.fill();
      }
      // faint secondary rays between the main ones for fluff
      ctx.globalAlpha = alpha * 0.4;
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(0.3, 0.4 * state.S);
      for (let r2 = 0; r2 < rays; r2++) {
        const a = ((r2 + 0.5) / rays) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(a) * size * 0.55, Math.sin(a) * size * 0.55);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // ── Registration (surface unchanged) ────────────────────────────────────
  ThemeScenes.register("dandelion", {
    label: "Dandelion Seeds",
    defaults: { density: 40, speed: 1, color: "#e2e8f0" },
    presetBgColors: ["#020617", "#000000", "#0a1a0a", "#0f172a", "#1a1a08", "#0d1117"],
    // Suggested seed color + background pairings, shown in the theme editor
    // as ONE split-swatch row under Background Color (each tile: color half
    // on the left, background half on the right). Halves click independently
    // so a background from one pair can mix with a color from another. The
    // first pair mirrors the scene defaults. Keys map to scene options; "bg"
    // is the background color (not a scene option).
    presetCombos: [
      { color: "#e2e8f0", bg: "#020617" }, // moon white on deep night (defaults)
      { color: "#fde68a", bg: "#1a1a08" }, // pale gold on dark straw
      { color: "#a7f3d0", bg: "#0a1a0a" }, // mint on meadow green
      { color: "#f9a8d4", bg: "#1a0a2e" }, // sakura pink on dark plum
      { color: "#bae6fd", bg: "#0a1628" }, // sky blue on deep navy
      { color: "#e7e5e4", bg: "#0d1117" }, // stone white on slate
    ],
    options: [
      { key: "density", label: "Seeds", type: "range", min: 10, max: 100, step: 5 },
      { key: "speed", label: "Wind", type: "range", min: 0.3, max: 3, step: 0.1 },
      { key: "color", label: "Seed Color", type: "color" },
    ],

    init(state, w, h, opts) {
      release(state);
      state.t = state.t || 0;
      state.dtc = 0;
      state.S = h / 1080;
      const S = state.S;

      // Seed table shared by the GPU path (attributes) and the 2D fallback.
      const count = Math.max(1, Math.round(opts.density ?? 40));
      state.count = count;
      state.seeds = [];
      for (let i = 0; i < count; i++) {
        // stratified depth with jitter → even parallax layering
        const depth = Math.min(0.95, Math.max(0.05, (i + Math.random() * 0.8 - 0.4) / Math.max(1, count - 1)));
        state.seeds.push({
          x: Math.random() * (w + 120),
          y: Math.random() * (h + 120),
          size: (Math.random() * 4 + 3) * S,
          depth,
          phase: Math.random() * Math.PI * 2,
          rot: Math.random() * Math.PI * 2,
          rotSp: (Math.random() - 0.5) * 1.8,
          wobble: Math.random() * Math.PI * 2,
          wobbleSp: Math.random() * 1.5 + 0.5,
          wobbleAmp: (Math.random() * 15 + 5) * S,
          vx: (Math.random() * 25 + 10) * S,
          vy: -(Math.random() * 15 + 5) * S,
          alpha: Math.random() * 0.4 + 0.5,
        });
      }

      try {
        state.surface = document.createElement("canvas");
        const gl = state.surface.getContext("webgl2", {
          alpha: false,
          antialias: false,
          depth: false,
          stencil: false,
          preserveDrawingBuffer: false,
        });
        state.gl = gl;
        if (!gl) {
          release(state);
          return;
        }
        state.onLost = (event) => {
          event.preventDefault();
          state.lost = true;
        };
        state.surface.addEventListener("webglcontextlost", state.onLost);
        state.lost = false;
        state.shaders = [];
        state.programs = [];
        state.buffers = [];
        state.vaos = [];

        state.skyProgram = makeProgram(gl, state, quadVertSource, skyFragSource);
        state.seedProgram = makeProgram(gl, state, seedVertSource, seedFragSource);
        state.programs.push(state.skyProgram, state.seedProgram);
        state.skyU = Object.fromEntries(
          ["resolution", "time", "uBg", "uTint"].map((k) => [k, gl.getUniformLocation(state.skyProgram, k)]),
        );
        state.seedU = Object.fromEntries(
          ["uSize", "uTime", "uColor"].map((k) => [k, gl.getUniformLocation(state.seedProgram, k)]),
        );

        // full-screen quad
        const quadBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-0.5, -0.5, 1.5, -0.5, -0.5, 1.5, -0.5, 1.5, 1.5, -0.5, 1.5, 1.5]),
          gl.STATIC_DRAW,
        );
        state.buffers.push(quadBuf);

        // sky VAO: quad only
        const skyVao = gl.createVertexArray();
        gl.bindVertexArray(skyVao);
        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        state.vaos.push(skyVao);

        // seed VAO: quad + per-instance attributes
        const instData = new Float32Array(count * 8);
        for (let i = 0; i < count; i++) {
          const s = state.seeds[i];
          instData[i * 8 + 0] = s.x;
          instData[i * 8 + 1] = s.y;
          instData[i * 8 + 2] = s.size;
          instData[i * 8 + 3] = s.depth;
          instData[i * 8 + 4] = s.phase;
          instData[i * 8 + 5] = s.rotSp;
          instData[i * 8 + 6] = s.wobbleAmp;
          instData[i * 8 + 7] = s.alpha;
        }
        const instBuf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
        gl.bufferData(gl.ARRAY_BUFFER, instData, gl.STATIC_DRAW);
        state.buffers.push(instBuf);
        const seedVao = gl.createVertexArray();
        gl.bindVertexArray(seedVao);
        gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
        gl.enableVertexAttribArray(0);
        gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
        gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
        gl.enableVertexAttribArray(1);
        gl.vertexAttribPointer(1, 4, gl.FLOAT, false, 32, 0);
        gl.vertexAttribDivisor(1, 1);
        gl.enableVertexAttribArray(2);
        gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 32, 16);
        gl.vertexAttribDivisor(2, 1);
        state.vaos.push(seedVao);
        gl.bindVertexArray(null);
      } catch {
        release(state);
      }
    },

    draw(ctx, w, h, state, opts, dt) {
      if (w <= 0 || h <= 0) return;
      const dtc = Math.min(0.05, Math.max(0, dt || 0));
      state.dtc = dtc;
      state.t += dtc * (opts.speed ?? 1);

      ctx.save();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = "source-over";
      const gl = state.gl;
      if (!gl || state.lost || gl.isContextLost()) {
        fallback(ctx, w, h, state, opts);
        ctx.restore();
        return;
      }
      // respect the host's DPR transform: render at device resolution
      const transform = ctx.getTransform();
      const width = Math.max(1, Math.round(w * Math.hypot(transform.a, transform.b)));
      const height = Math.max(1, Math.round(h * Math.hypot(transform.c, transform.d)));
      if (state.surface.width !== width || state.surface.height !== height) {
        const max = gl.getParameter(gl.MAX_VIEWPORT_DIMS);
        if (width > max[0] || height > max[1]) {
          fallback(ctx, w, h, state, opts);
          ctx.restore();
          return;
        }
        state.surface.width = width;
        state.surface.height = height;
      }

      gl.disable(gl.BLEND);
      gl.viewport(0, 0, width, height);
      const bg = rgb255(opts.bgColor, "#050a1a");
      const tint = rgb255(opts.color, "#e2e8f0");

      // pass 1: night sky
      gl.useProgram(state.skyProgram);
      gl.bindVertexArray(state.vaos[0]);
      gl.uniform2f(state.skyU.resolution, width, height);
      gl.uniform1f(state.skyU.time, state.t);
      gl.uniform3f(state.skyU.uBg, bg[0] / 255, bg[1] / 255, bg[2] / 255);
      gl.uniform3f(state.skyU.uTint, tint[0] / 255, tint[1] / 255, tint[2] / 255);
      gl.drawArrays(gl.TRIANGLES, 0, 6);

      // pass 2: instanced seeds, alpha-blended over the sky
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
      gl.useProgram(state.seedProgram);
      gl.bindVertexArray(state.vaos[1]);
      gl.uniform2f(state.seedU.uSize, w, h);
      gl.uniform1f(state.seedU.uTime, state.t);
      gl.uniform3f(state.seedU.uColor, tint[0] / 255, tint[1] / 255, tint[2] / 255);
      gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, state.count);
      gl.bindVertexArray(null);

      ctx.drawImage(state.surface, 0, 0, w, h);
      ctx.restore();
    },

    destroy(state) {
      release(state);
    },
  });
})();

const canvas = document.getElementById('c');
const scene = ThemeScenes.get('dandelion');
const optsRow = document.getElementById('opts');
const info = document.getElementById('info');
const opts = { ...scene.defaults };
const labels = {};
optsRow.innerHTML = '';
scene.options.forEach(opt => {
  const lab = document.createElement('label');
  lab.textContent = opt.label + ': ';
  if (opt.type === 'range') {
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = opt.min; inp.max = opt.max; inp.step = opt.step;
    inp.value = opts[opt.key];
    inp.oninput = () => {
      opts[opt.key] = parseFloat(inp.value);
      lab.textContent = opt.label + ': ' + inp.value + ' ';
      lab.appendChild(inp); // textContent above cleared it — put it back
      ThemeScenes.updateOptions(opts);
    };
    lab.appendChild(inp);
  } else if (opt.type === 'color') {
    const inp = document.createElement('input');
    inp.type = 'color'; inp.value = opts[opt.key];
    inp.oninput = () => { opts[opt.key] = inp.value; ThemeScenes.updateOptions(opts); };
    lab.appendChild(inp);
  } else if (opt.type === 'select') {
    const sel = document.createElement('select');
    opt.choices.forEach(([v, l]) => {
      const o = document.createElement('option'); o.value = v; o.textContent = l;
      if (String(opts[opt.key]) === String(v)) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = () => { opts[opt.key] = sel.value; ThemeScenes.updateOptions(opts); };
    lab.appendChild(sel);
  }
  labels[opt.key] = lab;
  optsRow.appendChild(lab);
});
ThemeScenes.start('dandelion', opts, canvas);
document.getElementById('reroll').onclick = () => ThemeScenes.updateOptions(opts);
info.textContent = 'dandelion — ' + scene.label + ' (1280x800)';
</script>
</body>
</html>
