<script>
// core.js — ThemeScenes core (registry + shared helpers + runtime).
// Generated by scripts/split-scenes.js from the pre-split assets/js/theme-scenes.js
// (2026-09-04). Helpers/runtime bodies are verbatim; additions: register(),
// __helpers export, empty SCENES registry (populated by per-scene modules).
// NOTE: named core.js, not _core.js — Jekyll drops underscore-prefixed files
// from static dirs, so the underscore prefix would 404 on the live site.
const ThemeScenes = (() => {
  const SCENES = {};

  function register(id, def) { SCENES[id] = def; }

  let _snowSpriteCache = null;
  function _makeSnowSprites() {
    const levels = [];
    for (let lv = 0; lv < 4; lv++) {
      const frames = [];
      const sz = 32;
      for (let fi = 0; fi < 16; fi++) {
        const c = document.createElement('canvas');
        c.width = c.height = sz;
        const x = c.getContext('2d');
        const cx = sz / 2, cy = sz / 2;
        const rot = (fi / 16) * Math.PI * 2;
        const arms = lv + 3;
        const armLen = sz * 0.35;
        const coreR = sz * (0.06 + lv * 0.02);
        x.save();
        x.translate(cx, cy);
        x.rotate(rot);
        // core glow
        const glow = x.createRadialGradient(0, 0, 0, 0, 0, coreR * 3);
        glow.addColorStop(0, 'rgba(232,237,245,0.5)');
        glow.addColorStop(1, 'rgba(232,237,245,0)');
        x.fillStyle = glow;
        x.beginPath(); x.arc(0, 0, coreR * 3, 0, Math.PI * 2); x.fill();
        // crystal arms
        x.strokeStyle = 'rgba(232,237,245,0.9)';
        x.lineWidth = 1 + lv * 0.3;
        x.lineCap = 'round';
        for (let a = 0; a < arms; a++) {
          const angle = (a / arms) * Math.PI * 2;
          x.beginPath();
          x.moveTo(0, 0);
          x.lineTo(Math.cos(angle) * armLen, Math.sin(angle) * armLen);
          x.stroke();
          // side branches on larger flakes
          if (lv >= 1) {
            const bLen = armLen * 0.4;
            const bDist = armLen * 0.6;
            const bx = Math.cos(angle) * bDist;
            const by = Math.sin(angle) * bDist;
            for (let s = -1; s <= 1; s += 2) {
              const ba = angle + s * Math.PI / 4;
              x.beginPath();
              x.moveTo(bx, by);
              x.lineTo(bx + Math.cos(ba) * bLen, by + Math.sin(ba) * bLen);
              x.stroke();
            }
          }
        }
        // center dot
        x.fillStyle = 'rgba(255,255,255,0.9)';
        x.beginPath(); x.arc(0, 0, coreR, 0, Math.PI * 2); x.fill();
        x.restore();
        frames.push(c);
      }
      levels.push(frames);
    }
    return levels;
  }

  function _mixHex(hex1, hex2, t) {
    const [r1, g1, b1] = _hexToRgb(hex1);
    const [r2, g2, b2] = _hexToRgb(hex2);
    return `rgb(${Math.round(r1 + (r2 - r1) * t)},${Math.round(g1 + (g2 - g1) * t)},${Math.round(b1 + (b2 - b1) * t)})`;
  }

  function _hexToRgb(hex) {
    if (!hex || typeof hex !== "string") return [167, 139, 250];
    const clean = hex.replace("#", "");
    if (clean.length < 6) return [167, 139, 250];
    return [parseInt(clean.slice(0, 2), 16), parseInt(clean.slice(2, 4), 16), parseInt(clean.slice(4, 6), 16)];
  }

  function resetComet(c, w, h, speed) {
    c.vx = (Math.random() - 0.5) * 200;
    c.vy = (Math.random() - 0.5) * 200;
    c.speed = (Math.random() * 0.5 + 0.5) * speed;
    c.trail = [];
    c.maxTrail = Math.floor(Math.random() * 20 + 15);
    c.alpha = Math.random() * 0.4 + 0.3;
  }

  let activeId = null;
  let rafId = null;
  let canvasEl = null;
  let state = {};
  let lastTime = 0;
  let currentOptions = {};
  let resizeHandler = null;

  function _syncCanvasSize(canvas) {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.floor(rect.width));
    const h = Math.max(1, Math.floor(rect.height));
    const pw = Math.floor(w * dpr), ph = Math.floor(h * dpr);
    const resized = canvas.width !== pw || canvas.height !== ph;
    if (resized) {
      canvas.width = pw; canvas.height = ph;
      const ctx = canvas.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    return { w, h, ctx: canvas.getContext("2d"), resized };
  }

  function stop() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (resizeHandler) { window.removeEventListener("resize", resizeHandler); resizeHandler = null; }
    activeId = null; state = {}; lastTime = 0; currentOptions = {};
    if (canvasEl) {
      canvasEl.style.display = "none";
      canvasEl.style.zIndex = "1";
      canvasEl.style.backgroundColor = "";
      const ctx = canvasEl.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
    }
    canvasEl = null;
  }

  function start(sceneId, options, canvas) {
    stop();
    const scene = SCENES[sceneId];
    if (!scene || !canvas) return false;
    const opts = { ...scene.defaults, ...options };
    activeId = sceneId; currentOptions = opts; canvasEl = canvas;
    canvas.style.display = "block"; state = {};
    let dims = _syncCanvasSize(canvas);
    scene.init(state, dims.w, dims.h, opts);
    resizeHandler = () => { dims = _syncCanvasSize(canvas); scene.init(state, dims.w, dims.h, currentOptions); };
    window.addEventListener("resize", resizeHandler);
    lastTime = performance.now();
    function frame(now) {
      if (!activeId || canvasEl !== canvas) return;
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now; dims = _syncCanvasSize(canvas);
      if (dims.resized) scene.init(state, dims.w, dims.h, currentOptions);
      scene.draw(dims.ctx, dims.w, dims.h, state, currentOptions, dt);
      rafId = requestAnimationFrame(frame);
    }
    rafId = requestAnimationFrame(frame);
    return true;
  }

  function updateOptions(options) {
    if (!activeId || !canvasEl) return;
    const scene = SCENES[activeId];
    currentOptions = { ...scene.defaults, ...options };
    const dims = _syncCanvasSize(canvasEl);
    scene.init(state, dims.w, dims.h, currentOptions);
  }

  function list() {
    return Object.entries(SCENES).map(([id, s]) => ({ id, label: s.label, defaults: s.defaults, options: s.options }));
  }

  function get(id) { return SCENES[id] || null; }
  function isActiveCanvas(canvas) { return canvasEl === canvas; }


  const __helpers = { _hexToRgb, _mixHex, _makeSnowSprites, resetComet };

  return { start, stop, updateOptions, setOptions: updateOptions, list, get, isActiveCanvas, register, SCENES, __helpers };
})();

// blackhole/scene.js — black hole scene module.
// REDONE (2026-09-09): full cinematic rewrite approved in plan ("Lensing").
// The scene contract — id "blackhole", label, option keys, defaults, and
// preset bg colors — stays stable so saved themes keep resolving (the default
// disk color moves from violet to gold; the keys themselves are unchanged).
// The module is fully self-contained: the only external touches are
// ThemeScenes.register and ThemeScenes.__helpers._hexToRgb; everything else
// (blending, lens math, LUTs, sprites) is defined locally.
//
// Look: a tilted accretion disk seen from a quiet deep-space vantage. The
// disk is a particle system on Keplerian shear — a white-hot inner edge
// cooling outward, relativistic beaming (the approaching limb blazes
// white-blue, the receding limb dims amber), multi-octave turbulence, and a
// bright ISCO hot spot. Gravitational lensing is real screen-space geometry:
// the far layer (stars, nebula, far half of the disk, plunging material) is
// re-sampled every frame through a precomputed radial magnification field, so
// background stars bend into Einstein arcs and the far side of the disk wraps
// up and over the shadow, feeding the photon ring at the shadow edge. Inside
// the ISCO, plunging particles spiral in, stretch, blue-flash, and vanish
// with a horizon flare; photon-orbit glints loop the ring. A downsampled
// additive bloom, a chromatic fringe on the ring, slow camera drift, film
// grain, and a vignette bind the frame.
//
// `speed` paces every clock; `color` tints the disk (the hot core and the
// photon ring stay warm-white).

(() => {
  const { _hexToRgb } = ThemeScenes.__helpers;

  function _rgba(c, a) {
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  }
  function _mix(t, a, b) {
    return [
      Math.round(a[0] + (b[0] - a[0]) * t),
      Math.round(a[1] + (b[1] - a[1]) * t),
      Math.round(a[2] + (b[2] - a[2]) * t),
    ];
  }
  function _clamp(v, lo, hi) {
    return v < lo ? lo : v > hi ? hi : v;
  }
  // Apparent image radius for a ray with impact parameter rho past a lens of
  // photon-ring radius b: the Schwarzschild lens equation beta = theta - b^2/theta,
  // solved for the image. Always >= b, so nothing appears inside the shadow.
  function _lens(rho, b) {
    return (rho + Math.sqrt(rho * rho + 4 * b * b)) / 2;
  }
  // Doppler-beamed color/brightness for an orbiter at flattened angle a
  // (rotation is clockwise in the flattened plane, so the LEFT limb — cos a < 0 —
  // approaches the camera and blazes; the right limb recedes and dims).
  function _beamedColor(base, cosA, f, rgbOut) {
    const D = 1 - f * cosA;
    const bm = D * D * D;
    let c;
    if (D > 1) c = _mix(Math.min(1, (D - 1) * 1.4), base, [215, 235, 255]);
    else c = _mix(Math.min(1, (1 - D) * 1.6), base, [255, 110, 50]);
    rgbOut[0] = Math.min(255, Math.round(c[0] * Math.min(2.6, bm)));
    rgbOut[1] = Math.min(255, Math.round(c[1] * Math.min(2.6, bm)));
    rgbOut[2] = Math.min(255, Math.round(c[2] * Math.min(2.6, bm)));
    return Math.min(1, bm);
  }

  // Apparent screen position (post-lensing) of disk material at flattened
  // polar (r, a) around the hole at (dcx, dcy); null if degenerate.
  function _apparentPos(state, r, a, dcx, dcy) {
    const { sy, bph } = state;
    const x = r * Math.cos(a);
    const y = r * Math.sin(a) * sy;
    const rho = Math.hypot(x, y);
    if (rho < 0.75) return null;
    const th = _lens(rho, bph);
    const m = th / rho;
    return { x: dcx + x * m, y: dcy + y * m, rho: th, as: Math.atan2(y, x) };
  }

  function _makeGlowSprite(rgb, core) {
    const c = document.createElement("canvas");
    c.width = c.height = 64;
    const x = c.getContext("2d");
    const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    if (core) {
      g.addColorStop(0, "rgba(255,252,244,1)");
      g.addColorStop(0.25, _rgba(rgb, 0.65));
      g.addColorStop(1, "rgba(0,0,0,0)");
    } else {
      g.addColorStop(0, _rgba(rgb, 0.5));
      g.addColorStop(0.4, _rgba(rgb, 0.16));
      g.addColorStop(1, "rgba(0,0,0,0)");
    }
    x.fillStyle = g;
    x.fillRect(0, 0, 64, 64);
    return c;
  }

  // One disk orbiter drawn as a short sheared arc.
  // farHalf=true draws into the flattened far layer (lensed by the resample);
  // farHalf=false draws on the main canvas at the individually-lensed position.
  function _drawOrbiter(dc, state, p, t, base, farHalf) {
    const S = state.S;
    const { sy, bph, dIn, dOut, dcx, dcy } = state;
    const temp = p.temp; // 0 = inner (hot), 1 = outer (cool)
    const a = p.a +
      (0.014 + 0.02 * temp) * Math.sin(t * 0.9 + p.ph1) +
      (0.008 + 0.012 * temp) * Math.sin(t * 1.7 + p.ph2);
    const r = p.r * (1 + 0.025 * Math.sin(t * 0.6 + p.ph3));
    const cosA = Math.cos(a);
    const sinA = Math.sin(a);
    // temperature: inner edge white-hot, cooling outward
    const c0 = _mix((1 - temp) * 0.55, base, [255, 246, 230]);
    const f = 0.34 * Math.pow(dIn / r, 0.5);
    const col = [0, 0, 0];
    const bm = _beamedColor(c0, cosA, f, col);
    const alpha = Math.min(1, (0.28 + 0.5 * (1 - temp)) * (0.75 + 0.25 * Math.sin(t * 0.8 + p.ph1)) * bm);
    if (alpha <= 0.02) return;
    const len = (2 + 6 * temp) * S;
    const wdt = Math.max(1, (1.3 + 1.3 * temp) * S);
    if (farHalf) {
      // true flattened position; the lens resample wraps it over the shadow
      const dAng = len / r;
      dc.strokeStyle = _rgba(col, alpha);
      dc.lineWidth = wdt;
      dc.lineCap = "round";
      dc.beginPath();
      dc.arc(0, 0, r, a - dAng / 2, a + dAng / 2);
      dc.stroke();
    } else {
      const pos = _apparentPos(state, r, a, dcx, dcy);
      if (!pos) return;
      const dAng = len / pos.rho;
      dc.strokeStyle = _rgba(col, alpha);
      dc.lineWidth = wdt;
      dc.lineCap = "round";
      dc.beginPath();
      dc.arc(dcx, dcy, pos.rho, pos.as - dAng / 2, pos.as + dAng / 2);
      dc.stroke();
    }
  }

  // A plunging particle: spirals in from the ISCO, stretches and blue-flashes.
  function _drawPlunger(dc, state, pl, t, base, farHalf) {
    const S = state.S;
    const { sy, bph, dIn, horR, dcx, dcy } = state;
    const q = Math.min(1, (dIn - pl.r) / (dIn - horR * 1.06)); // 0 spawn → 1 horizon
    const col = _mix(q * 0.85, base, [205, 232, 255]);
    const alpha = (0.3 + 0.65 * q) * (0.8 + 0.2 * Math.sin(t * 2 + pl.ph));
    const len = (3 + 15 * q) * S;
    const wdt = Math.max(1, (1.1 + 1.4 * q) * S);
    const a = pl.a;
    if (farHalf) {
      const dAng = len / pl.r;
      dc.strokeStyle = _rgba(col, alpha);
      dc.lineWidth = wdt;
      dc.lineCap = "round";
      dc.beginPath();
      dc.arc(0, 0, pl.r, a - dAng / 2, a + dAng / 2);
      dc.stroke();
    } else {
      const pos = _apparentPos(state, pl.r, a, dcx, dcy);
      if (!pos) return;
      const dAng = len / pos.rho;
      dc.strokeStyle = _rgba(col, alpha);
      dc.lineWidth = wdt;
      dc.lineCap = "round";
      dc.beginPath();
      dc.arc(dcx, dcy, pos.rho, pos.as - dAng / 2, pos.as + dAng / 2);
      dc.stroke();
    }
  }

  // The ISCO hot spot: a bright, white-hot, beamed blob.
  function _drawHot(dc, state, t, base, farHalf) {
    const S = state.S;
    const { dIn, dcx, dcy } = state;
    const hot = state.hot;
    const a = hot.a + 0.02 * Math.sin(t * 1.1 + hot.ph);
    const r = hot.r;
    const cosA = Math.cos(a);
    const sinA = Math.sin(a);
    const c0 = _mix(0.7, base, [255, 250, 240]);
    const col = [0, 0, 0];
    const bm = _beamedColor(c0, cosA, 0.38, col);
    const flick = 0.75 + 0.25 * Math.sin(t * 1.3 + hot.ph);
    const alpha = Math.min(1, 0.85 * bm * flick);
    if (alpha <= 0.03) return;
    const len = 8 * S;
    const wdt = Math.max(1.6, 3 * S);
    if (farHalf) {
      const dAng = len / r;
      dc.strokeStyle = _rgba(col, alpha);
      dc.lineWidth = wdt;
      dc.lineCap = "round";
      dc.beginPath();
      dc.arc(0, 0, r, a - dAng / 2, a + dAng / 2);
      dc.stroke();
    } else {
      const pos = _apparentPos(state, r, a, dcx, dcy);
      if (!pos) return;
      const dAng = len / pos.rho;
      dc.strokeStyle = _rgba(col, alpha);
      dc.lineWidth = wdt;
      dc.lineCap = "round";
      dc.beginPath();
      dc.arc(dcx, dcy, pos.rho, pos.as - dAng / 2, pos.as + dAng / 2);
      dc.stroke();
    }
  }

  // Re-sample the far layer through the precomputed magnification field.
  function _lensPass(state, ci, cj) {
    const { bw, bh, lutW, lutM, lutU, lutV, lutR, bpb, lensSrcImg, lensOutImg } = state;
    const src = lensSrcImg.data;
    const out = lensOutImg.data;
    for (let j = 0; j < bh; j++) {
      const dj = j - cj;
      const lutRow = (dj + lutM) * lutW;
      const outRow = j * bw;
      for (let i = 0; i < bw; i++) {
        const li = lutRow + (i - ci) + lutM;
        const oi = (outRow + i) * 4;
        if (lutR[li] <= bpb) {
          out[oi] = 0; out[oi + 1] = 0; out[oi + 2] = 0; out[oi + 3] = 255;
          continue;
        }
        const sx = ci + lutU[li];
        const syv = cj + lutV[li];
        let x0 = sx | 0;
        if (x0 < 0) x0 = 0; else if (x0 >= bw) x0 = bw - 1;
        let y0 = syv | 0;
        if (y0 < 0) y0 = 0; else if (y0 >= bh) y0 = bh - 1;
        const x1 = x0 + 1 < bw ? x0 + 1 : x0;
        const y1 = y0 + 1 < bh ? y0 + 1 : y0;
        const fx = sx - x0, fy = syv - y0;
        const w00 = (1 - fx) * (1 - fy), w10 = fx * (1 - fy);
        const w01 = (1 - fx) * fy, w11 = fx * fy;
        const i00 = (y0 * bw + x0) * 4, i10 = (y0 * bw + x1) * 4;
        const i01 = (y1 * bw + x0) * 4, i11 = (y1 * bw + x1) * 4;
        out[oi] = src[i00] * w00 + src[i10] * w10 + src[i01] * w01 + src[i11] * w11;
        out[oi + 1] = src[i00 + 1] * w00 + src[i10 + 1] * w10 + src[i01 + 1] * w01 + src[i11 + 1] * w11;
        out[oi + 2] = src[i00 + 2] * w00 + src[i10 + 2] * w10 + src[i01 + 2] * w01 + src[i11 + 2] * w11;
        out[oi + 3] = 255;
      }
    }
  }

  ThemeScenes.register("blackhole", {
    label: "Black Hole",
    defaults: { speed: 0.5, color: "#fbbf24" },
    presetBgColors: ["#020617", "#000000", "#0a0015", "#0f172a", "#1a0a2e", "#0d1117"],
    // Suggested disk color + background pairings, shown in the theme editor
    // as ONE split-swatch row under Background Color (each tile: color half
    // on the left, background half on the right). Halves click independently
    // so a background from one pair can mix with a color from another. The
    // first pair mirrors the scene defaults. Keys map to scene options; "bg"
    // is the background color (not a scene option).
    presetCombos: [
      { color: "#fbbf24", bg: "#020617" }, // gold disk on deep space (defaults)
      { color: "#5eead4", bg: "#050d1a" }, // teal disk on space navy
      { color: "#22d3ee", bg: "#0a0015" }, // cyan disk on dark violet
      { color: "#f87171", bg: "#1c0c10" }, // red disk on black-crimson
      { color: "#4ade80", bg: "#07120a" }, // green disk on black-green
      { color: "#93c5fd", bg: "#0a0e27" }, // ice blue on indigo void
    ],
    options: [
      { key: "speed", label: "Rotation", type: "range", min: 0.1, max: 2, step: 0.1 },
      { key: "color", label: "Disk Color", type: "color" },
    ],

    init(state, w, h, opts) {
      state.t = 0;
      state.S = h / 1080;
      state.w = w;
      state.h = h;
      const S = state.S;
      const base = _hexToRgb(opts.color || "#fbbf24");
      state.base = base;

      // ── Metrics: horizon disc, photon ring, ISCO, disk outer edge ────
      const horR = Math.min(w, h) * 0.085;
      const bph = horR * 1.35; // shadow edge / photon ring
      const dIn = bph * 2;     // ISCO (2x photon radius, Schwarzschild)
      const dOut = Math.min(w, h) * 0.42;
      state.horR = horR; state.bph = bph; state.dIn = dIn; state.dOut = dOut;
      state.sy = 0.36;         // disk inclination projection

      // ── Lens pipeline buffers (sub-sampled) ──────────────────────────
      const k = w * h > 3e6 ? 6 : w * h > 1.4e6 ? 5 : 4;
      state.k = k;
      const bw = Math.ceil(w / k), bh = Math.ceil(h / k);
      const fc = document.createElement("canvas");
      fc.width = bw; fc.height = bh;
      state.lensSrc = fc;
      state.lensSrcCtx = fc.getContext("2d");
      state.lensSrcImg = state.lensSrcCtx.createImageData(bw, bh);
      const oc = document.createElement("canvas");
      oc.width = bw; oc.height = bh;
      state.lensOut = oc;
      state.lensOutCtx = oc.getContext("2d");
      state.lensOutImg = state.lensOutCtx.createImageData(bw, bh);
      state.bw = bw; state.bh = bh;

      // precomputed magnification field over the pixel grid (+drift margin)
      const LM = 6;
      const lutW = bw + LM * 2, lutH = bh + LM * 2;
      state.lutW = lutW; state.lutM = LM;
      state.lutU = new Float32Array(lutW * lutH);
      state.lutV = new Float32Array(lutW * lutH);
      state.lutR = new Float32Array(lutW * lutH);
      const bpb = bph / k;
      state.bpb = bpb;
      for (let dj = -LM; dj < bh + LM; dj++) {
        for (let di = -LM; di < bw + LM; di++) {
          const li = (dj + LM) * lutW + (di + LM);
          const r = Math.hypot(di, dj);
          state.lutR[li] = r;
          if (r <= bpb) { state.lutU[li] = 0; state.lutV[li] = 0; }
          else {
            const s = (r - (bpb * bpb) / r) / r;
            state.lutU[li] = di * s;
            state.lutV[li] = dj * s;
          }
        }
      }

      // bloom buffer (1/8 res)
      const k2 = 8;
      const bc = document.createElement("canvas");
      bc.width = Math.ceil(w / k2); bc.height = Math.ceil(h / k2);
      state.bloom = bc;
      state.bloomCtx = bc.getContext("2d");
      state.k2 = k2;

      // ── Starfield + nebula (drawn into the far layer, lensed) ───────
      const nStars = _clamp(Math.round((w * h) / 7000), 110, 280);
      state.stars = [];
      for (let i = 0; i < nStars; i++) {
        const warm = Math.random();
        state.stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          s: (0.5 + Math.random() * 1.2) * S,
          a: 0.3 + Math.random() * 0.5,
          tw: 0.4 + Math.random() * 1.2,
          ph: Math.random() * Math.PI * 2,
          c: warm < 0.6 ? [205, 218, 244] : warm < 0.85 ? [255, 233, 196] : [172, 202, 255],
        });
      }
      state.nebula = [];
      for (let i = 0; i < 2; i++) {
        state.nebula.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: (0.22 + Math.random() * 0.25) * Math.max(w, h),
          a: 0.03 + Math.random() * 0.025,
          c: Math.random() < 0.5 ? [110, 140, 210] : [200, 150, 90],
        });
      }

      // ── Accretion disk: Keplerian particle system ────────────────────
      const count = _clamp(Math.round((w * h) / 1600), 480, 1100);
      state.orbiters = [];
      const wIn = 0.9; // rad/s at the ISCO (speed 1)
      for (let i = 0; i < count; i++) {
        const r = dIn + (dOut - dIn) * Math.pow(Math.random(), 1.8);
        state.orbiters.push({
          r,
          temp: (r - dIn) / (dOut - dIn),
          a: Math.random() * Math.PI * 2,
          w: wIn * Math.pow(dIn / r, 1.5),
          ph1: Math.random() * Math.PI * 2,
          ph2: Math.random() * Math.PI * 2,
          ph3: Math.random() * Math.PI * 2,
        });
      }

      // ── ISCO hot spot ────────────────────────────────────────────────
      state.hot = { r: dIn * 1.04, a: Math.random() * Math.PI * 2, w: wIn * 1.25, ph: Math.random() * Math.PI * 2 };

      // ── Plunging particles (between the ISCO and the horizon) ────────
      state.plungers = [];
      for (let i = 0; i < 40; i++) {
        state.plungers.push({ on: false, delay: Math.random() * 2.5, r0: 0, r: 0, a: 0, w0: 0, tau: 0, ph: 0 });
      }
      state.flares = [];

      // ── Photon-orbit glints ──────────────────────────────────────────
      state.glints = [];
      for (let i = 0; i < 3; i++) {
        state.glints.push({ a: Math.random() * Math.PI * 2, w: 1.1 + i * 0.4, ph: Math.random() * Math.PI * 2 });
      }

      // ── Sprites ──────────────────────────────────────────────────────
      state.glow = _makeGlowSprite([255, 246, 228], true);
      state.flareSprite = _makeGlowSprite([255, 220, 170], false);

      // very slow Lissajous camera drift
      const dA = Math.min(w, h) * 0.012;
      state.drift = {
        ax: dA, ay: dA * 0.8,
        fx: (Math.PI * 2) / 1500,
        fy: (Math.PI * 2) / 1900,
      };
    },

    draw(ctx, w, h, state, opts, dt) {
      const speed = opts.speed ?? 0.5;
      const color = opts.color || "#fbbf24";
      const bgColor = opts.bgColor || null;
      state.t += dt;
      const t = state.t * speed;
      const dtm = dt * speed;
      const S = state.S;
      const { horR, bph, dIn, dOut, sy, k, k2 } = state;
      const base = _hexToRgb(color);
      const d = state.drift;
      const dcx = w / 2 + d.ax * Math.cos(t * d.fx);
      const dcy = h / 2 + d.ay * Math.sin(t * d.fy);
      state.dcx = dcx; state.dcy = dcy;

      ctx.clearRect(0, 0, w, h);

      // ── Update: orbits, hot spot, plungers ───────────────────────────
      for (const p of state.orbiters) p.a -= p.w * dtm;
      state.hot.a -= state.hot.w * dtm;
      for (const pl of state.plungers) {
        if (!pl.on) {
          pl.delay -= dtm;
          if (pl.delay <= 0) {
            pl.on = true;
            pl.r0 = dIn * (0.96 + Math.random() * 0.06);
            pl.r = pl.r0;
            pl.a = Math.random() * Math.PI * 2;
            pl.w0 = 0.55 * 0.9 * Math.pow(dIn / pl.r0, 1.5);
            pl.tau = 0;
            pl.ph = Math.random() * Math.PI * 2;
          }
          continue;
        }
        pl.tau += dtm;
        const q = 1 - Math.exp(-1.15 * pl.tau);
        pl.r = pl.r0 + (horR * 1.06 - pl.r0) * q;
        pl.a -= pl.w0 * Math.pow(pl.r0 / pl.r, 1.5) * dtm;
        if (pl.r <= horR * 1.12) {
          // absorbed: horizon flare at the apparent (lensed) position
          const pos = _apparentPos(state, pl.r, pl.a, dcx, dcy);
          if (pos) state.flares.push({ x: pos.x, y: pos.y, age: 0, life: 0.5 });
          pl.on = false;
          pl.delay = 0.8 + Math.random() * 1.8;
        }
      }
      if (state.flares.length > 8) state.flares.splice(0, state.flares.length - 8);

      // ── 1) FAR LAYER: bg, stars, far half of disk + plungers ────────
      const fs = state.lensSrcCtx;
      fs.setTransform(1 / k, 0, 0, 1 / k, 0, 0);
      fs.clearRect(0, 0, w, h);
      if (bgColor) {
        fs.fillStyle = bgColor;
        fs.fillRect(0, 0, w, h);
      } else {
        const sky = fs.createRadialGradient(dcx, dcy, 0, dcx, dcy, Math.max(w, h) * 0.75);
        sky.addColorStop(0, "#0b1022");
        sky.addColorStop(0.55, "#05070f");
        sky.addColorStop(1, "#010103");
        fs.fillStyle = sky;
        fs.fillRect(0, 0, w, h);
      }
      for (const nb of state.nebula) {
        const g = fs.createRadialGradient(nb.x, nb.y, 0, nb.x, nb.y, nb.r);
        g.addColorStop(0, _rgba(nb.c, nb.a));
        g.addColorStop(1, "rgba(0,0,0,0)");
        fs.fillStyle = g;
        fs.fillRect(nb.x - nb.r, nb.y - nb.r, nb.r * 2, nb.r * 2);
      }
      for (const st of state.stars) {
        const tw = 0.6 + 0.4 * Math.sin(t * st.tw + st.ph);
        fs.fillStyle = _rgba(st.c, st.a * tw);
        fs.fillRect(st.x, st.y, st.s, st.s);
      }

      // disk-plane haze + far half (flattened; the resample wraps them)
      fs.save();
      fs.translate(dcx, dcy);
      fs.scale(1, sy);
      const haze = fs.createRadialGradient(0, 0, dIn * 0.4, 0, 0, dOut * 1.12);
      haze.addColorStop(0, _rgba(base, 0.1));
      haze.addColorStop(0.55, _rgba(base, 0.05));
      haze.addColorStop(1, "rgba(0,0,0,0)");
      fs.fillStyle = haze;
      fs.beginPath();
      fs.arc(0, 0, dOut * 1.12, 0, Math.PI * 2);
      fs.fill();
      for (const p of state.orbiters) {
        if (Math.sin(p.a) >= 0) continue; // near half drawn later
        _drawOrbiter(fs, state, p, t, base, true);
      }
      for (const pl of state.plungers) {
        if (!pl.on || Math.sin(pl.a) >= 0) continue;
        _drawPlunger(fs, state, pl, t, base, true);
      }
      if (Math.sin(state.hot.a) < 0) _drawHot(fs, state, t, base, true);
      fs.restore();

      // ── 2) LENS RESAMPLE: far layer through the magnification field ─
      const ci = Math.round(dcx / k);
      const cj = Math.round(dcy / k);
      _lensPass(state, ci, cj);
      state.lensOutCtx.putImageData(state.lensOutImg, 0, 0);
      ctx.drawImage(state.lensOut, 0, 0, w, h);

      // ── 3) SHADOW + PHOTON RING ─────────────────────────────────────
      ctx.fillStyle = "#000000";
      ctx.beginPath();
      ctx.arc(dcx, dcy, horR, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = _rgba(base, 0.14);
      ctx.lineWidth = Math.max(1, S);
      ctx.beginPath();
      ctx.arc(dcx, dcy, horR * 1.02, 0, Math.PI * 2);
      ctx.stroke();
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      ctx.strokeStyle = _rgba([255, 240, 214], 0.4);
      ctx.lineWidth = Math.max(1.2, 1.7 * S);
      ctx.beginPath();
      ctx.arc(dcx, dcy, bph, 0, Math.PI * 2);
      ctx.stroke();
      // beamed bright arc on the approaching (left) limb
      ctx.strokeStyle = _rgba([255, 250, 235], 0.4);
      ctx.lineWidth = Math.max(2, 2.6 * S);
      ctx.beginPath();
      ctx.arc(dcx, dcy, bph, 2.2, 4.1);
      ctx.stroke();
      // chromatic fringe
      ctx.strokeStyle = "rgba(255,92,80,0.07)";
      ctx.lineWidth = Math.max(1, 2 * S);
      ctx.beginPath();
      ctx.arc(dcx, dcy, bph * 1.006, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = "rgba(90,140,255,0.07)";
      ctx.beginPath();
      ctx.arc(dcx, dcy, bph * 0.994, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // ── 4) NEAR HALF: in front of the shadow, individually lensed ───
      for (const p of state.orbiters) {
        if (Math.sin(p.a) < 0) continue;
        _drawOrbiter(ctx, state, p, t, base, false);
      }
      for (const pl of state.plungers) {
        if (!pl.on || Math.sin(pl.a) < 0) continue;
        _drawPlunger(ctx, state, pl, t, base, false);
      }
      if (Math.sin(state.hot.a) >= 0) _drawHot(ctx, state, t, base, false);

      // ── 5) PHOTON-ORBIT GLINTS ──────────────────────────────────────
      for (const g of state.glints) {
        g.a -= g.w * dtm;
        const gx = dcx + bph * Math.cos(g.a);
        const gy = dcy + bph * Math.sin(g.a);
        const fl = 0.7 + 0.3 * Math.sin(t * 3.1 + g.ph);
        ctx.strokeStyle = _rgba([255, 250, 235], 0.4 * fl);
        ctx.lineWidth = Math.max(1, 1.4 * S);
        ctx.beginPath();
        ctx.arc(dcx, dcy, bph * 0.998, g.a, g.a + 0.5);
        ctx.stroke();
        ctx.strokeStyle = _rgba([255, 250, 235], 0.12 * fl);
        ctx.beginPath();
        ctx.arc(dcx, dcy, bph * 0.998, g.a + 0.5, g.a + 0.95);
        ctx.stroke();
        ctx.fillStyle = _rgba([255, 252, 244], 0.95 * fl);
        ctx.beginPath();
        ctx.arc(gx, gy, Math.max(1, 1.5 * S), 0, Math.PI * 2);
        ctx.fill();
      }

      // ── 6) HORIZON FLARES ───────────────────────────────────────────
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (let i = state.flares.length - 1; i >= 0; i--) {
        const fl = state.flares[i];
        fl.age += dtm;
        if (fl.age >= fl.life) { state.flares.splice(i, 1); continue; }
        const kk = 1 - fl.age / fl.life;
        const fr = (6 + 26 * kk) * S;
        ctx.globalAlpha = 0.8 * kk;
        ctx.drawImage(state.flareSprite, fl.x - fr, fl.y - fr, fr * 2, fr * 2);
      }
      ctx.restore();

      // ── 7) BLOOM (downsampled additive) ─────────────────────────────
      const bc = state.bloomCtx;
      bc.setTransform(1 / k2, 0, 0, 1 / k2, 0, 0);
      bc.clearRect(0, 0, w, h);
      bc.globalCompositeOperation = "lighter";
      bc.strokeStyle = _rgba([255, 242, 220], 0.5);
      bc.lineWidth = 4;
      bc.beginPath();
      bc.arc(dcx, dcy, bph, 0, Math.PI * 2);
      bc.stroke();
      bc.strokeStyle = _rgba([255, 246, 228], 0.7);
      bc.lineWidth = 7;
      bc.beginPath();
      bc.arc(dcx, dcy, bph, 2.2, 4.1);
      bc.stroke();
      const hpos = _apparentPos(state, state.hot.r, state.hot.a, dcx, dcy);
      if (hpos) {
        const hr = (22 + 10 * Math.sin(t * 1.4 + state.hot.ph)) * S;
        bc.globalAlpha = 0.4;
        bc.drawImage(state.glow, hpos.x - hr, hpos.y - hr, hr * 2, hr * 2);
      }
      for (const g of state.glints) {
        bc.globalAlpha = 0.5;
        bc.drawImage(state.glow, dcx + bph * Math.cos(g.a) - 8 * S, dcy + bph * Math.sin(g.a) - 8 * S, 16 * S, 16 * S);
      }
      for (const fl of state.flares) {
        const kk = 1 - fl.age / fl.life;
        const fr = 14 * kk * S;
        bc.globalAlpha = 0.5 * kk;
        bc.drawImage(state.flareSprite, fl.x - fr, fl.y - fr, fr * 2, fr * 2);
      }
      ctx.save();
      ctx.filter = "blur(7px)";
      ctx.globalCompositeOperation = "lighter";
      ctx.drawImage(state.bloom, 0, 0, w, h);
      ctx.restore();

      // ── 8) GRAIN + VIGNETTE ─────────────────────────────────────────
      ctx.fillStyle = "rgba(255,255,255,0.02)";
      for (let i = 0; i < 46; i++) {
        ctx.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 1.2, 1 + Math.random() * 1.2);
      }
      const vig = ctx.createRadialGradient(dcx, dcy, Math.min(w, h) * 0.28, dcx, dcy, Math.max(w, h) * 0.74);
      vig.addColorStop(0, "rgba(0,0,0,0)");
      vig.addColorStop(1, "rgba(0,0,0,0.55)");
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, w, h);
    },
  });
})();

const canvas = document.getElementById('c');
const scene = ThemeScenes.get('blackhole');
const optsRow = document.getElementById('opts');
const info = document.getElementById('info');
const opts = { ...scene.defaults };
const labels = {};
optsRow.innerHTML = '';
scene.options.forEach(opt => {
  const lab = document.createElement('label');
  lab.textContent = opt.label + ': ';
  if (opt.type === 'range') {
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = opt.min; inp.max = opt.max; inp.step = opt.step;
    inp.value = opts[opt.key];
    inp.oninput = () => {
      opts[opt.key] = parseFloat(inp.value);
      lab.textContent = opt.label + ': ' + inp.value + ' ';
      lab.appendChild(inp); // textContent above cleared it — put it back
      ThemeScenes.updateOptions(opts);
    };
    lab.appendChild(inp);
  } else if (opt.type === 'color') {
    const inp = document.createElement('input');
    inp.type = 'color'; inp.value = opts[opt.key];
    inp.oninput = () => { opts[opt.key] = inp.value; ThemeScenes.updateOptions(opts); };
    lab.appendChild(inp);
  } else if (opt.type === 'select') {
    const sel = document.createElement('select');
    opt.choices.forEach(([v, l]) => {
      const o = document.createElement('option'); o.value = v; o.textContent = l;
      if (String(opts[opt.key]) === String(v)) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = () => { opts[opt.key] = sel.value; ThemeScenes.updateOptions(opts); };
    lab.appendChild(sel);
  }
  labels[opt.key] = lab;
  optsRow.appendChild(lab);
});
ThemeScenes.start('blackhole', opts, canvas);
document.getElementById('reroll').onclick = () => ThemeScenes.updateOptions(opts);
info.textContent = 'blackhole — ' + scene.label + ' (1280x800)';
</script>
</body>
