<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Preview — eclipse</title>
<style>
  body { background:#101018; color:#e8e8ee; font-family:system-ui; margin:0; padding:16px; display:flex; flex-direction:column; gap:10px; align-items:center; }
  canvas { width:min(960px, 94vw); aspect-ratio:16/10; background:#000; border-radius:10px; }
  #opts { display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:center; font-size:13px; color:#bbb; }
  input[type=range], input[type=color] { vertical-align:middle; }
  button { background:#2a2a35; color:#e8e8ee; border:1px solid #4a4a5a; border-radius:6px; padding:4px 12px; font-size:13px; cursor:pointer; }
  button:hover { background:#3a3a48; }
  #info { font-size:12px; color:#888; }
</style>
</head>
<body>
<div id="opts"></div>
<button id="reroll" type="button">↻ Re-roll layout</button>
<canvas id="c" width="1280" height="800"></canvas>
<div id="info"></div>
<script>
// core.js — ThemeScenes core (registry + shared helpers + runtime).
// Generated by scripts/split-scenes.js from the pre-split assets/js/theme-scenes.js
// (2026-09-04). Helpers/runtime bodies are verbatim; additions: register(),
// __helpers export, empty SCENES registry (populated by per-scene modules).
// NOTE: named core.js, not _core.js — Jekyll drops underscore-prefixed files
// from static dirs, so the underscore prefix would 404 on the live site.
const ThemeScenes = (() => {
  const SCENES = {};

  function register(id, def) { SCENES[id] = def; }

  let _snowSpriteCache = null;
  function _makeSnowSprites() {
    const levels = [];
    for (let lv = 0; lv < 4; lv++) {
      const frames = [];
      const sz = 32;
      for (let fi = 0; fi < 16; fi++) {
        const c = document.createElement('canvas');
        c.width = c.height = sz;
        const x = c.getContext('2d');
        const cx = sz / 2, cy = sz / 2;
        const rot = (fi / 16) * Math.PI * 2;
        const arms = lv + 3;
        const armLen = sz * 0.35;
        const coreR = sz * (0.06 + lv * 0.02);
        x.save();
        x.translate(cx, cy);
        x.rotate(rot);
        // core glow
        const glow = x.createRadialGradient(0, 0, 0, 0, 0, coreR * 3);
        glow.addColorStop(0, 'rgba(232,237,245,0.5)');
        glow.addColorStop(1, 'rgba(232,237,245,0)');
        x.fillStyle = glow;
        x.beginPath(); x.arc(0, 0, coreR * 3, 0, Math.PI * 2); x.fill();
        // crystal arms
        x.strokeStyle = 'rgba(232,237,245,0.9)';
        x.lineWidth = 1 + lv * 0.3;
        x.lineCap = 'round';
        for (let a = 0; a < arms; a++) {
          const angle = (a / arms) * Math.PI * 2;
          x.beginPath();
          x.moveTo(0, 0);
          x.lineTo(Math.cos(angle) * armLen, Math.sin(angle) * armLen);
          x.stroke();
          // side branches on larger flakes
          if (lv >= 1) {
            const bLen = armLen * 0.4;
            const bDist = armLen * 0.6;
            const bx = Math.cos(angle) * bDist;
            const by = Math.sin(angle) * bDist;
            for (let s = -1; s <= 1; s += 2) {
              const ba = angle + s * Math.PI / 4;
              x.beginPath();
              x.moveTo(bx, by);
              x.lineTo(bx + Math.cos(ba) * bLen, by + Math.sin(ba) * bLen);
              x.stroke();
            }
          }
        }
        // center dot
        x.fillStyle = 'rgba(255,255,255,0.9)';
        x.beginPath(); x.arc(0, 0, coreR, 0, Math.PI * 2); x.fill();
        x.restore();
        frames.push(c);
      }
      levels.push(frames);
    }
    return levels;
  }

  function _mixHex(hex1, hex2, t) {
    const [r1, g1, b1] = _hexToRgb(hex1);
    const [r2, g2, b2] = _hexToRgb(hex2);
    return `rgb(${Math.round(r1 + (r2 - r1) * t)},${Math.round(g1 + (g2 - g1) * t)},${Math.round(b1 + (b2 - b1) * t)})`;
  }

  function _hexToRgb(hex) {
    if (!hex || typeof hex !== "string") return [167, 139, 250];
    const clean = hex.replace("#", "");
    if (clean.length < 6) return [167, 139, 250];
    return [parseInt(clean.slice(0, 2), 16), parseInt(clean.slice(2, 4), 16), parseInt(clean.slice(4, 6), 16)];
  }

  function resetComet(c, w, h, speed) {
    c.vx = (Math.random() - 0.5) * 200;
    c.vy = (Math.random() - 0.5) * 200;
    c.speed = (Math.random() * 0.5 + 0.5) * speed;
    c.trail = [];
    c.maxTrail = Math.floor(Math.random() * 20 + 15);
    c.alpha = Math.random() * 0.4 + 0.3;
  }

  let activeId = null;
  let rafId = null;
  let canvasEl = null;
  let state = {};
  let lastTime = 0;
  let currentOptions = {};
  let resizeHandler = null;

  function _syncCanvasSize(canvas) {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.floor(rect.width));
    const h = Math.max(1, Math.floor(rect.height));
    const pw = Math.floor(w * dpr), ph = Math.floor(h * dpr);
    const resized = canvas.width !== pw || canvas.height !== ph;
    if (resized) {
      canvas.width = pw; canvas.height = ph;
      const ctx = canvas.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    return { w, h, ctx: canvas.getContext("2d"), resized };
  }

  function stop() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (resizeHandler) { window.removeEventListener("resize", resizeHandler); resizeHandler = null; }
    activeId = null; state = {}; lastTime = 0; currentOptions = {};
    if (canvasEl) {
      canvasEl.style.display = "none";
      canvasEl.style.zIndex = "1";
      canvasEl.style.backgroundColor = "";
      const ctx = canvasEl.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
    }
    canvasEl = null;
  }

  function start(sceneId, options, canvas) {
    stop();
    const scene = SCENES[sceneId];
    if (!scene || !canvas) return false;
    const opts = { ...scene.defaults, ...options };
    activeId = sceneId; currentOptions = opts; canvasEl = canvas;
    canvas.style.display = "block"; state = {};
    let dims = _syncCanvasSize(canvas);
    scene.init(state, dims.w, dims.h, opts);
    resizeHandler = () => { dims = _syncCanvasSize(canvas); scene.init(state, dims.w, dims.h, currentOptions); };
    window.addEventListener("resize", resizeHandler);
    lastTime = performance.now();
    function frame(now) {
      if (!activeId || canvasEl !== canvas) return;
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now; dims = _syncCanvasSize(canvas);
      if (dims.resized) scene.init(state, dims.w, dims.h, currentOptions);
      scene.draw(dims.ctx, dims.w, dims.h, state, currentOptions, dt);
      rafId = requestAnimationFrame(frame);
    }
    rafId = requestAnimationFrame(frame);
    return true;
  }

  function updateOptions(options) {
    if (!activeId || !canvasEl) return;
    const scene = SCENES[activeId];
    currentOptions = { ...scene.defaults, ...options };
    const dims = _syncCanvasSize(canvasEl);
    scene.init(state, dims.w, dims.h, currentOptions);
  }

  function list() {
    return Object.entries(SCENES).map(([id, s]) => ({ id, label: s.label, defaults: s.defaults, options: s.options }));
  }

  function get(id) { return SCENES[id] || null; }
  function isActiveCanvas(canvas) { return canvasEl === canvas; }


  const __helpers = { _hexToRgb, _mixHex, _makeSnowSprites, resetComet };

  return { start, stop, updateOptions, setOptions: updateOptions, list, get, isActiveCanvas, register, SCENES, __helpers };
})();

// eclipse/scene.js — eclipse scene module.
// REDONE (2026-09-07): complete rewrite — "Transit": a true-to-life total
// solar eclipse observed from a deep-space vantage. The scene contract — id
// "eclipse", label, option keys, defaults, and preset bg colors — is unchanged
// since the pre-split purge (scene-lab/prior-art/purged-scenes-2026-09-04/
// eclipse.js) so saved themes keep resolving.
//
// Look: the Moon occults the Sun from outside Earth's atmosphere. The
// photosphere is a limb-darkened disc; the Moon follows a slow Lissajous
// transit so its jagged, procedurally-terrained limb perpetually just covers
// the Sun — and where the photosphere peeks past lunar valleys, Baily's beads
// sparkle, collapsing into a diamond ring at the moments of alignment. The
// corona is real plasma structure: a white-hot inner K-corona, an equatorial
// streamer belt, polar plumes, coronal loops over active regions, and a warm
// dust-scattered F-corona far out — all flickering with multi-octave
// turbulence and rotating differentially. Light refracts around the Moon's
// limb with a chromatic fringe; a faint starfield drifts with slow parallax;
// a defocused spacecraft structure intrudes from the bottom corner with soft
// bokeh discs; film grain and a vignette bind the frame. `speed` paces the
// transit, plasma flicker and rotation; `color` tints the corona hue (the
// core stays white-hot for realism) and the bokeh.
//
// Implementation notes: everything is precomputed in init() through a seeded
// RNG (re-init reshuffles the composition — the lab's "Re-roll layout"
// button); the crescent/beads/diamond-ring state derives from the live
// instantaneous Moon–Sun geometry each frame — no scripted timing. Glows
// render additively; the Moon is painted opaque on top so it cleanly occludes
// the photosphere and inner corona. A barely perceptible camera drift — a
// very slow Lissajous walk with minute-long periods — drifts the whole
// transit across the frame, so the Moon's chord slowly shifts over minutes,
// echoing real orbital motion.

(() => {
  const { _hexToRgb } = ThemeScenes.__helpers;

  function _rgba(c, a) {
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  }
  function _mix(t, a, b) {
    return [
      Math.round(a[0] + (b[0] - a[0]) * t),
      Math.round(a[1] + (b[1] - a[1]) * t),
      Math.round(a[2] + (b[2] - a[2]) * t),
    ];
  }

  // Deterministic layout RNG.
  function _makeRng() {
    let seed = Math.random() * 1e9;
    return () => {
      seed = (seed * 1664525 + 1013904223) % 4294967296;
      return seed / 4294967296;
    };
  }

  // Multi-octave limb terrain in [-1, 1]: the Moon's edge is never a circle,
  // and the same function drives both the silhouette and the beads.
  function _limbTerrain(phi, s) {
    return (
      Math.sin(phi * 5 + s) * 0.42 +
      Math.sin(phi * 13 + s * 2.7) * 0.33 +
      Math.sin(phi * 31 + s * 5.3) * 0.25
    );
  }

  // One corona streamer: a tapered stroke, hot near the limb, fading out.
  function _drawStreamer(ctx, cx, cy, s, a, rgb) {
    const x1 = cx + Math.cos(a) * s.len;
    const y1 = cy + Math.sin(a) * s.len;
    const g = ctx.createLinearGradient(cx, cy, x1, y1);
    g.addColorStop(0, _rgba(s.hot, s.alpha));
    g.addColorStop(0.45, _rgba(rgb, s.alpha * 0.65));
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.strokeStyle = g;
    ctx.lineWidth = s.w;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx + Math.cos(a) * s.start, cy + Math.sin(a) * s.start);
    ctx.lineTo(x1, y1);
    ctx.stroke();
  }

  // A soft glow sprite (cached per tint) for bokeh and bead sparkle.
  const _spriteCache = {};
  function _glowSprite(rgb, core) {
    const key = `${rgb[0]},${rgb[1]},${rgb[2]},${core ? "c" : "g"}`;
    if (_spriteCache[key]) return _spriteCache[key];
    const c = document.createElement("canvas");
    c.width = c.height = 64;
    const x = c.getContext("2d");
    const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    if (core) {
      g.addColorStop(0, "rgba(255,252,240,1)");
      g.addColorStop(0.25, _rgba(rgb, 0.65));
      g.addColorStop(1, "rgba(0,0,0,0)");
    } else {
      g.addColorStop(0, _rgba(rgb, 0.5));
      g.addColorStop(0.4, _rgba(rgb, 0.16));
      g.addColorStop(1, "rgba(0,0,0,0)");
    }
    x.fillStyle = g;
    x.fillRect(0, 0, 64, 64);
    _spriteCache[key] = c;
    return c;
  }

  ThemeScenes.register("eclipse", {
    label: "Eclipse",
    defaults: { speed: 1, color: "#fbbf24" },
    presetBgColors: ["#020617", "#000000", "#0a0a1a", "#0f172a", "#1a0a2e", "#0d1117"],
    // Suggested corona color + background pairings, shown in the theme editor
    // as ONE split-swatch row under Background Color (each tile: color half
    // on the left, background half on the right). Halves click independently
    // so a background from one pair can mix with a color from another. The
    // first pair mirrors the scene defaults. Keys map to scene options; "bg"
    // is the background color (not a scene option).
    presetCombos: [
      { color: "#fbbf24", bg: "#020617" }, // gold corona on deep night (defaults)
      { color: "#f472b6", bg: "#1a0a2e" }, // pink corona on dark plum
      { color: "#5eead4", bg: "#06201c" }, // teal corona on abyss green
      { color: "#7dd3fc", bg: "#0a1628" }, // ice blue on deep navy
      { color: "#f87171", bg: "#1c0f0c" }, // ember red on near-black
      { color: "#e2e8f0", bg: "#050510" }, // white corona on void
    ],
    options: [
      { key: "speed", label: "Speed", type: "range", min: 0.2, max: 2, step: 0.1 },
      { key: "color", label: "Corona Color", type: "color" },
    ],
    init(state, w, h, opts) {
      state.t = 0;
      state.S = h / 1080;
      const S = state.S;
      const R = _makeRng();

      // ── Geometry: the Sun and the transiting Moon ────────────────────
      state.cx = w * 0.5;
      state.cy = h * 0.48;
      state.sunR = Math.min(w, h) * 0.20;
      // Moon only ~4.5% larger than the Sun: close enough that the limb
      // contact geometry can expose slivers of photosphere (beads), far
      // enough that totality holds throughout the transit wobble.
      state.moonR = state.sunR * 1.045;
      state.gap = state.moonR - state.sunR;
      // Lissajous transit: peaks slightly exceed the gap, so the photosphere
      // peeks out on one side at the extremes of the wobble.
      state.tx = { ax: state.sunR * 0.058, ay: state.sunR * 0.05, fx: 0.16, fy: 0.26 };
      // Camera drift: the vantage point itself drifts, walking the transit
      // chord across the frame. Periods are minutes-long, so the motion is
      // barely perceptible frame-to-frame but unmistakable over time — real
      // orbital motion, not camera shake.
      state.drift = {
        ax: Math.min(w, h) * 0.022,
        ay: Math.min(w, h) * 0.014,
        fx: (Math.PI * 2) / 320, // ~5.3 min per horizontal cycle at speed 1
        fy: (Math.PI * 2) / 250, // ~4.2 min per vertical cycle
      };
      state.terrainSeed = R() * 100;
      state.jag = 2.2 * S; // lunar limb roughness (px)

      // ── Starfield with slow parallax drift + a faint nebula patch ────
      state.stars = [];
      for (let i = 0; i < 160; i++) {
        state.stars.push({
          x: R() * w,
          y: R() * h,
          s: (0.3 + R() * 0.9) * S,
          a: 0.05 + R() * 0.18,
          tw: 0.3 + R() * 1.1,
          ph: R() * Math.PI * 2,
          par: (0.5 + R() * 0.8) * S, // parallax speed, px/s per unit speed
        });
      }
      state.nebula = [];
      for (let i = 0; i < 2; i++) {
        state.nebula.push({
          x: R() * w,
          y: R() * h,
          r: (0.25 + R() * 0.3) * Math.max(w, h),
          a: 0.02 + R() * 0.025,
          tint: R() < 0.5 ? 0 : 1, // cool or warm patch
        });
      }

      // ── Corona: solar axis + equatorial streamer belt + polar plumes ──
      // Axis tilted ~12° from vertical; streamers bunch on the equator,
      // plumes at the poles — real coronal structure, not uniform rays.
      state.axis = 0.2;
      const equator = state.axis + Math.PI / 2;
      const base = _hexToRgb(opts.color || "#fbbf24");
      state.coronaRGB = base;
      state.hotCore = [255, 252, 244];
      // F-corona: warm dust-scattered light far out
      state.fCorona = _mix(0.55, base, [255, 216, 168]);

      state.streamers = [];
      // equatorial belt
      for (let i = 0; i < 30; i++) {
        const a = equator + (R() - 0.5) * 0.9;
        const bright = 30 + R() * 45;
        state.streamers.push({
          a,
          start: state.sunR * 1.12,
          len: state.sunR * (2.2 + R() * 2.6),
          w: (2.2 + R() * 2.6) * S,
          alpha: 0.16 + R() * 0.14,
          hot: [Math.min(255, 255 - 10 + bright * 0.2), Math.min(255, 250), Math.min(255, 242)],
          rot: (R() - 0.5) * 0.02,
          f1: 0.6 + R() * 0.9,
          f2: 1.7 + R() * 1.9,
          ph: R() * Math.PI * 2,
          ph2: R() * Math.PI * 2,
          amp: 0.10 + R() * 0.12,
        });
      }
      // polar plumes: short, thin, faint
      for (let i = 0; i < 16; i++) {
        const pole = i < 8 ? state.axis : state.axis + Math.PI;
        state.streamers.push({
          a: pole + (R() - 0.5) * 0.5,
          start: state.sunR * 1.1,
          len: state.sunR * (1.15 + R() * 0.55),
          w: (1 + R() * 1.1) * S,
          alpha: 0.07 + R() * 0.06,
          hot: [255, 252, 245],
          rot: (R() - 0.5) * 0.015,
          f1: 0.7 + R() * 1.1,
          f2: 2 + R() * 2.2,
          ph: R() * Math.PI * 2,
          ph2: R() * Math.PI * 2,
          amp: 0.12 + R() * 0.14,
        });
      }

      // ── Coronal loops over two active regions on the equator ─────────
      state.regions = [];
      for (let r = 0; r < 2; r++) {
        const ra = equator + (R() - 0.5) * 1.1;
        state.regions.push({
          a: ra,
          loops: [],
        });
        const nLoops = 3 + Math.floor(R() * 3);
        for (let l = 0; l < nLoops; l++) {
          state.regions[r].loops.push({
            off: (R() - 0.5) * 0.5, // angular spread around the region
            apex: state.sunR * (1.35 + R() * 0.75),
            w: (1 + R() * 1.2) * S,
            alpha: 0.08 + R() * 0.1,
            f1: 0.9 + R() * 1.3,
            ph: R() * Math.PI * 2,
          });
        }
      }

      // ── Moon surface: a few ultra-faint crater patches ───────────────
      state.craters = [];
      for (let i = 0; i < 7; i++) {
        const rr = R() * Math.PI * 2;
        const rd = Math.sqrt(R()) * 0.72; // bias toward center
        state.craters.push({
          dx: Math.cos(rr) * rd * state.moonR,
          dy: Math.sin(rr) * rd * state.moonR,
          r: (0.06 + R() * 0.1) * state.moonR,
          a: 0.04 + R() * 0.04,
        });
      }

      // ── Foreground spacecraft structure (defocused) + bokeh ──────────
      state.truss = {
        x0: -30,
        y0: h - 6,
        x1: w * 0.42,
        y1: h * 0.78,
        w: Math.max(14, w * 0.045), // beam thickness
        panel: { x: w * 0.015, y: h * 0.8, w: w * 0.3, h: h * 0.075, rot: -0.22 },
        struts: [
          { x: w * 0.09, y: h * 0.8, len: h * 0.14, rot: 0.5 },
          { x: w * 0.2, y: h * 0.8, len: h * 0.1, rot: -0.35 },
        ],
      };
      state.bokeh = [];
      for (let i = 0; i < 6; i++) {
        state.bokeh.push({
          x: w * (0.02 + R() * 0.34),
          y: h * (0.6 + R() * 0.34),
          r: (10 + R() * 22) * S,
          a: 0.1 + R() * 0.16,
          sprite: _glowSprite(base, false),
          ph: R() * Math.PI * 2,
          tw: 0.5 + R() * 0.8,
        });
      }
      state.hotSprite = _glowSprite([255, 250, 235], true);
    },

    draw(ctx, w, h, state, opts, dt) {
      const speed = opts.speed ?? 1;
      const color = opts.color || "#fbbf24";
      const bgColor = opts.bgColor || null;
      state.t += dt;
      const t = state.t * speed; // phase clock (flicker, rotation)
      const dtm = dt * speed; // motion clock (transit, parallax)
      const S = state.S;
      const { cx, cy, sunR, moonR, gap, jag, terrainSeed } = state;
      const rgb = _hexToRgb(color);
      // Camera drift applied to the whole celestial scene (the spacecraft
      // frame, bokeh and vignette stay put — the camera is on the craft).
      const d = state.drift;
      const dcx = cx + d.ax * Math.cos(t * d.fx);
      const dcy = cy + d.ay * Math.sin(t * d.fy);

      ctx.clearRect(0, 0, w, h);
      // ── Deep space base ───────────────────────────────────────────────
      if (bgColor) {
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, w, h);
      } else {
        const space = ctx.createLinearGradient(0, 0, 0, h);
        space.addColorStop(0, "#010104");
        space.addColorStop(0.5, "#03040a");
        space.addColorStop(1, "#05060e");
        ctx.fillStyle = space;
        ctx.fillRect(0, 0, w, h);
      }

      // ── Starfield: twinkle + very slow parallax drift ────────────────
      for (const st of state.stars) {
        st.x += st.par * dtm * 0.06;
        st.y += st.par * dtm * 0.028;
        if (st.x > w + 2) st.x = -2;
        if (st.y > h + 2) st.y = -2;
        const tw = 0.65 + 0.35 * Math.sin(t * st.tw + st.ph);
        ctx.globalAlpha = st.a * tw;
        ctx.fillStyle = "#d6ddf2";
        ctx.fillRect(st.x, st.y, st.s, st.s);
      }
      ctx.globalAlpha = 1;
      // faint nebula patches for galactic depth
      for (const nb of state.nebula) {
        const tint = nb.tint ? [212, 182, 128] : [96, 140, 222];
        const g = ctx.createRadialGradient(nb.x, nb.y, 0, nb.x, nb.y, nb.r);
        g.addColorStop(0, _rgba(tint, nb.a));
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.fillRect(nb.x - nb.r, nb.y - nb.r, nb.r * 2, nb.r * 2);
      }

      // ── Transit geometry: the Moon's wobbling contact offset ─────────
      const offX = state.tx.ax * Math.cos(t * state.tx.fx);
      const offY = state.tx.ay * Math.sin(t * state.tx.fy);
      const mcx = dcx + offX;
      const mcy = dcy + offY;
      const dist = Math.hypot(offX, offY);
      const toMoon = dist > 0.0001 ? Math.atan2(offY, offX) : 0;

      // ── Photosphere: limb-darkened disc, always drawn underneath ─────
      const sun = ctx.createRadialGradient(dcx, dcy, 0, dcx, dcy, sunR);
      sun.addColorStop(0, "rgb(255,248,234)");
      sun.addColorStop(0.55, "rgb(255,240,214)");
      sun.addColorStop(0.85, "rgb(252,224,180)");
      sun.addColorStop(0.97, "rgb(246,202,152)");
      sun.addColorStop(1, "rgb(238,188,140)");
      ctx.fillStyle = sun;
      ctx.beginPath();
      ctx.arc(dcx, dcy, sunR, 0, Math.PI * 2);
      ctx.fill();

      // ── Corona: additive, real plasma structure ──────────────────────
      ctx.save();
      ctx.globalCompositeOperation = "lighter";

      // white-hot inner K-corona hugging the limb
      // white-hot inner corona breathes with slow multi-octave flicker
      const kFlick = 0.86 + 0.14 * Math.sin(t * 0.9) * Math.sin(t * 2.3);
      const kInner = ctx.createRadialGradient(dcx, dcy, sunR * 0.98, dcx, dcy, sunR * 4.2);
      kInner.addColorStop(0, _rgba(state.hotCore, 0.5 * kFlick));
      kInner.addColorStop(0.12, _rgba(state.hotCore, 0.26 * kFlick));
      kInner.addColorStop(0.35, _rgba(rgb, 0.1 * kFlick));
      kInner.addColorStop(0.75, _rgba(rgb, 0.03 * kFlick));
      kInner.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = kInner;
      ctx.beginPath();
      ctx.arc(dcx, dcy, sunR * 4.2, 0, Math.PI * 2);
      ctx.fill();

      // F-corona: warm dust-scattered halo far out
      const fCor = ctx.createRadialGradient(dcx, dcy, sunR * 2.2, dcx, dcy, sunR * 7);
      fCor.addColorStop(0, _rgba(state.fCorona, 0.07));
      fCor.addColorStop(0.6, _rgba(state.fCorona, 0.035));
      fCor.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = fCor;
      ctx.beginPath();
      ctx.arc(dcx, dcy, sunR * 7, 0, Math.PI * 2);
      ctx.fill();

      // streamers with multi-octave turbulent flicker + differential rotation
      const rot = t * 0.012; // whole-corona drift
      for (const s of state.streamers) {
        const turb =
          0.75 + 0.25 * Math.sin(t * s.f1 + s.ph) * Math.sin(t * s.f2 + s.ph2);
        const breathe = 0.9 + s.amp * turb;
        const a = s.a + rot + t * s.rot;
        const saved = s.len;
        s.len = saved * breathe;
        const savedA = s.alpha;
        s.alpha = savedA * (0.7 + 0.3 * turb);
        _drawStreamer(ctx, dcx, dcy, s, a, rgb);
        s.len = saved;
        s.alpha = savedA;
      }

      // coronal loops over the active regions
      for (const reg of state.regions) {
        for (const lp of reg.loops) {
          const flick = 0.6 + 0.4 * Math.sin(t * lp.f1 + lp.ph);
          const a1 = reg.a + lp.off - 0.12;
          const a2 = reg.a + lp.off + 0.12;
          const am = reg.a + lp.off;
          const x1 = dcx + Math.cos(a1) * sunR * 1.02;
          const y1 = dcy + Math.sin(a1) * sunR * 1.02;
          const x2 = dcx + Math.cos(a2) * sunR * 1.02;
          const y2 = dcy + Math.sin(a2) * sunR * 1.02;
          const ax2 = dcx + Math.cos(am) * lp.apex;
          const ay2 = dcy + Math.sin(am) * lp.apex;
          ctx.strokeStyle = _rgba(state.hotCore, lp.alpha * flick);
          ctx.lineWidth = lp.w;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.quadraticCurveTo(ax2, ay2, x2, y2);
          ctx.stroke();
          // bright footpoints where the loop meets the limb
          ctx.fillStyle = _rgba(state.hotCore, lp.alpha * flick * 1.6);
          ctx.beginPath();
          ctx.arc(x1, y1, Math.max(1, lp.w * 1.6), 0, Math.PI * 2);
          ctx.arc(x2, y2, Math.max(1, lp.w * 1.6), 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();

      // ── The Moon: jagged-limb opaque disc, occluding photosphere ─────
      // faint earthshine: the night-side limb reads slightly lighter
      const moonShine = ctx.createRadialGradient(mcx, mcy, moonR * 0.55, mcx, mcy, moonR * 1.02);
      moonShine.addColorStop(0, "#04060c");
      moonShine.addColorStop(0.85, "#070b14");
      moonShine.addColorStop(1, "#0b1120");
      ctx.fillStyle = moonShine;
      ctx.beginPath();
      const limbN = 96;
      for (let i = 0; i < limbN; i++) {
        const phi = (i / limbN) * Math.PI * 2;
        const r = moonR + _limbTerrain(phi, terrainSeed) * jag;
        const px = mcx + Math.cos(phi) * r;
        const py = mcy + Math.sin(phi) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      // ultra-faint crater texture on the night side
      for (const cr of state.craters) {
        ctx.fillStyle = `rgba(0,0,0,${cr.a})`;
        ctx.beginPath();
        ctx.arc(mcx + cr.dx, mcy + cr.dy, cr.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // ── Baily's beads: photosphere peeking past lunar valleys ────────
      // The crescent is already visible geometrically; here we sparkle the
      // bright spots where the sun slips through terrain valleys, and raise
      // the diamond ring when the exposure collapses to a single point.
      const expSamples = 64;
      let exposed = 0;
      let brightIdx = -1;
      let brightVal = 0;
      let brightestX = 0, brightestY = 0;
      for (let i = 0; i < expSamples; i++) {
        const phi = (i / expSamples) * Math.PI * 2;
        const px = dcx + Math.cos(phi) * sunR;
        const py = dcy + Math.sin(phi) * sunR;
        const dMoon = Math.hypot(px - mcx, py - mcy);
        const terrain = _limbTerrain(phi, terrainSeed);
        const exposure = dMoon - (moonR + terrain * jag);
        if (exposure > 0) {
          exposed++;
          // brightness: how far out the rim pokes, limb-darkened,
          // amplified in terrain valleys (the classic bead look)
          const b = Math.min(1, exposure / (sunR * 0.02)) * 0.7 * (1 - terrain * 0.5);
          if (b > brightVal) {
            brightVal = b;
            brightIdx = i;
            brightestX = px;
            brightestY = py;
          }
          if (terrain < -0.2 && b > 0.1) {
            const spr = state.hotSprite;
            const sz = (5 + b * 12) * S;
            ctx.save();
            ctx.globalCompositeOperation = "lighter";
            ctx.globalAlpha = Math.min(1, b * 1.6);
            ctx.drawImage(spr, px - sz / 2, py - sz / 2, sz, sz);
            ctx.restore();
          }
        }
      }
      // diamond ring: a single remaining bead gets the diffraction flare
      if (exposed <= 3 && exposed >= 1 && brightVal > 0.35) {
        const sz = (sunR * 0.16) * (0.8 + 0.4 * Math.sin(t * 3.1));
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        const flare = ctx.createRadialGradient(brightestX, brightestY, 0, brightestX, brightestY, sz);
        flare.addColorStop(0, "rgba(255,252,240,0.95)");
        flare.addColorStop(0.3, "rgba(255,244,214,0.4)");
        flare.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = flare;
        ctx.beginPath();
        ctx.arc(brightestX, brightestY, sz, 0, Math.PI * 2);
        ctx.fill();
        // diffraction spikes
        ctx.strokeStyle = "rgba(255,248,230,0.55)";
        ctx.lineWidth = Math.max(0.8, 1.4 * S);
        ctx.lineCap = "round";
        const sp = sz * 1.9;
        for (let k = 0; k < 2; k++) {
          const sa = toMoon + Math.PI / 2 + k * Math.PI / 2;
          ctx.beginPath();
          ctx.moveTo(brightestX - Math.cos(sa) * sp, brightestY - Math.sin(sa) * sp);
          ctx.lineTo(brightestX + Math.cos(sa) * sp, brightestY + Math.sin(sa) * sp);
          ctx.stroke();
        }
        ctx.restore();
      }

      // ── Refraction: light bending around the lunar limb + fringe ─────
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      // main refracted halo hugging the limb
      const refr = ctx.createRadialGradient(mcx, mcy, moonR * 0.995, mcx, mcy, moonR * 1.12);
      refr.addColorStop(0, "rgba(0,0,0,0)");
      refr.addColorStop(0.55, _rgba(state.hotCore, 0.16));
      refr.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = refr;
      ctx.beginPath();
      ctx.arc(mcx, mcy, moonR * 1.12, 0, Math.PI * 2);
      ctx.fill();
      // chromatic fringe: red / blue edges at 1-2px radial offset
      ctx.lineWidth = Math.max(1, 2 * S);
      ctx.beginPath();
      ctx.arc(mcx, mcy, moonR * 1.018, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(255,90,80,0.10)";
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(mcx, mcy, moonR * 1.006, 0, Math.PI * 2);
      ctx.strokeStyle = "rgba(90,140,255,0.10)";
      ctx.stroke();
      ctx.restore();

      // ── Foreground: defocused spacecraft structure + bokeh ───────────
      const tr = state.truss;
      ctx.save();
      ctx.filter = "blur(6px)";
      ctx.fillStyle = "rgba(4,6,12,0.94)";
      // main beam angling in from the bottom-left corner
      ctx.beginPath();
      ctx.moveTo(tr.x0, tr.y0);
      ctx.lineTo(tr.x1, tr.y1);
      ctx.lineTo(tr.x1 + tr.w, tr.y1 - tr.w * 0.7);
      ctx.lineTo(tr.x0 + tr.w * 0.4, tr.y0 - tr.w);
      ctx.closePath();
      ctx.fill();
      // solar panel
      ctx.save();
      ctx.translate(tr.panel.x + tr.panel.w / 2, tr.panel.y + tr.panel.h / 2);
      ctx.rotate(tr.panel.rot);
      ctx.fillRect(-tr.panel.w / 2, -tr.panel.h / 2, tr.panel.w, tr.panel.h);
      // panel cell grid lines
      ctx.strokeStyle = "rgba(20,28,44,0.5)";
      ctx.lineWidth = 1.5;
      for (let gx = -tr.panel.w / 2; gx <= tr.panel.w / 2; gx += tr.panel.w / 5) {
        ctx.beginPath();
        ctx.moveTo(gx, -tr.panel.h / 2);
        ctx.lineTo(gx, tr.panel.h / 2);
        ctx.stroke();
      }
      ctx.restore();
      // struts
      ctx.strokeStyle = "rgba(5,8,15,0.95)";
      ctx.lineWidth = tr.w * 0.3;
      ctx.lineCap = "round";
      for (const st2 of tr.struts) {
        ctx.beginPath();
        ctx.moveTo(st2.x, st2.y);
        ctx.lineTo(st2.x + Math.cos(st2.rot) * st2.len, st2.y + Math.sin(st2.rot) * st2.len);
        ctx.stroke();
      }
      ctx.restore();
      // bokeh discs: out-of-focus corona highlights floating across the
      // structure and the lower frame
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      for (const bk of state.bokeh) {
        const tw = 0.65 + 0.35 * Math.sin(t * bk.tw + bk.ph);
        ctx.globalAlpha = bk.a * tw;
        ctx.drawImage(bk.sprite, bk.x - bk.r, bk.y - bk.r, bk.r * 2, bk.r * 2);
      }
      ctx.restore();

      // ── Film grain + vignette ─────────────────────────────────────────
      ctx.fillStyle = "rgba(255,255,255,0.025)";
      for (let i = 0; i < 60; i++) {
        const gx = Math.random() * w;
        const gy = Math.random() * h;
        const gs = 1 + Math.random() * 1.2;
        ctx.fillRect(gx, gy, gs, gs);
      }
      ctx.fillStyle = "rgba(0,0,0,0.5)";
      const vg = ctx.createRadialGradient(cx, cy, Math.min(w, h) * 0.3, cx, cy, Math.max(w, h) * 0.78);
      vg.addColorStop(0, "rgba(0,0,0,0)");
      vg.addColorStop(1, "rgba(0,0,0,0.5)");
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, w, h);
    },
  });
})();
const canvas = document.getElementById('c');
const scene = ThemeScenes.get('eclipse');
const optsRow = document.getElementById('opts');
const info = document.getElementById('info');
const opts = { ...scene.defaults };
const labels = {};
optsRow.innerHTML = '';
scene.options.forEach(opt => {
  const lab = document.createElement('label');
  lab.textContent = opt.label + ': ';
  if (opt.type === 'range') {
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = opt.min; inp.max = opt.max; inp.step = opt.step;
    inp.value = opts[opt.key];
    inp.oninput = () => {
      opts[opt.key] = parseFloat(inp.value);
      lab.textContent = opt.label + ': ' + inp.value + ' ';
      lab.appendChild(inp); // textContent above cleared it — put it back
      ThemeScenes.updateOptions(opts);
    };
    lab.appendChild(inp);
  } else if (opt.type === 'color') {
    const inp = document.createElement('input');
    inp.type = 'color'; inp.value = opts[opt.key];
    inp.oninput = () => { opts[opt.key] = inp.value; ThemeScenes.updateOptions(opts); };
    lab.appendChild(inp);
  } else if (opt.type === 'select') {
    const sel = document.createElement('select');
    opt.choices.forEach(([v, l]) => {
      const o = document.createElement('option'); o.value = v; o.textContent = l;
      if (String(opts[opt.key]) === String(v)) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = () => { opts[opt.key] = sel.value; ThemeScenes.updateOptions(opts); };
    lab.appendChild(sel);
  }
  labels[opt.key] = lab;
  optsRow.appendChild(lab);
});
ThemeScenes.start('eclipse', opts, canvas);
document.getElementById('reroll').onclick = () => ThemeScenes.updateOptions(opts);
info.textContent = 'eclipse — ' + scene.label + ' (1280x800)';
</script>
</body>
