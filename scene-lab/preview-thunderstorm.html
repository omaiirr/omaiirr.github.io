<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Preview — thunderstorm</title>
<style>
  body { background:#101018; color:#e8e8ee; font-family:system-ui; margin:0; padding:16px; display:flex; flex-direction:column; gap:10px; align-items:center; }
  canvas { width:min(960px, 94vw); aspect-ratio:16/10; background:#000; border-radius:10px; }
  #opts { display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:center; font-size:13px; color:#bbb; }
  input[type=range], input[type=color] { vertical-align:middle; }
  button { background:#2a2a35; color:#e8e8ee; border:1px solid #4a4a5a; border-radius:6px; padding:4px 12px; font-size:13px; cursor:pointer; }
  button:hover { background:#3a3a48; }
  #info { font-size:12px; color:#888; }
</style>
</head>
<body>
<div id="opts"></div>
<button id="reroll" type="button">↻ Re-roll layout</button>
<canvas id="c" width="1280" height="800"></canvas>
<div id="info"></div>
<script>
// core.js — ThemeScenes core (registry + shared helpers + runtime).
// Generated by scripts/split-scenes.js from the pre-split assets/js/theme-scenes.js
// (2026-09-04). Helpers/runtime bodies are verbatim; additions: register(),
// __helpers export, empty SCENES registry (populated by per-scene modules).
// NOTE: named core.js, not _core.js — Jekyll drops underscore-prefixed files
// from static dirs, so the underscore prefix would 404 on the live site.
const ThemeScenes = (() => {
  const SCENES = {};

  function register(id, def) { SCENES[id] = def; }

  let _snowSpriteCache = null;
  function _makeSnowSprites() {
    const levels = [];
    for (let lv = 0; lv < 4; lv++) {
      const frames = [];
      const sz = 32;
      for (let fi = 0; fi < 16; fi++) {
        const c = document.createElement('canvas');
        c.width = c.height = sz;
        const x = c.getContext('2d');
        const cx = sz / 2, cy = sz / 2;
        const rot = (fi / 16) * Math.PI * 2;
        const arms = lv + 3;
        const armLen = sz * 0.35;
        const coreR = sz * (0.06 + lv * 0.02);
        x.save();
        x.translate(cx, cy);
        x.rotate(rot);
        // core glow
        const glow = x.createRadialGradient(0, 0, 0, 0, 0, coreR * 3);
        glow.addColorStop(0, 'rgba(232,237,245,0.5)');
        glow.addColorStop(1, 'rgba(232,237,245,0)');
        x.fillStyle = glow;
        x.beginPath(); x.arc(0, 0, coreR * 3, 0, Math.PI * 2); x.fill();
        // crystal arms
        x.strokeStyle = 'rgba(232,237,245,0.9)';
        x.lineWidth = 1 + lv * 0.3;
        x.lineCap = 'round';
        for (let a = 0; a < arms; a++) {
          const angle = (a / arms) * Math.PI * 2;
          x.beginPath();
          x.moveTo(0, 0);
          x.lineTo(Math.cos(angle) * armLen, Math.sin(angle) * armLen);
          x.stroke();
          // side branches on larger flakes
          if (lv >= 1) {
            const bLen = armLen * 0.4;
            const bDist = armLen * 0.6;
            const bx = Math.cos(angle) * bDist;
            const by = Math.sin(angle) * bDist;
            for (let s = -1; s <= 1; s += 2) {
              const ba = angle + s * Math.PI / 4;
              x.beginPath();
              x.moveTo(bx, by);
              x.lineTo(bx + Math.cos(ba) * bLen, by + Math.sin(ba) * bLen);
              x.stroke();
            }
          }
        }
        // center dot
        x.fillStyle = 'rgba(255,255,255,0.9)';
        x.beginPath(); x.arc(0, 0, coreR, 0, Math.PI * 2); x.fill();
        x.restore();
        frames.push(c);
      }
      levels.push(frames);
    }
    return levels;
  }

  function _mixHex(hex1, hex2, t) {
    const [r1, g1, b1] = _hexToRgb(hex1);
    const [r2, g2, b2] = _hexToRgb(hex2);
    return `rgb(${Math.round(r1 + (r2 - r1) * t)},${Math.round(g1 + (g2 - g1) * t)},${Math.round(b1 + (b2 - b1) * t)})`;
  }

  function _hexToRgb(hex) {
    if (!hex || typeof hex !== "string") return [167, 139, 250];
    const clean = hex.replace("#", "");
    if (clean.length < 6) return [167, 139, 250];
    return [parseInt(clean.slice(0, 2), 16), parseInt(clean.slice(2, 4), 16), parseInt(clean.slice(4, 6), 16)];
  }

  function resetComet(c, w, h, speed) {
    c.vx = (Math.random() - 0.5) * 200;
    c.vy = (Math.random() - 0.5) * 200;
    c.speed = (Math.random() * 0.5 + 0.5) * speed;
    c.trail = [];
    c.maxTrail = Math.floor(Math.random() * 20 + 15);
    c.alpha = Math.random() * 0.4 + 0.3;
  }

  let activeId = null;
  let rafId = null;
  let canvasEl = null;
  let state = {};
  let lastTime = 0;
  let currentOptions = {};
  let resizeHandler = null;

  function _syncCanvasSize(canvas) {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.floor(rect.width));
    const h = Math.max(1, Math.floor(rect.height));
    const pw = Math.floor(w * dpr), ph = Math.floor(h * dpr);
    const resized = canvas.width !== pw || canvas.height !== ph;
    if (resized) {
      canvas.width = pw; canvas.height = ph;
      const ctx = canvas.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    return { w, h, ctx: canvas.getContext("2d"), resized };
  }

  function stop() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (resizeHandler) { window.removeEventListener("resize", resizeHandler); resizeHandler = null; }
    activeId = null; state = {}; lastTime = 0; currentOptions = {};
    if (canvasEl) {
      canvasEl.style.display = "none";
      canvasEl.style.zIndex = "1";
      canvasEl.style.backgroundColor = "";
      const ctx = canvasEl.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
    }
    canvasEl = null;
  }

  function start(sceneId, options, canvas) {
    stop();
    const scene = SCENES[sceneId];
    if (!scene || !canvas) return false;
    const opts = { ...scene.defaults, ...options };
    activeId = sceneId; currentOptions = opts; canvasEl = canvas;
    canvas.style.display = "block"; state = {};
    let dims = _syncCanvasSize(canvas);
    scene.init(state, dims.w, dims.h, opts);
    resizeHandler = () => { dims = _syncCanvasSize(canvas); scene.init(state, dims.w, dims.h, currentOptions); };
    window.addEventListener("resize", resizeHandler);
    lastTime = performance.now();
    function frame(now) {
      if (!activeId || canvasEl !== canvas) return;
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now; dims = _syncCanvasSize(canvas);
      if (dims.resized) scene.init(state, dims.w, dims.h, currentOptions);
      scene.draw(dims.ctx, dims.w, dims.h, state, currentOptions, dt);
      rafId = requestAnimationFrame(frame);
    }
    rafId = requestAnimationFrame(frame);
    return true;
  }

  function updateOptions(options) {
    if (!activeId || !canvasEl) return;
    const scene = SCENES[activeId];
    currentOptions = { ...scene.defaults, ...options };
    const dims = _syncCanvasSize(canvasEl);
    scene.init(state, dims.w, dims.h, currentOptions);
  }

  function list() {
    return Object.entries(SCENES).map(([id, s]) => ({ id, label: s.label, defaults: s.defaults, options: s.options }));
  }

  function get(id) { return SCENES[id] || null; }
  function isActiveCanvas(canvas) { return canvasEl === canvas; }


  const __helpers = { _hexToRgb, _mixHex, _makeSnowSprites, resetComet };

  return { start, stop, updateOptions, setOptions: updateOptions, list, get, isActiveCanvas, register, SCENES, __helpers };
})();

// thunderstorm/scene.js — thunderstorm scene module.
// GROUND-UP REBUILD (2026-09-05): the pre-split thunderstorm code was purged
// as corrupt/broken; this is a fresh implementation written against the
// reference contract (see
// scene-lab/prior-art/purged-scenes-2026-09-04/thunderstorm.js).
// Scene id, label, option keys, defaults, and preset bg colors stay stable so
// saved themes keep resolving.
//
// Look: a heavy storm at night. Rolling cloud bands drift across the top,
// slanted rain streaks gust side to side, rain splashes ripple on the wet
// ground, and lightning strikes on a randomized timer — a jagged bolt plus a
// double flash that lights the whole frame. `density` is rain count, `speed`
// paces everything, `color` tints the rain.

(() => {
  const { _hexToRgb } = ThemeScenes.__helpers;

  function _rgba(c, a) {
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  }
  // rgb [0..255] → [h (0..360), s (0..1), l (0..1)] and back. Used to retint
  // the cloud band, wet ground, and surface glints from the sky color.
  function _rgbToHsl([r0, g0, b0]) {
    const r = r0 / 255,
      g = g0 / 255,
      b = b0 / 255;
    const max = Math.max(r, g, b),
      min = Math.min(r, g, b);
    const l = (max + min) / 2;
    let h = 0,
      s = 0;
    if (max !== min) {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return [h, s, l];
  }
  function _hslToRgb(h, s, l) {
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const hp = ((h % 360) + 360) % 360 / 60;
    const x = c * (1 - Math.abs((hp % 2) - 1));
    let [r, g, b] =
      hp < 1 ? [c, x, 0] : hp < 2 ? [x, c, 0] : hp < 3 ? [0, c, x] : hp < 4 ? [0, x, c] : hp < 5 ? [x, 0, c] : [c, 0, x];
    const m = l - c / 2;
    return [
      Math.round((r + m) * 255),
      Math.round((g + m) * 255),
      Math.round((b + m) * 255),
    ];
  }

  // Fresh jagged bolt path from the top of the sky down to the ground.
  function _makeBolt(state, w, groundY) {
    const pts = [];
    let x = w * (0.25 + Math.random() * 0.5);
    const nSeg = 8;
    for (let i = 0; i <= nSeg; i++) {
      pts.push({ x, y: (groundY / nSeg) * i });
      x += (Math.random() - 0.5) * w * 0.09;
    }
    state.bolt = pts;
    state.boltT = 0;
    state.flash = 0.95;
    state.bump = false;
  }

  ThemeScenes.register("thunderstorm", {
    label: "Thunderstorm",
    defaults: { density: 100, speed: 1, color: "#94a3b8" },
    presetBgColors: ["#020617", "#000000", "#0f172a", "#1a1a2e", "#0a0e1a", "#0d1117"],
    // Suggested rain color + background pairings, shown in the theme editor
    // as ONE split-swatch row under Background Color (each tile: color half
    // on the left, background half on the right). Halves click independently
    // so a background from one pair can mix with a color from another. The
    // first pair mirrors the scene defaults. Keys map to scene options; "bg"
    // is the background color (not a scene option).
    presetCombos: [
      { color: "#94a3b8", bg: "#020617" }, // steel rain on deep night (defaults)
      { color: "#cbd5e1", bg: "#0a0f1e" }, // silver on slate storm
      { color: "#60a5fa", bg: "#0a1226" }, // electric blue on deep storm
      { color: "#93c5fd", bg: "#0f172a" }, // pale ice on slate
      { color: "#fbbf24", bg: "#1a1208" }, // amber haze on warm dark
      { color: "#e2e8f0", bg: "#0d1117" }, // cold white on gunmetal
    ],
    options: [
      { key: "density", label: "Rain", type: "range", min: 30, max: 250, step: 10 },
      { key: "speed", label: "Speed", type: "range", min: 0.3, max: 3, step: 0.1 },
      { key: "color", label: "Rain Color", type: "color" },
    ],
    init(state, w, h, opts) {
      state.t = 0;
      state.S = h / 1080;
      const S = state.S;
      const rgb = _hexToRgb(opts.color || "#94a3b8");
      state.rainRGB = rgb;
      state.groundY = h * 0.9;

      // ── Rain streaks ─────────────────────────────────────────────────
      state.rain = [];
      const nRain = Math.min(180, Math.round(w / 11));
      for (let i = 0; i < nRain; i++) {
        state.rain.push({
          x: Math.random() * w,
          y: Math.random() * h,
          len: (8 + Math.random() * 14) * S,
          sp: (420 + Math.random() * 260) * S,
          ph: Math.random() * Math.PI * 2,
        });
      }
      state.splashes = [];

      // ── Cloud bands along the top ────────────────────────────────────
      state.clouds = [
        { y: -6 * S, r: (26 + Math.random() * 22) * S, a: 0.9, drift: 6 },
        { y: 4 * S, r: (20 + Math.random() * 18) * S, a: 0.75, drift: -4 },
      ];
      for (const band of state.clouds) {
        band.bumps = [];
        const n = Math.max(5, Math.round(w / (band.r * 1.1)));
        for (let i = 0; i < n; i++) {
          band.bumps.push({
            x: (i / n) * w + (Math.random() - 0.5) * w * 0.05,
            r: band.r * (0.6 + Math.random() * 0.7),
          });
        }
      }

      // ── Lightning ────────────────────────────────────────────────────
      state.bolt = null;
      state.boltT = 0;
      state.flash = 0;
      state.flashTimer = 2 + Math.random() * 4;
      state.bump = false;
    },

    draw(ctx, w, h, state, opts, dt) {
      const speed = opts.speed ?? 1;
      const bgColor = opts.bgColor || null;
      state.t += dt;
      const t = state.t * speed;
      const dtm = dt * speed;
      const S = state.S;
      const groundY = state.groundY;

      // ── Storm tones derived from the sky hue ────────────────────────
      // Cloud band, wet ground, and its surface glints follow the background
      // color (darkened + muted) so an off-hue sky never clashes with fixed
      // scenery — same treatment as the butterflies scene. Ground tones are
      // kept light enough that the sky's hue is actually visible on them
      // (butterflies' meadow reads its color; an all-black ground would look
      // hard-coded). Rain keeps its own color and lightning stays white-blue.
      // When no bg is chosen the authored navy constants apply.
      let pal = null;
      if (bgColor) {
        const [h, s] = _rgbToHsl(_hexToRgb(bgColor));
        const sat = (floor, cap) => Math.max(floor, Math.min(s * 100, cap));
        const rgb = (l, satPct) => _hslToRgb(h, satPct / 100, l / 100);
        pal = {
          cloud: rgb(7, sat(12, 30)),
          gTop: rgb(14, sat(16, 38)),
          gDeep: rgb(7, sat(12, 28)),
          edge: rgb(64, sat(34, 72)),
          splash: rgb(80, sat(34, 72)),
        };
      }

      ctx.clearRect(0, 0, w, h);

      // ── Sky: roiling dark gradient ───────────────────────────────────
      if (bgColor) {
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, w, h);
      } else {
        const sky = ctx.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, "#070a16");
        sky.addColorStop(0.55, "#0b101f");
        sky.addColorStop(1, "#121528");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);
      }

      // ── Cloud bands: drifting bumps along the top ────────────────────
      for (const band of state.clouds) {
        ctx.fillStyle = pal
          ? _rgba(pal.cloud, band.a)
          : `rgba(10,13,24,${band.a})`;
        const drift = ((t * band.drift) % w + w) % w;
        for (const b of band.bumps) {
          const bx = ((b.x + drift) % (w + b.r * 2)) - b.r;
          ctx.beginPath();
          ctx.arc(bx, band.y, b.r, Math.PI, 0);
          ctx.fill();
        }
        ctx.fillRect(0, band.y, w, Math.max(1, 3 * S));
      }

      // ── Rain: slanted streaks with gusting sway ──────────────────────
      const gust = Math.sin(t * 0.7) * 14 * S;
      ctx.lineWidth = Math.max(0.8, S);
      for (const d of state.rain) {
        d.y += d.sp * dtm;
        d.x += (d.sp * 0.16 + gust * 0.4) * dtm;
        if (d.y > h + d.len) {
          d.y = -d.len;
          d.x = Math.random() * w;
        }
        // splash ripple where the drop lands on the ground
        if (d.y >= groundY && d.y < groundY + 8 * S && Math.random() < 0.15 && state.splashes.length < 60) {
          state.splashes.push({
            x: d.x,
            y: groundY + 2 * S,
            t: 0,
            max: 0.3 + Math.random() * 0.2,
            r: (2.5 + Math.random() * 3) * S,
          });
        }
        const nearGround = Math.min(1, d.y / (h * 0.8));
        ctx.strokeStyle = _rgba(state.rainRGB, 0.1 + 0.16 * nearGround);
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x + 2.5 * S, d.y + d.len);
        ctx.stroke();
      }

      // ── Wet ground + splash ripples ──────────────────────────────────
      const gnd = ctx.createLinearGradient(0, groundY, 0, h);
      gnd.addColorStop(0, pal ? _rgba(pal.gTop, 0.95) : "rgba(10,12,20,0.95)");
      gnd.addColorStop(1, pal ? _rgba(pal.gDeep, 0.98) : "rgba(3,4,8,0.98)");
      ctx.fillStyle = gnd;
      ctx.fillRect(0, groundY, w, h - groundY);
      ctx.fillStyle = pal ? _rgba(pal.edge, 0.08) : "rgba(150,170,215,0.08)";
      ctx.fillRect(0, groundY, w, Math.max(1, S));
      for (let i = state.splashes.length - 1; i >= 0; i--) {
        const s = state.splashes[i];
        s.t += dt;
        if (s.t >= s.max) {
          state.splashes.splice(i, 1);
          continue;
        }
        const k = s.t / s.max;
        const rx = s.r * (0.5 + k * 2.4);
        ctx.strokeStyle = pal
          ? _rgba(pal.splash, 0.2 * (1 - k))
          : `rgba(160,180,225,${(0.2 * (1 - k)).toFixed(3)})`;
        ctx.lineWidth = Math.max(0.7, 1.1 * S);
        ctx.beginPath();
        ctx.ellipse(s.x, s.y, rx, rx * 0.22, 0, 0, Math.PI * 2);
        ctx.stroke();
      }

      // ── Lightning: bolt + flash on a randomized timer ────────────────
      state.flashTimer -= dtm;
      if (state.flashTimer <= 0) {
        _makeBolt(state, w, groundY);
        state.flashTimer = 3 + Math.random() * 5;
      }
      if (state.flash > 0.01) {
        state.flash -= dtm * 2.1;
        // second pop of the double flash
        if (state.flash < 0.45 && !state.bump) {
          state.bump = true;
          state.flash = Math.max(state.flash, 0.5);
        }
      }
      if (state.bolt) {
        state.boltT += dt;
        if (state.boltT < 0.22) {
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.strokeStyle = "rgba(215,230,255,0.9)";
          ctx.lineWidth = Math.max(1.5, 2.4 * S);
          ctx.shadowColor = "rgba(200,220,255,1)";
          ctx.shadowBlur = 12 * S;
          ctx.beginPath();
          state.bolt.forEach((p, i) => (i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)));
          ctx.stroke();
          ctx.strokeStyle = "rgba(255,255,255,0.95)";
          ctx.lineWidth = Math.max(0.8, 1.1 * S);
          ctx.shadowBlur = 0;
          ctx.stroke();
          ctx.restore();
        } else {
          state.bolt = null;
        }
      }
      if (state.flash > 0.01) {
        ctx.fillStyle = `rgba(185,200,250,${(state.flash * 0.3).toFixed(3)})`;
        ctx.fillRect(0, 0, w, h);
      }

      // ── Vignette ──────────────────────────────────────────────────────
      const vig = ctx.createRadialGradient(w / 2, h * 0.42, Math.min(w, h) * 0.45, w / 2, h * 0.5, Math.max(w, h) * 0.9);
      vig.addColorStop(0, "rgba(0,0,0,0)");
      vig.addColorStop(1, "rgba(0,0,0,0.42)");
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, w, h);
    },
  });
})();
const canvas = document.getElementById('c');
const scene = ThemeScenes.get('thunderstorm');
const optsRow = document.getElementById('opts');
const info = document.getElementById('info');
const opts = { ...scene.defaults };
const labels = {};
optsRow.innerHTML = '';
scene.options.forEach(opt => {
  const lab = document.createElement('label');
  lab.textContent = opt.label + ': ';
  if (opt.type === 'range') {
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = opt.min; inp.max = opt.max; inp.step = opt.step;
    inp.value = opts[opt.key];
    inp.oninput = () => {
      opts[opt.key] = parseFloat(inp.value);
      lab.textContent = opt.label + ': ' + inp.value + ' ';
      lab.appendChild(inp); // textContent above cleared it — put it back
      ThemeScenes.updateOptions(opts);
    };
    lab.appendChild(inp);
  } else if (opt.type === 'color') {
    const inp = document.createElement('input');
    inp.type = 'color'; inp.value = opts[opt.key];
    inp.oninput = () => { opts[opt.key] = inp.value; ThemeScenes.updateOptions(opts); };
    lab.appendChild(inp);
  } else if (opt.type === 'select') {
    const sel = document.createElement('select');
    opt.choices.forEach(([v, l]) => {
      const o = document.createElement('option'); o.value = v; o.textContent = l;
      if (String(opts[opt.key]) === String(v)) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = () => { opts[opt.key] = sel.value; ThemeScenes.updateOptions(opts); };
    lab.appendChild(sel);
  }
  labels[opt.key] = lab;
  optsRow.appendChild(lab);
});
ThemeScenes.start('thunderstorm', opts, canvas);
document.getElementById('reroll').onclick = () => ThemeScenes.updateOptions(opts);
info.textContent = 'thunderstorm — ' + scene.label + ' (1280x800)';
</script>
</body>
</html>
