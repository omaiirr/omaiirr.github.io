<script>
// core.js — ThemeScenes core (registry + shared helpers + runtime).
// Generated by scripts/split-scenes.js from the pre-split assets/js/theme-scenes.js
// (2026-09-04). Helpers/runtime bodies are verbatim; additions: register(),
// __helpers export, empty SCENES registry (populated by per-scene modules).
// NOTE: named core.js, not _core.js — Jekyll drops underscore-prefixed files
// from static dirs, so the underscore prefix would 404 on the live site.
const ThemeScenes = (() => {
  const SCENES = {};

  function register(id, def) { SCENES[id] = def; }

  let _snowSpriteCache = null;
  function _makeSnowSprites() {
    const levels = [];
    for (let lv = 0; lv < 4; lv++) {
      const frames = [];
      const sz = 32;
      for (let fi = 0; fi < 16; fi++) {
        const c = document.createElement('canvas');
        c.width = c.height = sz;
        const x = c.getContext('2d');
        const cx = sz / 2, cy = sz / 2;
        const rot = (fi / 16) * Math.PI * 2;
        const arms = lv + 3;
        const armLen = sz * 0.35;
        const coreR = sz * (0.06 + lv * 0.02);
        x.save();
        x.translate(cx, cy);
        x.rotate(rot);
        // core glow
        const glow = x.createRadialGradient(0, 0, 0, 0, 0, coreR * 3);
        glow.addColorStop(0, 'rgba(232,237,245,0.5)');
        glow.addColorStop(1, 'rgba(232,237,245,0)');
        x.fillStyle = glow;
        x.beginPath(); x.arc(0, 0, coreR * 3, 0, Math.PI * 2); x.fill();
        // crystal arms
        x.strokeStyle = 'rgba(232,237,245,0.9)';
        x.lineWidth = 1 + lv * 0.3;
        x.lineCap = 'round';
        for (let a = 0; a < arms; a++) {
          const angle = (a / arms) * Math.PI * 2;
          x.beginPath();
          x.moveTo(0, 0);
          x.lineTo(Math.cos(angle) * armLen, Math.sin(angle) * armLen);
          x.stroke();
          // side branches on larger flakes
          if (lv >= 1) {
            const bLen = armLen * 0.4;
            const bDist = armLen * 0.6;
            const bx = Math.cos(angle) * bDist;
            const by = Math.sin(angle) * bDist;
            for (let s = -1; s <= 1; s += 2) {
              const ba = angle + s * Math.PI / 4;
              x.beginPath();
              x.moveTo(bx, by);
              x.lineTo(bx + Math.cos(ba) * bLen, by + Math.sin(ba) * bLen);
              x.stroke();
            }
          }
        }
        // center dot
        x.fillStyle = 'rgba(255,255,255,0.9)';
        x.beginPath(); x.arc(0, 0, coreR, 0, Math.PI * 2); x.fill();
        x.restore();
        frames.push(c);
      }
      levels.push(frames);
    }
    return levels;
  }

  function _mixHex(hex1, hex2, t) {
    const [r1, g1, b1] = _hexToRgb(hex1);
    const [r2, g2, b2] = _hexToRgb(hex2);
    return `rgb(${Math.round(r1 + (r2 - r1) * t)},${Math.round(g1 + (g2 - g1) * t)},${Math.round(b1 + (b2 - b1) * t)})`;
  }

  function _hexToRgb(hex) {
    if (!hex || typeof hex !== "string") return [167, 139, 250];
    const clean = hex.replace("#", "");
    if (clean.length < 6) return [167, 139, 250];
    return [parseInt(clean.slice(0, 2), 16), parseInt(clean.slice(2, 4), 16), parseInt(clean.slice(4, 6), 16)];
  }

  function resetComet(c, w, h, speed) {
    c.vx = (Math.random() - 0.5) * 200;
    c.vy = (Math.random() - 0.5) * 200;
    c.speed = (Math.random() * 0.5 + 0.5) * speed;
    c.trail = [];
    c.maxTrail = Math.floor(Math.random() * 20 + 15);
    c.alpha = Math.random() * 0.4 + 0.3;
  }

  let activeId = null;
  let rafId = null;
  let canvasEl = null;
  let state = {};
  let lastTime = 0;
  let currentOptions = {};
  let resizeHandler = null;

  function _syncCanvasSize(canvas) {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.floor(rect.width));
    const h = Math.max(1, Math.floor(rect.height));
    const pw = Math.floor(w * dpr), ph = Math.floor(h * dpr);
    const resized = canvas.width !== pw || canvas.height !== ph;
    if (resized) {
      canvas.width = pw; canvas.height = ph;
      const ctx = canvas.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    return { w, h, ctx: canvas.getContext("2d"), resized };
  }

  function stop() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (resizeHandler) { window.removeEventListener("resize", resizeHandler); resizeHandler = null; }
    activeId = null; state = {}; lastTime = 0; currentOptions = {};
    if (canvasEl) {
      canvasEl.style.display = "none";
      canvasEl.style.zIndex = "1";
      canvasEl.style.backgroundColor = "";
      const ctx = canvasEl.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
    }
    canvasEl = null;
  }

  function start(sceneId, options, canvas) {
    stop();
    const scene = SCENES[sceneId];
    if (!scene || !canvas) return false;
    const opts = { ...scene.defaults, ...options };
    activeId = sceneId; currentOptions = opts; canvasEl = canvas;
    canvas.style.display = "block"; state = {};
    let dims = _syncCanvasSize(canvas);
    scene.init(state, dims.w, dims.h, opts);
    resizeHandler = () => { dims = _syncCanvasSize(canvas); scene.init(state, dims.w, dims.h, currentOptions); };
    window.addEventListener("resize", resizeHandler);
    lastTime = performance.now();
    function frame(now) {
      if (!activeId || canvasEl !== canvas) return;
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now; dims = _syncCanvasSize(canvas);
      if (dims.resized) scene.init(state, dims.w, dims.h, currentOptions);
      scene.draw(dims.ctx, dims.w, dims.h, state, currentOptions, dt);
      rafId = requestAnimationFrame(frame);
    }
    rafId = requestAnimationFrame(frame);
    return true;
  }

  function updateOptions(options) {
    if (!activeId || !canvasEl) return;
    const scene = SCENES[activeId];
    currentOptions = { ...scene.defaults, ...options };
    const dims = _syncCanvasSize(canvasEl);
    scene.init(state, dims.w, dims.h, currentOptions);
  }

  function list() {
    return Object.entries(SCENES).map(([id, s]) => ({ id, label: s.label, defaults: s.defaults, options: s.options }));
  }

  function get(id) { return SCENES[id] || null; }
  function isActiveCanvas(canvas) { return canvasEl === canvas; }


  const __helpers = { _hexToRgb, _mixHex, _makeSnowSprites, resetComet };

  return { start, stop, updateOptions, setOptions: updateOptions, list, get, isActiveCanvas, register, SCENES, __helpers };
})();

// lanterns/scene.js — floating lanterns scene module.
// GROUND-UP REBUILD (2026-09-05): the pre-split lanterns code was purged as
// corrupt/broken; this is a fresh implementation written against the reference
// contract (see scene-lab/prior-art/purged-scenes-2026-09-04/lanterns.js).
// Scene id, label, option keys, defaults, and preset bg colors stay stable so
// saved themes keep resolving.
//
// Look: a warm night sky full of paper sky lanterns. Three depth bands drift
// upward — tiny dim ones high up, big glowing ones near the lens — each with a
// flickering flame core, ribbed paper body, and soft halo, over a dark hill
// line with a warm horizon glow. `density` is lantern count, `speed` paces the
// drift, `color` tints the lantern light.

(() => {
  const { _hexToRgb } = ThemeScenes.__helpers;

  function _rgba(c, a) {
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  }
  // rgb [0..255] → [h (0..360), s (0..1), l (0..1)]. Retints the ridge and
  // ground from the chosen sky color (see draw()).
  function _rgbToHsl([r0, g0, b0]) {
    const r = r0 / 255,
      g = g0 / 255,
      b = b0 / 255;
    const max = Math.max(r, g, b),
      min = Math.min(r, g, b);
    const l = (max + min) / 2;
    let h = 0,
      s = 0;
    if (max !== min) {
      const d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h *= 60;
    }
    return [h, s, l];
  }

  ThemeScenes.register("lanterns", {
    label: "Floating Lanterns",
    defaults: { density: 15, speed: 1, color: "#fbbf24" },
    presetBgColors: ["#020617", "#000000", "#1a0f08", "#0f172a", "#1e1208", "#0d1117"],
    // Suggested lantern color + background pairings, shown in the theme
    // editor as ONE split-swatch row under Background Color (each tile: color
    // half on the left, background half on the right). Halves click
    // independently so a background from one pair can mix with a color from
    // another. The first pair mirrors the scene defaults. Keys map to scene
    // options; "bg" is the background color (not a scene option).
    presetCombos: [
      { color: "#fbbf24", bg: "#020617" }, // golden amber on deep night (defaults)
      { color: "#f59e0b", bg: "#1a1208" }, // honey on warm ink
      { color: "#fde68a", bg: "#1a1508" }, // candlelight on warm dark
      { color: "#f9a8d4", bg: "#1f0a1e" }, // sakura glow on dark plum
      { color: "#7dd3fc", bg: "#0a1628" }, // ice blue on deep navy
      { color: "#fb7185", bg: "#200a14" }, // coral on rosewood dark
    ],
    options: [
      { key: "density", label: "Lanterns", type: "range", min: 5, max: 40, step: 1 },
      { key: "speed", label: "Speed", type: "range", min: 0.3, max: 3, step: 0.1 },
      { key: "color", label: "Lantern Color", type: "color" },
    ],
    init(state, w, h, opts) {
      state.t = 0;
      state.S = h / 1080;
      const S = state.S;
      const rgb = _hexToRgb(opts.color || "#fbbf24");
      const count = opts.density ?? 15;

      // ── Three depth bands: far (tiny, dim) → near (big, bright) ──────
      const bands = [
        { n: 0.4, size: 0.55, spd: 0.7, alpha: 0.45 },
        { n: 0.35, size: 0.85, spd: 0.9, alpha: 0.7 },
        { n: 0.25, size: 1.25, spd: 1.15, alpha: 1 },
      ];
      state.lanterns = [];
      for (const band of bands) {
        const n = Math.max(1, Math.round(count * band.n));
        for (let i = 0; i < n; i++) {
          state.lanterns.push({
            x: Math.random() * w,
            y: Math.random() * h,
            s: (7 + Math.random() * 7) * S * band.size,
            vy: -(7 + Math.random() * 9) * band.spd,
            swaySp: 0.35 + Math.random() * 0.5,
            swayAmp: (7 + Math.random() * 10) * band.spd,
            ph: Math.random() * Math.PI * 2,
            flSp: 2 + Math.random() * 2.5,
            flPh: Math.random() * Math.PI * 2,
            rgb,
            alpha: band.alpha * (0.8 + Math.random() * 0.4),
          });
        }
      }

      // ── Stars across the night sky ──────────────────────────────────
      state.stars = [];
      for (let i = 0; i < 70; i++) {
        state.stars.push({
          x: Math.random(),
          y: Math.pow(Math.random(), 1.4) * 0.6,
          s: 0.4 + Math.random() * 0.9,
          a: 0.06 + Math.random() * 0.2,
          ph: Math.random() * Math.PI * 2,
          big: i % 23 === 0,
        });
      }

      // ── Ground line + silhouettes behind the lantern glow ─────────────
      state.groundY = h * 0.9;
      // distant treeline: a soft scalloped canopy band across the horizon
      state.ridge = [];
      const nRidge = Math.max(14, Math.round(w / 64));
      for (let i = 0; i < nRidge; i++) {
        state.ridge.push({
          x: (i / (nRidge - 1)) + (Math.random() - 0.5) * (0.5 / nRidge),
          w: 0.03 + Math.random() * 0.02, // bump half-width as fraction of w
          h: 0.5 + Math.random() * 0.8,   // bump height multiplier
        });
      }
      // nearer rolling hills, a little darker, in front of the treeline
      state.hills = [];
      for (let i = 0; i < 5; i++) {
        state.hills.push({
          x: (i / 4) * w + (Math.random() - 0.5) * w * 0.1,
          r: h * (0.05 + Math.random() * 0.05),
        });
      }
    },

    draw(ctx, w, h, state, opts, dt) {
      const speed = opts.speed ?? 1;
      const bgColor = opts.bgColor || null;
      state.t += dt;
      const t = state.t * speed;
      const dtm = dt * speed;
      const S = state.S;

      // ── Ground tones derived from the sky hue ───────────────────────
      // Treeline, hills, and the dark ground band follow the background color
      // (darkened + muted) so an off-hue sky never clashes with fixed scenery
      // — same treatment as the butterflies scene. Lantern-lit warmth stays
      // driven by the lantern color. When no bg color is chosen the authored
      // constants apply.
      let pal = null;
      if (bgColor) {
        const [h, s] = _rgbToHsl(_hexToRgb(bgColor));
        const sat = (floor, cap) => Math.max(floor, Math.min(s * 100, cap));
        const hsla = (l, a, satPct) =>
          `hsla(${h.toFixed(1)},${satPct.toFixed(1)}%,${l}%,${a})`;
        const ridgeSat = sat(10, 30);
        const darkSat = sat(8, 22);
        pal = {
          ridge1: hsla(6.5, 0.5, ridgeSat),
          ridge2: hsla(3, 0.92, ridgeSat),
          hills: hsla(2.4, 0.98, darkSat),
          gMid: hsla(4.5, 0.99, ridgeSat),
          gDeep: hsla(1.8, 1, darkSat),
        };
      }

      ctx.clearRect(0, 0, w, h);

      // ── Sky: deep night, faint warm cast toward the horizon ──────────
      if (bgColor) {
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, w, h);
      } else {
        const sky = ctx.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, "#030410");
        sky.addColorStop(0.6, "#070a1c");
        sky.addColorStop(1, "#120c14");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, w, h);
      }

      // ── Stars (precomputed, gentle twinkle; a few brighter ones get a
      // tiny cross glint so the sky has texture instead of flat dots) ────
      for (const st of state.stars) {
        const tw = st.a * (0.7 + 0.3 * Math.sin(st.ph + t * 0.5));
        if (tw < 0.01) continue;
        ctx.globalAlpha = tw;
        ctx.fillStyle = st.big ? "#eaf0ff" : "#d6deff";
        const sx = st.x * w, sy = st.y * h;
        ctx.fillRect(sx, sy, st.s, st.s);
        if (st.big && st.s > 0.8) {
          ctx.fillRect(sx - st.s * 0.7, sy + st.s * 0.2, st.s * 2.4, st.s * 0.35);
          ctx.fillRect(sx + st.s * 0.2, sy - st.s * 0.7, st.s * 0.35, st.s * 2.4);
        }
      }
      ctx.globalAlpha = 1;

      // ── Ground: layered treeline + hills under a warm festival glow ──
      const groundY = state.groundY;
      const warm = _hexToRgb(opts.color || "#fbbf24");

      // wide, soft bloom that pools just above the ridge line (the glow of
      // lanterns near the ground bleeds into the sky)
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const bloom = ctx.createRadialGradient(w * 0.5, groundY, 0, w * 0.5, groundY, w * 0.62);
      bloom.addColorStop(0, _rgba(warm, 0.13));
      bloom.addColorStop(0.5, _rgba(warm, 0.05));
      bloom.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = bloom;
      ctx.fillRect(0, groundY - h * 0.5, w, h * 0.5);
      ctx.restore();

      // distant treeline, two haze depths (light → dark)
      const ridgeRow = (topY, bumpMul, color) => {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(-6, groundY);
        for (const tr of state.ridge) {
          const cx = Math.max(0, Math.min(w, tr.x * w));
          const hw = (tr.w * w) / 2;
          const bh = h * 0.045 * tr.h * bumpMul;
          ctx.lineTo(cx - hw, topY);
          ctx.arc(cx, topY - bh * 0.62, hw, Math.PI, 0, false);
          ctx.lineTo(cx + hw, topY);
        }
        ctx.lineTo(w + 6, groundY);
        ctx.closePath();
        ctx.fill();
      };
      ridgeRow(groundY - h * 0.012, 0.75, pal ? pal.ridge1 : "rgba(16,13,24,0.5)");
      ridgeRow(groundY - h * 0.006, 1, pal ? pal.ridge2 : "rgba(7,6,13,0.92)");

      // nearer rolling hills
      ctx.fillStyle = pal ? pal.hills : "rgba(4,3,8,0.98)";
      for (const hl of state.hills) {
        ctx.beginPath();
        ctx.arc(hl.x, groundY + hl.r * 0.5, hl.r, Math.PI, 0);
        ctx.fill();
      }
      // ground plane: dark earth with a whisper of warm spill at the top
      const gnd = ctx.createLinearGradient(0, groundY, 0, h);
      gnd.addColorStop(0, _rgba(warm, 0.05));
      gnd.addColorStop(0.2, pal ? pal.gMid : "rgba(13,10,16,0.99)");
      gnd.addColorStop(1, pal ? pal.gDeep : "rgba(3,2,5,1)");
      ctx.fillStyle = gnd;
      ctx.fillRect(0, groundY, w, h - groundY);
      // low haze hugging the silhouette line, lit faintly from below
      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const haze = ctx.createLinearGradient(0, groundY - h * 0.02, 0, groundY + h * 0.03);
      haze.addColorStop(0, _rgba(warm, 0.04));
      haze.addColorStop(0.5, _rgba(warm, 0.012));
      haze.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = haze;
      ctx.fillRect(0, groundY - h * 0.02, w, h * 0.05);
      ctx.restore();

      // ── Lanterns, far band → near band ───────────────────────────────
      for (const l of state.lanterns) {
        l.y += l.vy * dtm;
        if (l.y < -l.s * 4) {
          l.y = h + l.s * 3;
          l.x = Math.random() * w;
        }
        const fx = l.x + Math.sin(t * l.swaySp + l.ph) * l.swayAmp;
        const fl = 0.85 + 0.15 * Math.sin(t * l.flSp + l.flPh);
        // halo
        const hr = l.s * 3.8;
        const halo = ctx.createRadialGradient(fx, l.y, 0, fx, l.y, hr);
        halo.addColorStop(0, _rgba(l.rgb, 0.2 * l.alpha * fl));
        halo.addColorStop(0.45, _rgba(l.rgb, 0.07 * l.alpha * fl));
        halo.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = halo;
        ctx.fillRect(fx - hr, l.y - hr, hr * 2, hr * 2);
        // paper body
        ctx.fillStyle = _rgba(l.rgb, 0.4 * l.alpha * fl);
        ctx.beginPath();
        ctx.ellipse(fx, l.y, l.s * 0.62, l.s * 0.88, 0, 0, Math.PI * 2);
        ctx.fill();
        // flame core
        ctx.fillStyle = _rgba([255, 243, 205], 0.55 * l.alpha * fl);
        ctx.beginPath();
        ctx.ellipse(fx, l.y + l.s * 0.12, l.s * 0.3, l.s * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
        // caps
        ctx.fillStyle = "rgba(24,16,6,0.9)";
        ctx.fillRect(fx - l.s * 0.34, l.y - l.s * 0.96, l.s * 0.68, Math.max(1, l.s * 0.14));
        ctx.fillRect(fx - l.s * 0.3, l.y + l.s * 0.84, l.s * 0.6, Math.max(1, l.s * 0.12));
        // ribs
        ctx.strokeStyle = _rgba(l.rgb, 0.3 * l.alpha);
        ctx.lineWidth = Math.max(0.5, l.s * 0.07);
        ctx.beginPath();
        for (const off of [-0.34, 0, 0.34]) {
          ctx.moveTo(fx + off * l.s, l.y - l.s * 0.86);
          ctx.lineTo(fx + off * l.s, l.y + l.s * 0.8);
        }
        ctx.stroke();
      }

      // ── Vignette ──────────────────────────────────────────────────────
      const vig = ctx.createRadialGradient(w / 2, h * 0.42, Math.min(w, h) * 0.45, w / 2, h * 0.5, Math.max(w, h) * 0.9);
      vig.addColorStop(0, "rgba(0,0,0,0)");
      vig.addColorStop(1, "rgba(0,0,0,0.4)");
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, w, h);
    },
  });
})();
const canvas = document.getElementById('c');
const scene = ThemeScenes.get('lanterns');
const optsRow = document.getElementById('opts');
const info = document.getElementById('info');
const opts = { ...scene.defaults };
const labels = {};
optsRow.innerHTML = '';
scene.options.forEach(opt => {
  const lab = document.createElement('label');
  lab.textContent = opt.label + ': ';
  if (opt.type === 'range') {
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = opt.min; inp.max = opt.max; inp.step = opt.step;
    inp.value = opts[opt.key];
    inp.oninput = () => {
      opts[opt.key] = parseFloat(inp.value);
      lab.textContent = opt.label + ': ' + inp.value + ' ';
      lab.appendChild(inp); // textContent above cleared it — put it back
      ThemeScenes.updateOptions(opts);
    };
    lab.appendChild(inp);
  } else if (opt.type === 'color') {
    const inp = document.createElement('input');
    inp.type = 'color'; inp.value = opts[opt.key];
    inp.oninput = () => { opts[opt.key] = inp.value; ThemeScenes.updateOptions(opts); };
    lab.appendChild(inp);
  } else if (opt.type === 'select') {
    const sel = document.createElement('select');
    opt.choices.forEach(([v, l]) => {
      const o = document.createElement('option'); o.value = v; o.textContent = l;
      if (String(opts[opt.key]) === String(v)) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = () => { opts[opt.key] = sel.value; ThemeScenes.updateOptions(opts); };
    lab.appendChild(sel);
  }
  labels[opt.key] = lab;
  optsRow.appendChild(lab);
});
ThemeScenes.start('lanterns', opts, canvas);
document.getElementById('reroll').onclick = () => ThemeScenes.updateOptions(opts);
info.textContent = 'lanterns — ' + scene.label + ' (1280x800)';
</script>
</body>
</html>
