<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Preview — origami</title>
<style>
  body { background:#101018; color:#e8e8ee; font-family:system-ui; margin:0; padding:16px; display:flex; flex-direction:column; gap:10px; align-items:center; }
  canvas { width:min(960px, 94vw); aspect-ratio:16/10; background:#000; border-radius:10px; }
  #opts { display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:center; font-size:13px; color:#bbb; }
  input[type=range], input[type=color] { vertical-align:middle; }
  button { background:#2a2a35; color:#e8e8ee; border:1px solid #4a4a5a; border-radius:6px; padding:4px 12px; font-size:13px; cursor:pointer; }
  button:hover { background:#3a3a48; }
  #info { font-size:12px; color:#888; }
</style>
</head>
<body>
<div id="opts"></div>
<button id="reroll" type="button">↻ Re-roll layout</button>
<canvas id="c" width="1280" height="800"></canvas>
<div id="info"></div>
<script>
// core.js — ThemeScenes core (registry + shared helpers + runtime).
// Generated by scripts/split-scenes.js from the pre-split assets/js/theme-scenes.js
// (2026-09-04). Helpers/runtime bodies are verbatim; additions: register(),
// __helpers export, empty SCENES registry (populated by per-scene modules).
// NOTE: named core.js, not _core.js — Jekyll drops underscore-prefixed files
// from static dirs, so the underscore prefix would 404 on the live site.
const ThemeScenes = (() => {
  const SCENES = {};

  function register(id, def) { SCENES[id] = def; }

  let _snowSpriteCache = null;
  function _makeSnowSprites() {
    const levels = [];
    for (let lv = 0; lv < 4; lv++) {
      const frames = [];
      const sz = 32;
      for (let fi = 0; fi < 16; fi++) {
        const c = document.createElement('canvas');
        c.width = c.height = sz;
        const x = c.getContext('2d');
        const cx = sz / 2, cy = sz / 2;
        const rot = (fi / 16) * Math.PI * 2;
        const arms = lv + 3;
        const armLen = sz * 0.35;
        const coreR = sz * (0.06 + lv * 0.02);
        x.save();
        x.translate(cx, cy);
        x.rotate(rot);
        // core glow
        const glow = x.createRadialGradient(0, 0, 0, 0, 0, coreR * 3);
        glow.addColorStop(0, 'rgba(232,237,245,0.5)');
        glow.addColorStop(1, 'rgba(232,237,245,0)');
        x.fillStyle = glow;
        x.beginPath(); x.arc(0, 0, coreR * 3, 0, Math.PI * 2); x.fill();
        // crystal arms
        x.strokeStyle = 'rgba(232,237,245,0.9)';
        x.lineWidth = 1 + lv * 0.3;
        x.lineCap = 'round';
        for (let a = 0; a < arms; a++) {
          const angle = (a / arms) * Math.PI * 2;
          x.beginPath();
          x.moveTo(0, 0);
          x.lineTo(Math.cos(angle) * armLen, Math.sin(angle) * armLen);
          x.stroke();
          // side branches on larger flakes
          if (lv >= 1) {
            const bLen = armLen * 0.4;
            const bDist = armLen * 0.6;
            const bx = Math.cos(angle) * bDist;
            const by = Math.sin(angle) * bDist;
            for (let s = -1; s <= 1; s += 2) {
              const ba = angle + s * Math.PI / 4;
              x.beginPath();
              x.moveTo(bx, by);
              x.lineTo(bx + Math.cos(ba) * bLen, by + Math.sin(ba) * bLen);
              x.stroke();
            }
          }
        }
        // center dot
        x.fillStyle = 'rgba(255,255,255,0.9)';
        x.beginPath(); x.arc(0, 0, coreR, 0, Math.PI * 2); x.fill();
        x.restore();
        frames.push(c);
      }
      levels.push(frames);
    }
    return levels;
  }

  function _mixHex(hex1, hex2, t) {
    const [r1, g1, b1] = _hexToRgb(hex1);
    const [r2, g2, b2] = _hexToRgb(hex2);
    return `rgb(${Math.round(r1 + (r2 - r1) * t)},${Math.round(g1 + (g2 - g1) * t)},${Math.round(b1 + (b2 - b1) * t)})`;
  }

  function _hexToRgb(hex) {
    if (!hex || typeof hex !== "string") return [167, 139, 250];
    const clean = hex.replace("#", "");
    if (clean.length < 6) return [167, 139, 250];
    return [parseInt(clean.slice(0, 2), 16), parseInt(clean.slice(2, 4), 16), parseInt(clean.slice(4, 6), 16)];
  }

  function resetComet(c, w, h, speed) {
    c.vx = (Math.random() - 0.5) * 200;
    c.vy = (Math.random() - 0.5) * 200;
    c.speed = (Math.random() * 0.5 + 0.5) * speed;
    c.trail = [];
    c.maxTrail = Math.floor(Math.random() * 20 + 15);
    c.alpha = Math.random() * 0.4 + 0.3;
  }

  let activeId = null;
  let rafId = null;
  let canvasEl = null;
  let state = {};
  let lastTime = 0;
  let currentOptions = {};
  let resizeHandler = null;

  function _syncCanvasSize(canvas) {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.floor(rect.width));
    const h = Math.max(1, Math.floor(rect.height));
    const pw = Math.floor(w * dpr), ph = Math.floor(h * dpr);
    const resized = canvas.width !== pw || canvas.height !== ph;
    if (resized) {
      canvas.width = pw; canvas.height = ph;
      const ctx = canvas.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    return { w, h, ctx: canvas.getContext("2d"), resized };
  }

  function stop() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (resizeHandler) { window.removeEventListener("resize", resizeHandler); resizeHandler = null; }
    activeId = null; state = {}; lastTime = 0; currentOptions = {};
    if (canvasEl) {
      canvasEl.style.display = "none";
      canvasEl.style.zIndex = "1";
      canvasEl.style.backgroundColor = "";
      const ctx = canvasEl.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
    }
    canvasEl = null;
  }

  function start(sceneId, options, canvas) {
    stop();
    const scene = SCENES[sceneId];
    if (!scene || !canvas) return false;
    const opts = { ...scene.defaults, ...options };
    activeId = sceneId; currentOptions = opts; canvasEl = canvas;
    canvas.style.display = "block"; state = {};
    let dims = _syncCanvasSize(canvas);
    scene.init(state, dims.w, dims.h, opts);
    resizeHandler = () => { dims = _syncCanvasSize(canvas); scene.init(state, dims.w, dims.h, currentOptions); };
    window.addEventListener("resize", resizeHandler);
    lastTime = performance.now();
    function frame(now) {
      if (!activeId || canvasEl !== canvas) return;
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now; dims = _syncCanvasSize(canvas);
      if (dims.resized) scene.init(state, dims.w, dims.h, currentOptions);
      scene.draw(dims.ctx, dims.w, dims.h, state, currentOptions, dt);
      rafId = requestAnimationFrame(frame);
    }
    rafId = requestAnimationFrame(frame);
    return true;
  }

  function updateOptions(options) {
    if (!activeId || !canvasEl) return;
    const scene = SCENES[activeId];
    currentOptions = { ...scene.defaults, ...options };
    const dims = _syncCanvasSize(canvasEl);
    scene.init(state, dims.w, dims.h, currentOptions);
  }

  function list() {
    return Object.entries(SCENES).map(([id, s]) => ({ id, label: s.label, defaults: s.defaults, options: s.options }));
  }

  function get(id) { return SCENES[id] || null; }
  function isActiveCanvas(canvas) { return canvasEl === canvas; }


  const __helpers = { _hexToRgb, _mixHex, _makeSnowSprites, resetComet };

  return { start, stop, updateOptions, setOptions: updateOptions, list, get, isActiveCanvas, register, SCENES, __helpers };
})();

// origami/scene.js — origami scene module.
// GROUND-UP REBUILD (2026-09-05): the pre-split origami code was purged as
// corrupt/broken; this is a fresh implementation written against the reference
// contract (see scene-lab/prior-art/purged-scenes-2026-09-04/origami.js).
// Scene id, label, option keys, defaults, and preset bg colors stay stable so
// saved themes keep resolving.
//
// Look: paper shapes drifting through a calm dark room — origami cranes with
// folding wings, six-petal folded stars, and little fortune-teller boats. Each
// shape floats on its own wandering path, slowly rotating and flapping, its
// folds catching light on different faces as it turns. `density` is the number
// of shapes, `speed` paces the flight, `color` tints the paper.
//
// The crane body/wing drawing is adapted from the polished _drawCrane helper
// salvaged in scene-lab/prior-art/scene-variants/scene-helpers.js, tinted by
// the scene's color option instead of the fixed off-white palette.

(() => {
  const { _hexToRgb } = ThemeScenes.__helpers;

  function _rgba(c, a) {
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  }
  function _lighten(rgb, f) {
    return [
      Math.min(255, Math.round(rgb[0] + (255 - rgb[0]) * f)),
      Math.min(255, Math.round(rgb[1] + (255 - rgb[1]) * f)),
      Math.min(255, Math.round(rgb[2] + (255 - rgb[2]) * f)),
    ];
  }
  function _darken(rgb, f) {
    return [
      Math.round(rgb[0] * f),
      Math.round(rgb[1] * f),
      Math.round(rgb[2] * f),
    ];
  }

  // One crane wing (near or far), tinted from the paper color.
  function _craneWing(ctx, s, up, far, rgb) {
    const off = far ? -s * 0.09 : 0;
    ctx.globalAlpha *= far ? 0.85 : 1;
    ctx.fillStyle = _rgba(far ? _darken(rgb, 0.72) : _lighten(rgb, 0.12), 1);
    ctx.strokeStyle = _rgba(_darken(rgb, 0.5), 0.3);
    ctx.lineWidth = Math.max(0.5, s * 0.028);
    ctx.beginPath();
    ctx.moveTo(s * 0.06, -s * 0.04 + off);
    ctx.lineTo(-s * 0.42, -s * up * 1.05 + off);
    ctx.lineTo(-s * 0.18, s * 0.06 + off);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  // A full crane: body silhouette, head + beak, near/far wings, fold creases.
  function _drawCrane(ctx, x, y, s, flap, dir, alpha, rgb) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(dir, 1);
    ctx.globalAlpha = alpha;
    const wingUp = 0.35 + flap * 0.95;
    const paper = _lighten(rgb, 0.62); // near-white tinted paper
    const line = _rgba(_darken(rgb, 0.5), 0.35);
    // far wing — slightly smaller and behind
    _craneWing(ctx, s, wingUp * 0.92, true, rgb);
    // body silhouette: neck up-forward, thin body, tail raised
    ctx.fillStyle = _rgba(paper, 1);
    ctx.strokeStyle = line;
    ctx.lineWidth = Math.max(0.5, s * 0.03);
    ctx.beginPath();
    ctx.moveTo(s * 0.4, -s * 0.02);
    ctx.quadraticCurveTo(s * 0.5, -s * 0.3, s * 0.63, -s * 0.46);
    ctx.lineTo(s * 0.8, -s * 0.5);
    ctx.lineTo(s * 0.68, -s * 0.38);
    ctx.quadraticCurveTo(s * 0.5, -s * 0.28, s * 0.4, -s * 0.02);
    ctx.lineTo(-s * 0.38, s * 0.02);
    ctx.lineTo(-s * 0.62, -s * 0.36);
    ctx.lineTo(-s * 0.48, -s * 0.02);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // head + beak so the profile reads at small sizes
    ctx.fillStyle = _rgba(paper, 1);
    ctx.strokeStyle = line;
    ctx.lineWidth = Math.max(0.6, s * 0.035);
    ctx.beginPath();
    ctx.moveTo(s * 0.63, -s * 0.46);
    ctx.quadraticCurveTo(s * 0.68, -s * 0.6, s * 0.74, -s * 0.63);
    ctx.lineTo(s * 0.88, -s * 0.58);
    ctx.lineTo(s * 0.76, -s * 0.5);
    ctx.quadraticCurveTo(s * 0.68, -s * 0.44, s * 0.63, -s * 0.46);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // near wing
    _craneWing(ctx, s, wingUp, false, rgb);
    // fold creases
    ctx.strokeStyle = _rgba(_darken(rgb, 0.55), 0.4);
    ctx.lineWidth = Math.max(0.4, s * 0.02);
    ctx.beginPath();
    ctx.moveTo(s * 0.02, -s * 0.02);
    ctx.lineTo(-s * 0.28, -s * wingUp * 0.95);
    ctx.moveTo(s * 0.02, -s * 0.02);
    ctx.lineTo(s * 0.2, -s * 0.3);
    ctx.moveTo(-s * 0.24, -s * 0.1);
    ctx.lineTo(-s * 0.42, -s * 0.34);
    ctx.stroke();
    ctx.restore();
  }

  ThemeScenes.register("origami", {
    label: "Origami",
    defaults: { density: 10, speed: 1, color: "#f9a8d4" },
    presetBgColors: ["#020617", "#000000", "#0f172a", "#1a1a2e", "#1a0a2e", "#0d1117"],
    // Suggested paper color + background pairings, shown in the theme editor
    // as ONE split-swatch row under Background Color (each tile: color half
    // on the left, background half on the right). Halves click independently
    // so a background from one pair can mix with a color from another. The
    // first pair mirrors the scene defaults. Keys map to scene options; "bg"
    // is the background color (not a scene option).
    presetCombos: [
      { color: "#f9a8d4", bg: "#020617" }, // sakura pink on deep night (defaults)
      { color: "#a78bfa", bg: "#1a0a2e" }, // violet on plum
      { color: "#7dd3fc", bg: "#0a1628" }, // sky blue on navy
      { color: "#fbbf24", bg: "#1a1208" }, // gold on warm ink
      { color: "#86efac", bg: "#0a1a0a" }, // mint on green
      { color: "#f87171", bg: "#1c0f0c" }, // coral on ember shadow
    ],
    options: [
      { key: "density", label: "Shapes", type: "range", min: 3, max: 25, step: 1 },
      { key: "speed", label: "Speed", type: "range", min: 0.3, max: 3, step: 0.1 },
      { key: "color", label: "Color", type: "color" },
    ],
    init(state, w, h, opts) {
      state.t = 0;
      state.S = h / 1080;
      const S = state.S;
      const count = Math.round(opts.density ?? 10);
      state.shapes = [];
      for (let i = 0; i < count; i++) {
        state.shapes.push({
          x: Math.random() * w,
          y: Math.random() * h,
          vx: (Math.random() - 0.5) * 25 * S,
          vy: (Math.random() - 0.5) * 18 * S,
          rot: Math.random() * Math.PI * 2,
          rotSp: (Math.random() - 0.5) * 2,
          flap: Math.random() * Math.PI * 2,
          flapSp: Math.random() * 3 + 1.5,
          size: (Math.random() * 14 + 8) * S,
          type: Math.floor(Math.random() * 3),
          alpha: Math.random() * 0.3 + 0.5,
          dir: Math.random() < 0.5 ? 1 : -1,
          paper: Math.random() < 0.75 ? 1 : 0.6, // some shapes read as darker paper
        });
      }
    },

    draw(ctx, w, h, state, opts, dt) {
      const speed = opts.speed ?? 1;
      const color = opts.color || "#f9a8d4";
      const bgColor = opts.bgColor || null;
      state.t += dt;
      const t = state.t * speed;
      const dtm = dt * speed;
      const rgb = _hexToRgb(color);

      ctx.clearRect(0, 0, w, h);
      if (bgColor) {
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, w, h);
      } else {
        const bg = ctx.createLinearGradient(0, 0, 0, h);
        bg.addColorStop(0, "#02040f");
        bg.addColorStop(1, "#0b0f20");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);
      }

      for (const s of state.shapes) {
        s.rot += s.rotSp * dtm;
        s.flap += s.flapSp * dtm;
        s.x += s.vx * dtm;
        s.y += s.vy * dtm;
        s.vx += Math.sin(s.flap * 0.3) * 2 * dtm;
        s.vy += Math.cos(s.flap * 0.5) * 1.5 * dtm;
        s.vx *= 0.998;
        s.vy *= 0.998;
        if (s.x < -40) s.x = w + 40;
        if (s.x > w + 40) s.x = -40;
        if (s.y < -40) s.y = h + 40;
        if (s.y > h + 40) s.y = -40;

        const wingFold = Math.sin(s.flap) * 0.35;
        const sz = s.size;
        const paper = s.paper < 0.7 ? _darken(rgb, 0.75) : rgb;
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.rot);
        ctx.globalAlpha = s.alpha;

        if (s.type === 0) {
          // ── Origami crane ───────────────────────────────────────────
          _drawCrane(ctx, 0, 0, sz, wingFold, s.dir, s.alpha, paper);
        } else if (s.type === 1) {
          // ── Six-petal folded star ────────────────────────────────────
          ctx.fillStyle = _rgba(paper, 1);
          const petals = 6;
          for (let i = 0; i < petals; i++) {
            const a = (i / petals) * Math.PI * 2 + s.rot * 0.3;
            const shade = 0.6 + 0.4 * Math.sin(a + s.flap * 0.2);
            ctx.globalAlpha = s.alpha * shade;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(a - 0.2) * sz * 0.35, Math.sin(a - 0.2) * sz * 0.35);
            ctx.lineTo(Math.cos(a) * sz, Math.sin(a) * sz);
            ctx.lineTo(Math.cos(a + 0.2) * sz * 0.35, Math.sin(a + 0.2) * sz * 0.35);
            ctx.closePath();
            ctx.fill();
          }
          // fold creases from the center
          ctx.globalAlpha = s.alpha * 0.35;
          ctx.strokeStyle = _rgba(_darken(paper, 0.5), 0.5);
          ctx.lineWidth = Math.max(0.4, sz * 0.015);
          for (let i = 0; i < petals; i++) {
            const a = (i / petals) * Math.PI * 2 + s.rot * 0.3;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(a) * sz * 0.55, Math.sin(a) * sz * 0.55);
            ctx.stroke();
          }
        } else {
          // ── Fortune-teller boat ──────────────────────────────────────
          const bob = Math.sin(s.flap * 0.8) * sz * 0.05;
          ctx.fillStyle = _rgba(paper, 1);
          ctx.globalAlpha = s.alpha * 0.85;
          ctx.beginPath();
          ctx.moveTo(-sz * 0.7, bob);
          ctx.lineTo(-sz * 0.3, -sz * 0.5);
          ctx.lineTo(0, bob - sz * 0.1);
          ctx.lineTo(sz * 0.3, -sz * 0.5);
          ctx.lineTo(sz * 0.7, bob);
          ctx.lineTo(sz * 0.15, sz * 0.2);
          ctx.lineTo(-sz * 0.15, sz * 0.2);
          ctx.closePath();
          ctx.fill();
          // fold creases
          ctx.globalAlpha = s.alpha * 0.3;
          ctx.strokeStyle = _rgba(_darken(paper, 0.5), 0.45);
          ctx.lineWidth = Math.max(0.4, sz * 0.015);
          ctx.beginPath();
          ctx.moveTo(-sz * 0.3, -sz * 0.5);
          ctx.lineTo(0, sz * 0.2);
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(sz * 0.3, -sz * 0.5);
          ctx.lineTo(0, sz * 0.2);
          ctx.stroke();
        }
        ctx.restore();
      }
      ctx.globalAlpha = 1;
    },
  });
})();
const canvas = document.getElementById('c');
const scene = ThemeScenes.get('origami');
const optsRow = document.getElementById('opts');
const info = document.getElementById('info');
const opts = { ...scene.defaults };
const labels = {};
optsRow.innerHTML = '';
scene.options.forEach(opt => {
  const lab = document.createElement('label');
  lab.textContent = opt.label + ': ';
  if (opt.type === 'range') {
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = opt.min; inp.max = opt.max; inp.step = opt.step;
    inp.value = opts[opt.key];
    inp.oninput = () => {
      opts[opt.key] = parseFloat(inp.value);
      lab.textContent = opt.label + ': ' + inp.value + ' ';
      lab.appendChild(inp); // textContent above cleared it — put it back
      ThemeScenes.updateOptions(opts);
    };
    lab.appendChild(inp);
  } else if (opt.type === 'color') {
    const inp = document.createElement('input');
    inp.type = 'color'; inp.value = opts[opt.key];
    inp.oninput = () => { opts[opt.key] = inp.value; ThemeScenes.updateOptions(opts); };
    lab.appendChild(inp);
  } else if (opt.type === 'select') {
    const sel = document.createElement('select');
    opt.choices.forEach(([v, l]) => {
      const o = document.createElement('option'); o.value = v; o.textContent = l;
      if (String(opts[opt.key]) === String(v)) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = () => { opts[opt.key] = sel.value; ThemeScenes.updateOptions(opts); };
    lab.appendChild(sel);
  }
  labels[opt.key] = lab;
  optsRow.appendChild(lab);
});
ThemeScenes.start('origami', opts, canvas);
document.getElementById('reroll').onclick = () => ThemeScenes.updateOptions(opts);
info.textContent = 'origami — ' + scene.label + ' (1280x800)';
</script>
</body>
</html>
