<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Preview — ornate</title>
<style>
  body { background:#101018; color:#e8e8ee; font-family:system-ui; margin:0; padding:16px; display:flex; flex-direction:column; gap:10px; align-items:center; }
  canvas { width:min(960px, 94vw); aspect-ratio:16/10; background:#000; border-radius:10px; }
  #opts { display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:center; font-size:13px; color:#bbb; }
  input[type=range], input[type=color] { vertical-align:middle; }
  button { background:#2a2a35; color:#e8e8ee; border:1px solid #4a4a5a; border-radius:6px; padding:4px 12px; font-size:13px; cursor:pointer; }
  button:hover { background:#3a3a48; }
  #info { font-size:12px; color:#888; }
</style>
</head>
<body>
<div id="opts"></div>
<button id="reroll" type="button">↻ Re-roll layout</button>
<canvas id="c" width="1280" height="800"></canvas>
<div id="info"></div>
<script>
// core.js — ThemeScenes core (registry + shared helpers + runtime).
// Generated by scripts/split-scenes.js from the pre-split assets/js/theme-scenes.js
// (2026-09-04). Helpers/runtime bodies are verbatim; additions: register(),
// __helpers export, empty SCENES registry (populated by per-scene modules).
// NOTE: named core.js, not _core.js — Jekyll drops underscore-prefixed files
// from static dirs, so the underscore prefix would 404 on the live site.
const ThemeScenes = (() => {
  const SCENES = {};

  function register(id, def) { SCENES[id] = def; }

  let _snowSpriteCache = null;
  function _makeSnowSprites() {
    const levels = [];
    for (let lv = 0; lv < 4; lv++) {
      const frames = [];
      const sz = 32;
      for (let fi = 0; fi < 16; fi++) {
        const c = document.createElement('canvas');
        c.width = c.height = sz;
        const x = c.getContext('2d');
        const cx = sz / 2, cy = sz / 2;
        const rot = (fi / 16) * Math.PI * 2;
        const arms = lv + 3;
        const armLen = sz * 0.35;
        const coreR = sz * (0.06 + lv * 0.02);
        x.save();
        x.translate(cx, cy);
        x.rotate(rot);
        // core glow
        const glow = x.createRadialGradient(0, 0, 0, 0, 0, coreR * 3);
        glow.addColorStop(0, 'rgba(232,237,245,0.5)');
        glow.addColorStop(1, 'rgba(232,237,245,0)');
        x.fillStyle = glow;
        x.beginPath(); x.arc(0, 0, coreR * 3, 0, Math.PI * 2); x.fill();
        // crystal arms
        x.strokeStyle = 'rgba(232,237,245,0.9)';
        x.lineWidth = 1 + lv * 0.3;
        x.lineCap = 'round';
        for (let a = 0; a < arms; a++) {
          const angle = (a / arms) * Math.PI * 2;
          x.beginPath();
          x.moveTo(0, 0);
          x.lineTo(Math.cos(angle) * armLen, Math.sin(angle) * armLen);
          x.stroke();
          // side branches on larger flakes
          if (lv >= 1) {
            const bLen = armLen * 0.4;
            const bDist = armLen * 0.6;
            const bx = Math.cos(angle) * bDist;
            const by = Math.sin(angle) * bDist;
            for (let s = -1; s <= 1; s += 2) {
              const ba = angle + s * Math.PI / 4;
              x.beginPath();
              x.moveTo(bx, by);
              x.lineTo(bx + Math.cos(ba) * bLen, by + Math.sin(ba) * bLen);
              x.stroke();
            }
          }
        }
        // center dot
        x.fillStyle = 'rgba(255,255,255,0.9)';
        x.beginPath(); x.arc(0, 0, coreR, 0, Math.PI * 2); x.fill();
        x.restore();
        frames.push(c);
      }
      levels.push(frames);
    }
    return levels;
  }

  function _mixHex(hex1, hex2, t) {
    const [r1, g1, b1] = _hexToRgb(hex1);
    const [r2, g2, b2] = _hexToRgb(hex2);
    return `rgb(${Math.round(r1 + (r2 - r1) * t)},${Math.round(g1 + (g2 - g1) * t)},${Math.round(b1 + (b2 - b1) * t)})`;
  }

  function _hexToRgb(hex) {
    if (!hex || typeof hex !== "string") return [167, 139, 250];
    const clean = hex.replace("#", "");
    if (clean.length < 6) return [167, 139, 250];
    return [parseInt(clean.slice(0, 2), 16), parseInt(clean.slice(2, 4), 16), parseInt(clean.slice(4, 6), 16)];
  }

  function resetComet(c, w, h, speed) {
    c.vx = (Math.random() - 0.5) * 200;
    c.vy = (Math.random() - 0.5) * 200;
    c.speed = (Math.random() * 0.5 + 0.5) * speed;
    c.trail = [];
    c.maxTrail = Math.floor(Math.random() * 20 + 15);
    c.alpha = Math.random() * 0.4 + 0.3;
  }

  let activeId = null;
  let rafId = null;
  let canvasEl = null;
  let state = {};
  let lastTime = 0;
  let currentOptions = {};
  let resizeHandler = null;

  function _syncCanvasSize(canvas) {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.floor(rect.width));
    const h = Math.max(1, Math.floor(rect.height));
    const pw = Math.floor(w * dpr), ph = Math.floor(h * dpr);
    const resized = canvas.width !== pw || canvas.height !== ph;
    if (resized) {
      canvas.width = pw; canvas.height = ph;
      const ctx = canvas.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    return { w, h, ctx: canvas.getContext("2d"), resized };
  }

  function stop() {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    if (resizeHandler) { window.removeEventListener("resize", resizeHandler); resizeHandler = null; }
    activeId = null; state = {}; lastTime = 0; currentOptions = {};
    if (canvasEl) {
      canvasEl.style.display = "none";
      canvasEl.style.zIndex = "1";
      canvasEl.style.backgroundColor = "";
      const ctx = canvasEl.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
    }
    canvasEl = null;
  }

  function start(sceneId, options, canvas) {
    stop();
    const scene = SCENES[sceneId];
    if (!scene || !canvas) return false;
    const opts = { ...scene.defaults, ...options };
    activeId = sceneId; currentOptions = opts; canvasEl = canvas;
    canvas.style.display = "block"; state = {};
    let dims = _syncCanvasSize(canvas);
    scene.init(state, dims.w, dims.h, opts);
    resizeHandler = () => { dims = _syncCanvasSize(canvas); scene.init(state, dims.w, dims.h, currentOptions); };
    window.addEventListener("resize", resizeHandler);
    lastTime = performance.now();
    function frame(now) {
      if (!activeId || canvasEl !== canvas) return;
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now; dims = _syncCanvasSize(canvas);
      if (dims.resized) scene.init(state, dims.w, dims.h, currentOptions);
      scene.draw(dims.ctx, dims.w, dims.h, state, currentOptions, dt);
      rafId = requestAnimationFrame(frame);
    }
    rafId = requestAnimationFrame(frame);
    return true;
  }

  function updateOptions(options) {
    if (!activeId || !canvasEl) return;
    const scene = SCENES[activeId];
    currentOptions = { ...scene.defaults, ...options };
    const dims = _syncCanvasSize(canvasEl);
    scene.init(state, dims.w, dims.h, currentOptions);
  }

  function list() {
    return Object.entries(SCENES).map(([id, s]) => ({ id, label: s.label, defaults: s.defaults, options: s.options }));
  }

  function get(id) { return SCENES[id] || null; }
  function isActiveCanvas(canvas) { return canvasEl === canvas; }


  const __helpers = { _hexToRgb, _mixHex, _makeSnowSprites, resetComet };

  return { start, stop, updateOptions, setOptions: updateOptions, list, get, isActiveCanvas, register, SCENES, __helpers };
})();

// ornate/scene.js — ornate scene module.
// GROUND-UP REBUILD (2026-09-05): the pre-split ornate code was purged as
// corrupt/broken; this is a fresh implementation written against the reference
// contract (see scene-lab/prior-art/purged-scenes-2026-09-04/ornate.js).
// Scene id, label, option keys, defaults, and preset bg colors stay stable so
// saved themes keep resolving.
//
// Look: a slowly breathing mandala of light. Concentric rings of filigree
// petals spin in alternating directions around a glowing jewel at the center;
// each ring is linked by slender arcs, the whole mandala swells and eases on
// a slow breath, and a soft outer glow bleeds into the dark. `density` is the
// number of rings, `speed` paces the rotation/breathing, `scale` sizes the
// mandala, `color` tints everything.

(() => {
  const { _hexToRgb } = ThemeScenes.__helpers;

  function _rgba(c, a) {
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  }

  ThemeScenes.register("ornate", {
    label: "Ornate",
    defaults: { density: 8, speed: 1, color: "#fbbf24", scale: 1 },
    presetBgColors: ["#020617", "#000000", "#1a0f08", "#0f172a", "#1e1208", "#0d1117"],
    // Suggested ornament color + background pairings, shown in the theme
    // editor as ONE split-swatch row under Background Color (each tile: color
    // half on the left, background half on the right). Halves click
    // independently so a background from one pair can mix with a color from
    // another. The first pair mirrors the scene defaults. Keys map to scene
    // options; "bg" is the background color (not a scene option).
    presetCombos: [
      { color: "#fbbf24", bg: "#020617" }, // gold on night (defaults)
      { color: "#f472b6", bg: "#1a0a2e" }, // pink gold on plum
      { color: "#a78bfa", bg: "#0a0015" }, // violet on dark purple
      { color: "#22d3ee", bg: "#0a1a2e" }, // cyan on abyss
      { color: "#f87171", bg: "#1c0f0c" }, // crimson on ember dark
      { color: "#e2e8f0", bg: "#1e1208" }, // ivory on toasted dark
    ],
    options: [
      { key: "density", label: "Rings", type: "range", min: 3, max: 15, step: 1 },
      { key: "speed", label: "Rotation", type: "range", min: 0.1, max: 2, step: 0.1 },
      { key: "scale", label: "Size", type: "range", min: 0.5, max: 2, step: 0.1 },
      { key: "color", label: "Color", type: "color" },
    ],
    init(state, w, h, opts) {
      state.t = 0;
      state.S = h / 1080;
    },

    draw(ctx, w, h, state, opts, dt) {
      const speed = opts.speed ?? 1;
      const color = opts.color || "#fbbf24";
      const bgColor = opts.bgColor || null;
      const sc = opts.scale ?? 1;
      const rings = Math.round(opts.density ?? 8);
      state.t += dt;
      const t = state.t * speed;
      const S = state.S;
      const TAU = Math.PI * 2;
      const rgb = _hexToRgb(color);

      ctx.clearRect(0, 0, w, h);
      if (bgColor) {
        ctx.fillStyle = bgColor;
        ctx.fillRect(0, 0, w, h);
      } else {
        const bg = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.max(w, h) * 0.6);
        bg.addColorStop(0, "#0d0a12");
        bg.addColorStop(1, "#02040a");
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);
      }

      const cx = w / 2, cy = h / 2;
      const maxR = Math.min(w, h) * 0.42 * sc;

      ctx.save();
      ctx.translate(cx, cy);
      // breathing pulse
      const breathe = 1 + 0.06 * Math.sin(t * 1.5);
      ctx.scale(breathe, breathe);

      // outer glow
      const glowR = maxR * 1.1;
      const glow = ctx.createRadialGradient(0, 0, maxR * 0.3, 0, 0, glowR);
      glow.addColorStop(0, _rgba(rgb, 0.06));
      glow.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = glow;
      ctx.fillRect(-glowR, -glowR, glowR * 2, glowR * 2);

      // ── Rings: petals + connecting arcs, alternating rotation ───────
      for (let r = 0; r < rings; r++) {
        const fr = r / Math.max(1, rings - 1);
        const radius = maxR * 0.12 + fr * maxR * 0.88;
        const petals = 5 + Math.floor(r * 2.5);
        const rot = t * (0.3 + r * 0.08) * (r % 2 === 0 ? 1 : -1);
        const ringAlpha = 0.15 + (1 - fr) * 0.35;

        // petal glow ring
        ctx.globalAlpha = ringAlpha * 0.15;
        const rg = ctx.createRadialGradient(0, 0, radius - 8, 0, 0, radius + 8);
        rg.addColorStop(0, "rgba(0,0,0,0)");
        rg.addColorStop(0.5, color);
        rg.addColorStop(1, "rgba(0,0,0,0)");
        ctx.strokeStyle = rg;
        ctx.lineWidth = 12 * sc * S;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, TAU);
        ctx.stroke();

        // filigree teardrop petals
        for (let p = 0; p < petals; p++) {
          const a = (p / petals) * TAU + rot;
          const px = Math.cos(a) * radius, py = Math.sin(a) * radius;
          const ps = (5 + r * 0.8) * sc * S;
          const breathe2 = 0.8 + 0.2 * Math.sin(t * 2 + p * 0.5 + r);
          ctx.globalAlpha = ringAlpha * (0.4 + 0.3 * breathe2);
          ctx.fillStyle = color;
          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(a);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-ps * 0.6, -ps * 0.8, -ps * 0.3, -ps * 1.8, 0, -ps * 2);
          ctx.bezierCurveTo(ps * 0.3, -ps * 1.8, ps * 0.6, -ps * 0.8, 0, 0);
          ctx.fill();
          ctx.restore();
        }

        // connecting arcs between petals
        ctx.globalAlpha = ringAlpha * 0.25;
        ctx.strokeStyle = color;
        ctx.lineWidth = 0.7 * sc * S;
        for (let p = 0; p < petals; p++) {
          const a1 = (p / petals) * TAU + rot;
          const a2 = ((p + 1) / petals) * TAU + rot;
          const mx = Math.cos((a1 + a2) / 2) * radius * 0.92;
          const my = Math.sin((a1 + a2) / 2) * radius * 0.92;
          ctx.beginPath();
          ctx.moveTo(Math.cos(a1) * radius, Math.sin(a1) * radius);
          ctx.quadraticCurveTo(mx, my, Math.cos(a2) * radius, Math.sin(a2) * radius);
          ctx.stroke();
        }
      }

      // ── Center mandala jewel ─────────────────────────────────────────
      ctx.globalAlpha = 0.9;
      for (let s = 3; s >= 0; s--) {
        const jr = (8 + s * 4) * sc * S;
        const jg = ctx.createRadialGradient(0, 0, 0, 0, 0, jr);
        jg.addColorStop(0, "rgba(255,250,220,0.9)");
        jg.addColorStop(0.3, _rgba(rgb, 0.6));
        jg.addColorStop(0.7, _rgba(rgb, 0.15));
        jg.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = jg;
        ctx.beginPath();
        ctx.arc(0, 0, jr, 0, TAU);
        ctx.fill();
      }

      // tiny inner spokes
      ctx.globalAlpha = 0.35;
      ctx.strokeStyle = color;
      ctx.lineWidth = 0.5 * sc * S;
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * TAU + t * 0.5;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 12 * sc * S, Math.sin(a) * 12 * sc * S);
        ctx.lineTo(Math.cos(a) * maxR * 0.15, Math.sin(a) * maxR * 0.15);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.restore();

      // ── Vignette ──────────────────────────────────────────────────────
      const vig = ctx.createRadialGradient(cx, cy, maxR * 1.15, cx, cy, Math.max(w, h) * 0.72);
      vig.addColorStop(0, "rgba(0,0,0,0)");
      vig.addColorStop(1, "rgba(0,0,0,0.42)");
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, w, h);
    },
  });
})();
const canvas = document.getElementById('c');
const scene = ThemeScenes.get('ornate');
const optsRow = document.getElementById('opts');
const info = document.getElementById('info');
const opts = { ...scene.defaults };
const labels = {};
optsRow.innerHTML = '';
scene.options.forEach(opt => {
  const lab = document.createElement('label');
  lab.textContent = opt.label + ': ';
  if (opt.type === 'range') {
    const inp = document.createElement('input');
    inp.type = 'range'; inp.min = opt.min; inp.max = opt.max; inp.step = opt.step;
    inp.value = opts[opt.key];
    inp.oninput = () => {
      opts[opt.key] = parseFloat(inp.value);
      lab.textContent = opt.label + ': ' + inp.value + ' ';
      lab.appendChild(inp); // textContent above cleared it — put it back
      ThemeScenes.updateOptions(opts);
    };
    lab.appendChild(inp);
  } else if (opt.type === 'color') {
    const inp = document.createElement('input');
    inp.type = 'color'; inp.value = opts[opt.key];
    inp.oninput = () => { opts[opt.key] = inp.value; ThemeScenes.updateOptions(opts); };
    lab.appendChild(inp);
  } else if (opt.type === 'select') {
    const sel = document.createElement('select');
    opt.choices.forEach(([v, l]) => {
      const o = document.createElement('option'); o.value = v; o.textContent = l;
      if (String(opts[opt.key]) === String(v)) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = () => { opts[opt.key] = sel.value; ThemeScenes.updateOptions(opts); };
    lab.appendChild(sel);
  }
  labels[opt.key] = lab;
  optsRow.appendChild(lab);
});
ThemeScenes.start('ornate', opts, canvas);
document.getElementById('reroll').onclick = () => ThemeScenes.updateOptions(opts);
info.textContent = 'ornate — ' + scene.label + ' (1280x800)';
</script>
</body>
</html>
