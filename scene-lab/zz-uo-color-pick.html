<!doctype html><meta charset=utf-8><title>color pick</title>
<style>body{background:#0a1222;color:#e6edf7;font:13px system-ui;padding:20px}
.r{display:flex;gap:32px;align-items:center;margin-bottom:18px;background:#131f38;padding:12px;border-radius:10px}
.lbl{width:180px;font-size:11px;opacity:.7} img{image-rendering:pixelated;background:#0a1222;padding:4px}
svg{background:#0a1222;padding:4px}</style>
<div id=rows></div>
<script>
fetch('zz-uo-icons8-check-data.json').then(r=>r.json()).then(D=>{
  document.getElementById('rows').innerHTML = D.map(([fn,src,traced])=>`
  <div class=r><div class=lbl>${fn}</div>
    <img src="${src}" width=96 height=96>
    <svg width=96 height=96 viewBox="${traced.vb}" fill="#e6edf7"><path d="${traced.d}"/></svg>
    <svg width=24 height=24 viewBox="${traced.vb}" fill="#e6edf7"><path d="${traced.d}"/></svg>
    <svg width=14 height=14 viewBox="${traced.vb}" fill="#e6edf7"><path d="${traced.d}"/></svg>
  </div>`).join('');
});
</script>
